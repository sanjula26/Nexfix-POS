name: Users Permissions Hardening Retry

on:
  push:
    branches: [users-permissions-final-retry]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply hardening
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/lib/store.tsx')
          s=p.read_text()
          reps=[
          ("""  const saveUser = useCallback((u: AppUser) => {\n    const exists = state.users.some(x => x.id === u.id);""", """  const saveUser = useCallback((u: AppUser) => {\n    if (!user || user.role !== 'admin') {\n      pushAudit('DENIED', 'User', `Blocked user save for ${u.email || u.name || u.id}`);\n      return;\n    }\n    const exists = state.users.some(x => x.id === u.id);"""),
          ("""  }, [state.users, pushAudit]);\n\n  const toggleUserActive = useCallback((id: string) => {\n    const u = state.users.find(x => x.id === id);""", """  }, [state.users, pushAudit, user]);\n\n  const toggleUserActive = useCallback((id: string) => {\n    if (!user || user.role !== 'admin') {\n      pushAudit('DENIED', 'User', `Blocked user status change for ${id}`);\n      return;\n    }\n    const u = state.users.find(x => x.id === id);"""),
          ("""  }, [state.users, pushAudit]);\n\n  const deleteUser = useCallback((id: string) => {\n    const u = state.users.find(x => x.id === id);""", """  }, [state.users, pushAudit, user]);\n\n  const deleteUser = useCallback((id: string) => {\n    if (!user || user.role !== 'admin') {\n      pushAudit('DENIED', 'User', `Blocked user delete for ${id}`);\n      return;\n    }\n    const u = state.users.find(x => x.id === id);"""),
          ("""  }, [state.users, user?.id, pushAudit]);\n\n  /* ---------------- admin ---------------- */\n  const setPermission = useCallback((role: Role, key: string, value: boolean) => {\n    if (role === 'admin') return;""", """  }, [state.users, user?.id, pushAudit, user]);\n\n  /* ---------------- admin ---------------- */\n  const setPermission = useCallback((role: Role, key: string, value: boolean) => {\n    if (!user || user.role !== 'admin') {\n      pushAudit('DENIED', 'Permissions', `Blocked permission change for ${role}:${key}`);\n      return;\n    }\n    if (role === 'admin') return;"""),
          ("""  }, [pushAudit]);\n\n  const updateSettings = useCallback((patch: Partial<Settings>) => {\n    setState(s => ({ ...s, settings: { ...s.settings, ...patch } }));""", """  }, [pushAudit, user]);\n\n  const updateSettings = useCallback((patch: Partial<Settings>) => {\n    if (!user || user.role !== 'admin') {\n      pushAudit('DENIED', 'Settings', `Blocked settings update: ${Object.keys(patch).join(', ')}`);\n      return;\n    }\n    setState(s => ({ ...s, settings: { ...s.settings, ...patch } }));"""),
          ("""  }, [pushAudit]);\n\n  const closeSession = useCallback""", """  }, [pushAudit, user]);\n\n  const closeSession = useCallback""")]
          for a,b in reps:
              if a not in s: raise SystemExit('expected source pattern missing')
              s=s.replace(a,b,1)
          p.write_text(s)
      - name: Verify guards
        run: |
          grep -q "Blocked user save" src/lib/store.tsx
          grep -q "Blocked user status change" src/lib/store.tsx
          grep -q "Blocked user delete" src/lib/store.tsx
          grep -q "Blocked permission change" src/lib/store.tsx
          grep -q "Blocked settings update" src/lib/store.tsx
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit source and remove retry workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/users-permissions-final-retry.yml
          git add src/lib/store.tsx
          git commit -m "security: harden users permissions and settings actions"
          git push