name: One-time cloud sale hardening
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-cloud-sale-hardening.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden pending cloud sale persistence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/store.tsx')
          s = p.read_text()
          old = """  if (idbAvailable()) {\n    await idbSaveState(state);\n  }\n  // Track write for offline queue (future cloud sync)"""
          new = """  if (idbAvailable()) {\n    const saved = await idbSaveState(state);\n    // Keep the cloud-sale idempotency marker until the authoritative sale is\n    // durably persisted locally. This closes the crash window between the\n    // cloud transaction commit and the debounced local state write.\n    if (saved) {\n      try {\n        const pendingKey = 'nexfix_pending_cloud_sale_v2';\n        const raw = localStorage.getItem(pendingKey);\n        if (raw) {\n          const pending = JSON.parse(raw) as { saleId?: string };\n          if (pending.saleId && state.sales.some(sale => sale.id === pending.saleId)) {\n            localStorage.removeItem(pendingKey);\n          }\n        }\n      } catch { /* ignore malformed/stale marker */ }\n    }\n  }\n  // Track write for offline queue (future cloud sync)"""
          if old not in s:
              raise SystemExit('persistState anchor not found')
          s = s.replace(old, new, 1)
          old2 = """    try { localStorage.removeItem(pendingKey); } catch { /* ignore */ }\n    syncToGoogleDrive('SalesHistory', [sale]);"""
          new2 = """    // The pending marker is cleared only after durable local persistence.\n    syncToGoogleDrive('SalesHistory', [sale]);"""
          if old2 not in s:
              raise SystemExit('pending-key cleanup anchor not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit source fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/store.tsx .github/workflows/one-time-cloud-sale-hardening.yml
          git commit -m 'fix: persist cloud sale idempotency marker durably' -- src/lib/store.tsx .github/workflows/one-time-cloud-sale-hardening.yml
          git push
          git rm .github/workflows/one-time-cloud-sale-hardening.yml
          git commit -m 'chore: remove temporary hardening workflow'
          git push
