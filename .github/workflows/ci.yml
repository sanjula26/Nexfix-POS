name: Nexfix POS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

      - name: Verify production bundle has no retired demo passwords
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'admin123|cashier123' dist 2>/dev/null; then
            echo 'Retired demo password literal found in the production bundle.'
            exit 1
          fi
