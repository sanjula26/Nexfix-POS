name: Nexfix POS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply refund integrity patch
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/store.tsx')
          s = p.read_text()
          start = s.index("  const refundSale = useCallback((saleId: string) => {")
          end = s.index("\n\n  /* ---------------- held sales ---------------- */", start)
          new = '''  const refundSale = useCallback((saleId: string) => {\n    const sale = state.sales.find(x => x.id === saleId);\n    if (!sale || sale.status !== 'completed') return;\n\n    const priorReturnedByLine = new Map<number, number>();\n    for (const ex of state.exchanges.filter(x => x.billNo === sale.billNo)) {\n      for (const item of ex.items) if (item.itemIdx !== undefined) {\n        priorReturnedByLine.set(item.itemIdx, (priorReturnedByLine.get(item.itemIdx) || 0) + item.qty);\n      }\n    }\n    const remainingItems = sale.items.map((it, idx) => ({ it, idx, qty: Math.max(0, it.qty - (priorReturnedByLine.get(idx) || 0)) })).filter(x => x.qty > 0);\n    if (remainingItems.length === 0) return;\n\n    const refundQtyByProduct = new Map<string, number>();\n    for (const { it, qty } of remainingItems) refundQtyByProduct.set(it.productId, (refundQtyByProduct.get(it.productId) || 0) + qty);\n    const merchandiseGross = remainingItems.reduce((sum, { it, qty }) => sum + it.price * qty, 0);\n    const merchandiseDiscount = remainingItems.reduce((sum, { it, qty }) => sum + (it.qty > 0 ? (it.discount || 0) * (qty / it.qty) : 0), 0);\n    const returnedMerchandise = Math.max(0, merchandiseGross - merchandiseDiscount);\n    const saleSubtotal = Math.max(0, sale.subtotal);\n    const saleDiscount = Math.min(Math.max(0, sale.discount || 0), saleSubtotal);\n    const postDiscountSubtotal = Math.max(0, saleSubtotal - saleDiscount);\n    const allocatedDiscount = Math.min(saleDiscount, returnedMerchandise * (saleSubtotal > 0 ? saleDiscount / saleSubtotal : 0));\n    const taxableReturned = Math.max(0, returnedMerchandise - allocatedDiscount);\n    const taxRefund = postDiscountSubtotal > 0 ? Math.round((sale.tax || 0) * (taxableReturned / postDiscountSubtotal) * 100) / 100 : 0;\n    const fullReturn = remainingItems.length === sale.items.length && remainingItems.every(({ it, qty }) => qty === it.qty);\n    const shippingRefund = fullReturn ? Math.max(0, sale.shipping || 0) : 0;\n    const refundValue = Math.max(0, Math.round((taxableReturned + taxRefund + shippingRefund) * 100) / 100);\n\n    setStateWithInventoryLedger('REFUND', s => {\n      const currentSale = s.sales.find(x => x.id === saleId);\n      if (!currentSale || currentSale.status !== 'completed') return s;\n      const currentReturnedByLine = new Map<number, number>();\n      for (const ex of s.exchanges.filter(x => x.billNo === currentSale.billNo)) {\n        for (const item of ex.items) if (item.itemIdx !== undefined) {\n          currentReturnedByLine.set(item.itemIdx, (currentReturnedByLine.get(item.itemIdx) || 0) + item.qty);\n        }\n      }\n      const currentRemaining = currentSale.items.map((it, idx) => Math.max(0, it.qty - (currentReturnedByLine.get(idx) || 0)));\n      if (!currentRemaining.some(q => q > 0)) return s;\n      const qtyByProduct = new Map<string, number>();\n      currentSale.items.forEach((it, idx) => {\n        const qty = currentRemaining[idx];\n        if (qty > 0) qtyByProduct.set(it.productId, (qtyByProduct.get(it.productId) || 0) + qty);\n      });\n      const returnedUnitIds = currentSale.items.flatMap(it => it.unitIds || []).filter(id => s.units.some(u => u.id === id && u.status === 'sold' && u.saleId === currentSale.id));\n      const allReturned = currentRemaining.every(q => q === 0);\n      const creditDue = currentSale.amountPaid < currentSale.total ? Math.max(0, currentSale.total - currentSale.amountPaid) : 0;\n      const creditReduction = Math.min(creditDue, refundValue);\n      const returnedRatio = currentSale.total > 0 ? Math.min(1, refundValue / currentSale.total) : 1;\n      const pointsEarnedToReverse = Math.min(currentSale.pointsEarned || 0, Math.round((currentSale.pointsEarned || 0) * returnedRatio));\n      const pointsToRestore = Math.min(currentSale.pointsRedeemed || 0, Math.round((currentSale.pointsRedeemed || 0) * returnedRatio));\n      return {\n        ...s,\n        sales: s.sales.map(x => x.id === saleId ? { ...x, status: allReturned ? 'refunded' : 'completed' } : x),\n        products: s.products.map(p => { const qty = qtyByProduct.get(p.id); return qty !== undefined ? { ...p, stock: p.stock + qty } : p; }),\n        customers: s.customers.map(c => c.id === currentSale.customerId ? { ...c, creditBalance: Math.max(0, c.creditBalance - creditReduction), loyaltyPoints: Math.max(0, c.loyaltyPoints - pointsEarnedToReverse + pointsToRestore) } : c),\n        units: (s.units || []).map(u => returnedUnitIds.includes(u.id) ? { ...u, status: 'returned' as const, saleId: undefined, saleBillNo: undefined, soldAt: undefined } : u),\n      };\n    });\n    pushAudit('REFUND', 'Sale', `Refunded bill ${sale.billNo} · Rs. ${refundValue.toLocaleString()}${sale.items.flatMap(it => it.unitIds || []).length ? ` · tracked unit(s) returned` : ''}`);\n  }, [state.sales, state.exchanges, state.units, pushAudit]);'''
          s = s[:start] + new + s[end:]
          p.write_text(s)

          p = Path('src/pages/Exchanges.tsx')
          s = p.read_text()
          s = s.replace("return a + bill.items[i].price * qty - discount;", "return a + Math.max(0, bill.items[i].price * qty - discount);", 1)
          s = s.replace('Restock the selected item(s) and mark the bill as exchanged. Hand the replacement at the counter.', 'Restock the selected returned item(s) and mark the bill as exchanged. The replacement item must be processed as a separate sale so its stock and revenue are recorded.', 1)
          p.write_text(s)
          temp = Path('.github/workflows/patch-refund-integrity.yml')
          if temp.exists(): temp.unlink()
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit patched source and restore CI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/ci.yml')
          s = p.read_text()
          marker = "      - name: Apply refund integrity patch\n"
          start = s.find(marker)
          if start >= 0:
              end = s.find("      - name: Typecheck\n", start)
              s = s[:start] + s[end:]
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/store.tsx src/pages/Exchanges.tsx .github/workflows/ci.yml .github/workflows/patch-refund-integrity.yml
          git commit -m 'fix: harden refund and exchange integrity'
          git push
