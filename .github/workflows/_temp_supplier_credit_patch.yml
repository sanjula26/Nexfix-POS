name: Temporary Supplier Credit Patch
on:
  push:
    branches: [feature/supplier-credit-controls]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused supplier and credit-limit changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if s.count(old) != count:
                  raise SystemExit(f'{path}: expected {count} matches, found {s.count(old)}')
              p.write_text(s.replace(old,new,count))

          # Store: supplier payment API + durable migration + server-side credit limit enforcement.
          replace('src/lib/store.tsx',
            "  POSState, Product, Customer, Supplier, Sale, Purchase, Expense, Exchange,\n  AppUser, AuditEntry, HeldSale, Settings, Role, SaleItem, PaymentMethod, PaymentLeg, DaySession,\n  InventoryUnit, RepairJob, RepairStatus, PurchaseReturn, PurchaseReturnItem,\n} from './types';",
            "  POSState, Product, Customer, Supplier, Sale, Purchase, Expense, Exchange,\n  AppUser, AuditEntry, HeldSale, Settings, Role, SaleItem, PaymentMethod, PaymentLeg, DaySession,\n  InventoryUnit, RepairJob, RepairStatus, PurchaseReturn, PurchaseReturnItem,\n} from './types';\nimport type { SupplierPayment } from './supplierPayments';\nimport { getSupplierOutstanding } from './supplierPayments';")
          replace('src/lib/store.tsx',
            "  saveSupplier: (s: Supplier) => void;\n  deleteSupplier: (id: string) => void;",
            "  saveSupplier: (s: Supplier) => void;\n  deleteSupplier: (id: string) => void;\n  saveSupplierPayment: (p: Omit<SupplierPayment, 'id' | 'date' | 'by'>) => void;\n  deleteSupplierPayment: (id: string) => void;")
          replace('src/lib/store.tsx',
            "    purchaseReturns: s.purchaseReturns || [],\n    settings:",
            "    purchaseReturns: s.purchaseReturns || [],\n    supplierPayments: s.supplierPayments || [],\n    settings:")
          replace('src/lib/store.tsx',
            "  const deleteSupplier = useCallback((id: string) => {\n    const sp = state.suppliers.find(x => x.id === id);\n    setState(s => ({ ...s, suppliers: s.suppliers.filter(x => x.id !== id) }));\n    if (sp) pushAudit('DELETE', 'Supplier', `Deleted supplier ${sp.name}`);\n  }, [state.suppliers, pushAudit]);\n\n  /* ---------------- sales ---------------- */",
            "  const deleteSupplier = useCallback((id: string) => {\n    const sp = state.suppliers.find(x => x.id === id);\n    setState(s => ({ ...s, suppliers: s.suppliers.filter(x => x.id !== id) }));\n    if (sp) pushAudit('DELETE', 'Supplier', `Deleted supplier ${sp.name}`);\n  }, [state.suppliers, pushAudit]);\n\n  const saveSupplierPayment = useCallback((p: Omit<SupplierPayment, 'id' | 'date' | 'by'>) => {\n    if (!user || !Number.isFinite(p.amount) || p.amount <= 0) return;\n    const supplier = state.suppliers.find(s => s.id === p.supplierId);\n    if (!supplier) return;\n    if (p.purchaseId) {\n      const purchase = state.purchases.find(x => x.id === p.purchaseId);\n      if (!purchase || purchase.supplierId !== p.supplierId || purchase.status !== 'received') return;\n    }\n    const outstanding = getSupplierOutstanding(p.supplierId, state.purchases, state.supplierPayments || [], state.purchaseReturns || []);\n    if (p.amount > outstanding + 0.005) return;\n    const payment: SupplierPayment = { ...p, id: uid(), date: new Date().toISOString(), by: user.name };\n    setState(s => ({ ...s, supplierPayments: [payment, ...(s.supplierPayments || [])] }));\n    pushAudit('CREATE', 'SupplierPayment', `Payment of Rs. ${p.amount.toLocaleString()} to supplier ${supplier.name}`);\n  }, [pushAudit, state.purchaseReturns, state.purchases, state.suppliers, state.supplierPayments, user]);\n\n  const deleteSupplierPayment = useCallback((id: string) => {\n    if (!user || !can('act:deleteRecords')) return;\n    const payment = state.supplierPayments?.find(x => x.id === id);\n    setState(s => ({ ...s, supplierPayments: (s.supplierPayments || []).filter(x => x.id !== id) }));\n    if (payment) pushAudit('DELETE', 'SupplierPayment', `Deleted supplier payment of Rs. ${payment.amount.toLocaleString()}`);\n  }, [can, pushAudit, state.supplierPayments, user]);\n\n  /* ---------------- sales ---------------- */")
          replace('src/lib/store.tsx',
            "    const balanceDue = isCredit ? Math.max(0, total - amountPaid) : 0;\n    // PHASE1_MACHINE_TRACKING_V1",
            "    const balanceDue = isCredit ? Math.max(0, total - amountPaid) : 0;\n    if (isCredit && cust?.creditLimit && cust.creditLimit > 0 && cust.creditBalance + balanceDue > cust.creditLimit + 0.005) return null;\n    // PHASE1_MACHINE_TRACKING_V1")
          replace('src/lib/store.tsx',
            "    saveSupplier, deleteSupplier,\n",
            "    saveSupplier, deleteSupplier, saveSupplierPayment, deleteSupplierPayment,\n")

          # POS: show a useful validation message before the store-level safety check.
          replace('src/pages/POS.tsx',
            "    if (hasCredit && !can('act:creditSale')) return setError('Your role cannot make credit sales');",
            "    if (hasCredit && !can('act:creditSale')) return setError('Your role cannot make credit sales');\n    if (hasCredit && customer?.creditLimit && customer.creditLimit > 0) {\n      const newBalance = customer.creditBalance + Math.max(0, total - paidNum);\n      if (newBalance > customer.creditLimit + 0.005) return setError(`Credit limit exceeded. Available credit: ${fmtRs(Math.max(0, customer.creditLimit - customer.creditBalance))}`);\n    }")

          # Customers: expose the existing optional creditLimit field in the editor.
          replace('src/pages/Customers.tsx',
            "            <Field label=\"Address\">\n              <input className=\"input\" value={editing.address || ''} onChange={e => setEditing({ ...editing, address: e.target.value })} placeholder=\"Street, City\" />\n            </Field>\n            <Field label=\"Loyalty points\"",
            "            <Field label=\"Address\">\n              <input className=\"input\" value={editing.address || ''} onChange={e => setEditing({ ...editing, address: e.target.value })} placeholder=\"Street, City\" />\n            </Field>\n            <Field label=\"Credit Limit (Rs.)\" hint=\"0 = no limit. Credit sales are blocked above this limit\">\n              <input className=\"input num\" type=\"number\" min={0} value={editing.creditLimit || ''}\n                onChange={e => setEditing({ ...editing, creditLimit: Math.max(0, Number(e.target.value) || 0) || undefined })}\n                placeholder=\"0 (unlimited)\" />\n            </Field>\n            <Field label=\"Loyalty points\"")

          # Supplier ledger: include purchase returns, so debit notes reduce payable balance.
          replace('src/lib/supplierPayments.ts',
            "import type { Purchase, Supplier } from './types';",
            "import type { Purchase, PurchaseReturn, Supplier } from './types';")
          replace('src/lib/supplierPayments.ts',
            "  type: 'purchase' | 'payment';",
            "  type: 'purchase' | 'purchase_return' | 'payment';")
          replace('src/lib/supplierPayments.ts',
            "  payments: readonly SupplierPayment[],\n): SupplierAccountLedgerRow[] {\n  const rows: Array<{ date: string; type: 'purchase' | 'payment'; reference: string; amount: number; paymentMethod?: SupplierPaymentMethod }> = [];",
            "  payments: readonly SupplierPayment[],\n  purchaseReturns: readonly PurchaseReturn[] = [],\n): SupplierAccountLedgerRow[] {\n  const rows: Array<{ date: string; type: 'purchase' | 'purchase_return' | 'payment'; reference: string; amount: number; paymentMethod?: SupplierPaymentMethod }> = [];")
          replace('src/lib/supplierPayments.ts',
            "  for (const payment of payments) {",
            "  for (const purchaseReturn of purchaseReturns) {\n    if (purchaseReturn.supplierId !== supplier.id || !Number.isFinite(purchaseReturn.total) || purchaseReturn.total <= 0) continue;\n    rows.push({ date: purchaseReturn.date, type: 'purchase_return', reference: purchaseReturn.dnNo, amount: -purchaseReturn.total });\n  }\n\n  for (const payment of payments) {")
          replace('src/lib/supplierPayments.ts',
            "  payments: readonly SupplierPayment[],\n): number {\n  const purchased = purchases",
            "  payments: readonly SupplierPayment[],\n  purchaseReturns: readonly PurchaseReturn[] = [],\n): number {\n  const purchased = purchases")
          replace('src/lib/supplierPayments.ts',
            "  const paid = payments\n    .filter(p => p.supplierId === supplierId && Number.isFinite(p.amount) && p.amount > 0)\n    .reduce((sum, p) => sum + p.amount, 0);\n  return Math.max(0, Math.round((purchased - paid) * 100) / 100);",
            "  const returned = purchaseReturns\n    .filter(r => r.supplierId === supplierId && Number.isFinite(r.total) && r.total > 0)\n    .reduce((sum, r) => sum + r.total, 0);\n  const paid = payments\n    .filter(p => p.supplierId === supplierId && Number.isFinite(p.amount) && p.amount > 0)\n    .reduce((sum, p) => sum + p.amount, 0);\n  return Math.max(0, Math.round((purchased - returned - paid) * 100) / 100);")

          # Suppliers: add outstanding column and payment modal, without replacing the existing supplier editor.
          p=Path('src/pages/Suppliers.tsx'); s=p.read_text()
          s=s.replace("import { Plus, Pencil, Trash2, Phone, Mail, Truck, Package } from 'lucide-react';", "import { Plus, Pencil, Trash2, Phone, Mail, Truck, Package, CreditCard } from 'lucide-react';")
          s=s.replace("import type { Supplier } from '../lib/types';", "import type { Supplier } from '../lib/types';\nimport type { SupplierPaymentMethod } from '../lib/supplierPayments';\nimport { getSupplierOutstanding } from '../lib/supplierPayments';")
          s=s.replace("const { state, saveSupplier, deleteSupplier, can } = usePOS();", "const { state, saveSupplier, deleteSupplier, saveSupplierPayment, can } = usePOS();")
          s=s.replace("  const [deleting, setDeleting] = useState<Supplier | null>(null);", "  const [deleting, setDeleting] = useState<Supplier | null>(null);\n  const [paymentFor, setPaymentFor] = useState<Supplier | null>(null);\n  const [paymentAmount, setPaymentAmount] = useState('');\n  const [paymentMethod, setPaymentMethod] = useState<SupplierPaymentMethod>('cash');\n  const [paymentNote, setPaymentNote] = useState('');")
          s=s.replace("  const productCount = (id: string) => state.products.filter(p => p.supplierId === id).length;", "  const productCount = (id: string) => state.products.filter(p => p.supplierId === id).length;\n  const outstanding = (id: string) => getSupplierOutstanding(id, state.purchases, state.supplierPayments || [], state.purchaseReturns || []);")
          s=s.replace("<th className=\"th\">Products</th><th className=\"th !text-right\">Actions</th>", "<th className=\"th\">Products</th><th className=\"th\">Outstanding</th><th className=\"th !text-right\">Actions</th>")
          s=s.replace("<td className=\"td\">\n                      <Badge tone=\"slate\" className=\"num\"><Package size={10} /> {fmtNum(productCount(s.id))} items</Badge>\n                    </td>\n                    <td className=\"td\">", "<td className=\"td\">\n                      <Badge tone=\"slate\" className=\"num\"><Package size={10} /> {fmtNum(productCount(s.id))} items</Badge>\n                    </td>\n                    <td className=\"td\">\n                      <Badge tone={outstanding(s.id) > 0 ? 'amber' : 'emerald'} className=\"num\">{fmtNum(outstanding(s.id)) === '0' ? 'Rs. 0.00' : `Rs. ${outstanding(s.id).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`}</Badge>\n                    </td>\n                    <td className=\"td\">")
          s=s.replace("<button className=\"icon-btn !w-8 !h-8\" onClick={() => { setEditing({ ...s }); setIsNew(false); }}><Pencil size={14} /></button>", "<button className=\"btn btn-outline !py-1.5 !px-2.5 !text-xs\" disabled={outstanding(s.id) <= 0} onClick={() => { setPaymentFor(s); setPaymentAmount(''); setPaymentMethod('cash'); setPaymentNote(''); }}><CreditCard size={13} /> Pay</button>\n                        <button className=\"icon-btn !w-8 !h-8\" onClick={() => { setEditing({ ...s }); setIsNew(false); }}><Pencil size={14} /></button>")
          marker="      <Modal open={!!deleting} onClose={() => setDeleting(null)} title=\"Delete supplier?\" sub={deleting?.name}>"
          payment_modal="      <Modal open={!!paymentFor} onClose={() => setPaymentFor(null)} title=\"Record supplier payment\" sub={paymentFor ? `${paymentFor.name} · Outstanding ${outstanding(paymentFor.id).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}` : undefined}>\n        {paymentFor && (\n          <div className=\"space-y-4\">\n            <Field label=\"Amount (Rs.)\">\n              <input className=\"input num\" type=\"number\" min={0} max={outstanding(paymentFor.id)} value={paymentAmount} onChange={e => setPaymentAmount(e.target.value)} placeholder=\"0.00\" />\n            </Field>\n            <Field label=\"Payment method\">\n              <select className=\"input\" value={paymentMethod} onChange={e => setPaymentMethod(e.target.value as SupplierPaymentMethod)}>\n                <option value=\"cash\">Cash</option><option value=\"card\">Card</option><option value=\"bank\">Bank</option><option value=\"mobile\">Mobile</option>\n              </select>\n            </Field>\n            <Field label=\"Note\">\n              <input className=\"input\" value={paymentNote} onChange={e => setPaymentNote(e.target.value)} placeholder=\"Optional reference / note\" />\n            </Field>\n            <div className=\"flex gap-2.5\">\n              <button className=\"btn btn-primary flex-1\" disabled={!Number.isFinite(Number(paymentAmount)) || Number(paymentAmount) <= 0 || Number(paymentAmount) > outstanding(paymentFor.id) + 0.005} onClick={() => { saveSupplierPayment({ supplierId: paymentFor.id, amount: Number(paymentAmount), method: paymentMethod, note: paymentNote.trim() || undefined }); setPaymentFor(null); }}><CreditCard size={15} /> Record payment</button>\n              <button className=\"btn btn-soft\" onClick={() => setPaymentFor(null)}>Cancel</button>\n            </div>\n          </div>\n        )}\n      </Modal>\n\n"
          if marker not in s: raise SystemExit('Suppliers.tsx: delete modal marker missing')
          s=s.replace(marker,payment_modal+marker,1)
          p.write_text(s)

          # Ensure supplier payment state is initialized even when migrating an older snapshot.
          print('focused patch complete')
          PY
      - name: Verify and commit
        run: |
          npm install
          npm run typecheck
          npm run lint
          npm run build
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_temp_supplier_credit_patch.yml
          git add src/lib/store.tsx src/lib/supplierPayments.ts src/pages/POS.tsx src/pages/Customers.tsx src/pages/Suppliers.tsx
          git commit -m 'feat: enforce customer credit limits and add supplier payments'
          git push