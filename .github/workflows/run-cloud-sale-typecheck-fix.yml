name: Run cloud sale typecheck fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-cloud-sale-typecheck-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/cloud-sale-typecheck-fix.py
      - name: Commit and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store.tsx scripts/cloud-sale-typecheck-fix.py .github/workflows/run-cloud-sale-typecheck-fix.yml
          git diff --cached --check
          git rm scripts/cloud-sale-typecheck-fix.py .github/workflows/run-cloud-sale-typecheck-fix.yml
          git commit -m "fix: narrow authoritative cloud sale response"
          git push
