name: Apply Nexfix POS Step 1 fix
on:
  push:
    branches:
      - 'fix/step1-sale-stock-validation'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch duplicate-product stock handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/store.tsx')
          text = p.read_text()
          old = """    const items: SaleItem[] = [];\n    const soldUnitIds: string[] = [];\n    for (const l of input.lines) {\n      const p = s.products.find(x => x.id === l.productId);\n      if (!p) return null;\n      // Hard block selling more than available stock\n      if (l.qty <= 0 || l.qty > p.stock) return null;\n"""
          new = """    const items: SaleItem[] = [];\n    const soldUnitIds: string[] = [];\n    const requestedQtyByProduct = new Map<string, number>();\n    for (const l of input.lines) {\n      const p = s.products.find(x => x.id === l.productId);\n      if (!p) return null;\n      // Aggregate duplicate cart lines before validating stock so the same product\n      // cannot consume more stock than is actually available.\n      const requestedQty = (requestedQtyByProduct.get(l.productId) || 0) + l.qty;\n      if (!Number.isFinite(l.qty) || l.qty <= 0 || requestedQty > p.stock) return null;\n      requestedQtyByProduct.set(l.productId, requestedQty);\n"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected validation block exactly once; found {text.count(old)}')
          text = text.replace(old, new)
          old2 = """    const updatedProducts = s.products.map(p => {\n      const line = input.lines.find(l => l.productId === p.id);\n      return line ? { ...p, stock: Math.max(0, p.stock - line.qty) } : p;\n    });\n"""
          new2 = """    // Deduct the aggregate quantity for each product, including duplicate cart lines.\n    const updatedProducts = s.products.map(p => {\n      const qty = requestedQtyByProduct.get(p.id);\n      return qty !== undefined ? { ...p, stock: Math.max(0, p.stock - qty) } : p;\n    });\n"""
          if text.count(old2) != 1:
              raise SystemExit(f'Expected stock deduction block exactly once; found {text.count(old2)}')
          text = text.replace(old2, new2)
          p.write_text(text)
          PY
      - name: Verify source patch
        run: |
          grep -n "requestedQtyByProduct" src/lib/store.tsx
          npm ci
          npm run typecheck
          npm run build
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/nexfix-step1-fix.yml
          git add src/lib/store.tsx
          git commit -m "Fix duplicate-product stock validation in sales"
          git push
