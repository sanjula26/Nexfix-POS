name: one-time repair warranty hardening
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  harden:
    if: github.actor == 'sanjula26'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch repair and warranty persistence
        shell: python
        run: |
          from pathlib import Path
          import re

          store = Path('src/lib/store.tsx')
          s = store.read_text()
          s = s.replace('InventoryUnit, RepairJob, RepairStatus, PurchaseReturn, PurchaseReturnItem,', 'InventoryUnit, RepairJob, RepairStatus, PurchaseReturn, PurchaseReturnItem, WarrantyClaim, ClaimStatus,')
          s = s.replace('  saveRepair: (r: RepairJob) => void;\n', '  saveRepair: (r: RepairJob) => void;\n  saveWarrantyClaim: (c: WarrantyClaim) => void;\n')
          s = s.replace("  operation: 'SALE' | 'REFUND' | 'PURCHASE_RECEIVE' | 'EXCHANGE' | 'STOCK_ADJUSTMENT' | 'PURCHASE_REVERSAL' | 'PURCHASE_REVERSAL',", "  operation: 'SALE' | 'REFUND' | 'PURCHASE_RECEIVE' | 'EXCHANGE' | 'STOCK_ADJUSTMENT' | 'PURCHASE_REVERSAL' | 'REPAIR_PART',")
          marker = "  /* ---------------- repairs ---------------- */"
          end = "  const saveCategory = useCallback"
          a = s.index(marker)
          b = s.index(end, a)
          replacement = r'''  /* ---------------- repairs ---------------- */
  const saveRepair = useCallback((r: RepairJob) => {
    if (!user) { pushAudit('DENIED', 'Repair', `Blocked repair save for ${r.jobNo || r.id}`); return; }
    const customerName = String(r.customerName || '').trim();
    const deviceType = String(r.deviceType || '').trim();
    const deviceBrand = String(r.deviceBrand || '').trim();
    const deviceModel = String(r.deviceModel || '').trim();
    const fault = String(r.fault || '').trim();
    const laborCost = Number(r.laborCost);
    const advancePaid = r.advancePaid === undefined ? 0 : Number(r.advancePaid);
    const warrantyDays = r.warrantyDays === undefined ? 0 : Number(r.warrantyDays);
    if (!customerName || !deviceType || !deviceModel || !fault || !Number.isFinite(laborCost) || laborCost < 0 || !Number.isFinite(advancePaid) || advancePaid < 0 || !Number.isFinite(warrantyDays) || warrantyDays < 0 || !Number.isInteger(warrantyDays)) {
      pushAudit('DENIED', 'Repair', `Blocked invalid repair input for ${r.jobNo || r.id}`);
      return;
    }
    const normalizedParts = (r.parts || []).map(p => ({ ...p, name: String(p.name || '').trim(), qty: Number(p.qty), cost: Number(p.cost) }));
    if (normalizedParts.some(p => !p.name || !Number.isInteger(p.qty) || p.qty <= 0 || !Number.isFinite(p.cost) || p.cost < 0 || (p.productId && !state.products.some(x => x.id === p.productId)))) {
      pushAudit('DENIED', 'Repair', `Blocked invalid repair part input for ${r.jobNo || r.id}`);
      return;
    }
    const existing = (state.repairs || []).find(x => x.id === r.id);
    let duplicateCode = false;
    const job = { ...r, customerName, deviceType, deviceBrand, deviceModel, fault, diagnosis: r.diagnosis?.trim() || undefined, imei: r.imei?.trim() || undefined, serial: r.serial?.trim() || undefined, customerPhone: r.customerPhone?.trim() || undefined, laborCost: Math.round(laborCost * 100) / 100, advancePaid: Math.round(advancePaid * 100) / 100, warrantyDays: Math.round(warrantyDays), parts: normalizedParts };
    setState(s => {
      const sameJobNo = s.repairs.some(x => x.id !== job.id && x.jobNo.trim().toLowerCase() === job.jobNo.trim().toLowerCase() && job.jobNo.trim() !== '');
      if (sameJobNo) { duplicateCode = true; return s; }
      let nextJob = job;
      let counters = s.counters;
      if (!existing && (!job.jobNo || job.jobNo.startsWith('JOB-TEMP'))) {
        const seq = (s.counters.job || 0) + 1;
        nextJob = { ...job, jobNo: `JOB-${String(seq).padStart(4, '0')}`, by: job.by || user.name };
        counters = { ...s.counters, job: seq };
      }
      const oldParts = new Map<string, number>();
      const newParts = new Map<string, number>();
      for (const p of existing?.parts || []) if (p.productId) oldParts.set(p.productId, (oldParts.get(p.productId) || 0) + p.qty);
      for (const p of nextJob.parts || []) if (p.productId) newParts.set(p.productId, (newParts.get(p.productId) || 0) + p.qty);
      for (const [productId, qty] of newParts) {
        const delta = qty - (oldParts.get(productId) || 0);
        const product = s.products.find(x => x.id === productId);
        if (delta > 0 && (!product || product.stock < delta)) return s;
      }
      for (const [productId, qty] of oldParts) {
        const delta = qty - (newParts.get(productId) || 0);
        if (delta <= 0) continue;
      }
      const products = s.products.map(p => {
        const oldQty = oldParts.get(p.id) || 0;
        const newQty = newParts.get(p.id) || 0;
        const delta = newQty - oldQty;
        return delta ? { ...p, stock: p.stock - delta } : p;
      });
      return { ...s, products, counters, repairs: existing ? s.repairs.map(x => x.id === job.id ? nextJob : x) : [nextJob, ...s.repairs] };
    });
    if (duplicateCode) pushAudit('DENIED', 'Repair', `Blocked duplicate repair job number ${r.jobNo}`);
    else pushAudit(existing ? 'UPDATE' : 'CREATE', 'Repair', `${existing ? 'Updated' : 'Opened'} ${r.jobNo || 'job'} · ${deviceBrand} ${deviceModel}`);
  }, [pushAudit, state.products, state.repairs, user]);

  const updateRepairStatus = useCallback((id: string, status: RepairStatus, patch?: Partial<RepairJob>) => {
    if (!user || !['received', 'diagnosed', 'waiting_parts', 'in_repair', 'ready', 'delivered', 'cancelled'].includes(status)) { pushAudit('DENIED', 'Repair', `Blocked repair status update for ${id}`); return; }
    const current = (state.repairs || []).find(x => x.id === id);
    if (!current) return;
    const now = new Date().toISOString();
    setState(s => ({ ...s, repairs: (s.repairs || []).map(j => j.id === id ? { ...j, ...patch, status, ...(status === 'ready' || status === 'delivered' ? { completedAt: j.completedAt || now } : {}), ...(status === 'delivered' ? { deliveredAt: now } : {}) } : j) }));
    pushAudit('STATUS', 'Repair', `${current.jobNo} → ${status}`);
  }, [pushAudit, state.repairs, user]);

  const deleteRepair = useCallback((id: string) => {
    if (!user || !can('act:deleteRecords')) { pushAudit('DENIED', 'Repair', `Blocked repair delete for ${id}`); return; }
    const j = (state.repairs || []).find(x => x.id === id);
    if (!j) return;
    if (j.status !== 'cancelled' && j.status !== 'delivered') { pushAudit('DENIED', 'Repair', `Blocked deletion of active repair ${j.jobNo}`); return; }
    setState(s => {
      const current = (s.repairs || []).find(x => x.id === id);
      if (!current) return s;
      const returned = new Map<string, number>();
      for (const p of current.parts || []) if (p.productId) returned.set(p.productId, (returned.get(p.productId) || 0) + p.qty);
      return { ...s, products: s.products.map(p => { const qty = returned.get(p.id) || 0; return qty ? { ...p, stock: p.stock + qty } : p; }), repairs: s.repairs.filter(x => x.id !== id) };
    });
    pushAudit('DELETE', 'Repair', `Deleted ${j.jobNo} and restored tracked part stock`);
  }, [can, pushAudit, state.repairs, user]);

  const saveWarrantyClaim = useCallback((c: WarrantyClaim) => {
    if (!user) { pushAudit('DENIED', 'WarrantyClaim', `Blocked warranty claim save for ${c.id}`); return; }
    const productName = String(c.productName || '').trim();
    const issueDescription = String(c.issueDescription || '').trim();
    const validStatuses: ClaimStatus[] = ['open', 'approved', 'rejected', 'replaced', 'repaired', 'closed'];
    if (!productName || !issueDescription || !validStatuses.includes(c.status)) { pushAudit('DENIED', 'WarrantyClaim', `Blocked invalid warranty claim ${c.claimNo || c.id}`); return; }
    const existing = (state.warrantyClaims || []).some(x => x.id === c.id);
    let duplicate = false;
    setState(s => {
      const sameClaimNo = s.warrantyClaims?.some(x => x.id !== c.id && x.claimNo.trim().toLowerCase() === c.claimNo.trim().toLowerCase() && c.claimNo.trim() !== '');
      if (sameClaimNo) { duplicate = true; return s; }
      let claim = { ...c, productName, issueDescription, customerName: c.customerName?.trim() || undefined, imeiOrSerial: c.imeiOrSerial?.trim() || undefined, resolutionNotes: c.resolutionNotes?.trim() || undefined, closedAt: c.status === 'closed' ? (c.closedAt || new Date().toISOString()) : undefined };
      let counters = s.counters;
      if (!existing && (!claim.claimNo || claim.claimNo === 'CL-TEMP')) {
        const seq = (s.counters.claim || 0) + 1;
        claim = { ...claim, claimNo: `CL-${String(seq).padStart(4, '0')}`, by: claim.by || user.name };
        counters = { ...s.counters, claim: seq };
      }
      return { ...s, warrantyClaims: existing ? (s.warrantyClaims || []).map(x => x.id === claim.id ? claim : x) : [claim, ...(s.warrantyClaims || [])], counters };
    });
    if (duplicate) pushAudit('DENIED', 'WarrantyClaim', `Blocked duplicate claim number ${c.claimNo}`);
    else pushAudit(existing ? 'UPDATE' : 'CREATE', 'WarrantyClaim', `${existing ? 'Updated' : 'Created'} ${c.claimNo || 'claim'} · ${productName}`);
  }, [pushAudit, state.warrantyClaims, user]);

'''
          s = s[:a] + replacement + s[b:]
          s = s.replace('    saveRepair, updateRepairStatus, deleteRepair,\n', '    saveRepair, updateRepairStatus, deleteRepair, saveWarrantyClaim,\n')
          store.write_text(s)

          page = Path('src/pages/WarrantyClaims.tsx')
          page.write_text(r'''import { useMemo, useState } from 'react';
import { Shield, Plus } from 'lucide-react';
import { usePOS } from '../lib/store';
import { Badge, Modal, Field, PageHeading, EmptyState, SearchInput } from '../components/ui';
import { fmtDate, uid } from '../lib/utils';
import type { WarrantyClaim, ClaimStatus } from '../lib/types';

const STATUS_TONE: Record<ClaimStatus, 'slate' | 'blue' | 'emerald' | 'rose' | 'amber' | 'violet'> = {
  open: 'amber', approved: 'blue', rejected: 'rose', replaced: 'violet', repaired: 'emerald', closed: 'slate',
};

export default function WarrantyClaims() {
  const { state, user, saveWarrantyClaim } = usePOS();
  const [q, setQ] = useState('');
  const claims = state.warrantyClaims || [];
  const [editing, setEditing] = useState<WarrantyClaim | null>(null);
  const [isNew, setIsNew] = useState(false);

  const rows = useMemo(() => {
    const query = q.trim().toLowerCase();
    return claims.filter(c => !query || c.claimNo.toLowerCase().includes(query) || c.productName.toLowerCase().includes(query) ||
      (c.customerName || '').toLowerCase().includes(query) || (c.imeiOrSerial || '').toLowerCase().includes(query));
  }, [claims, q]);

  const openNew = () => {
    if (!user) return;
    setEditing({ id: uid(), claimNo: 'CL-TEMP', productName: '', issueDescription: '', status: 'open', createdAt: new Date().toISOString(), by: user.name });
    setIsNew(true);
  };

  const save = () => {
    if (!editing || !editing.productName.trim() || !editing.issueDescription.trim()) return;
    saveWarrantyClaim({ ...editing, productName: editing.productName.trim(), issueDescription: editing.issueDescription.trim() });
    setEditing(null);
    setIsNew(false);
  };

  return (
    <div className="space-y-4">
      <PageHeading chip="Service" title="Warranty Claims" sub="Track claims linked to sold IMEI / Serial units"
        actions={<button type="button" onClick={openNew} className="btn btn-primary"><Plus size={16} /> New Claim</button>} />
      <SearchInput value={q} onChange={setQ} placeholder="Search claim, product, IMEI…" />
      {rows.length === 0 ? <EmptyState icon={<Shield size={28} />} title="No warranty claims" sub="Register a claim when a customer returns a unit under warranty." /> : (
        <div className="card overflow-hidden"><table className="w-full text-sm"><thead className="bg-raised/60 text-left text-[11px] uppercase tracking-wider text-sub"><tr>
          <th className="px-4 py-3">Claim #</th><th className="px-4 py-3">Product</th><th className="px-4 py-3">IMEI / Serial</th><th className="px-4 py-3">Customer</th><th className="px-4 py-3">Status</th><th className="px-4 py-3">Date</th>
        </tr></thead><tbody>{rows.map(r => <tr key={r.id} className="border-t border-line hover:bg-raised/40 cursor-pointer" onClick={() => { setEditing({ ...r }); setIsNew(false); }}>
          <td className="px-4 py-3 font-semibold">{r.claimNo}</td><td className="px-4 py-3">{r.productName}</td><td className="px-4 py-3 font-mono text-xs">{r.imeiOrSerial || '—'}</td><td className="px-4 py-3">{r.customerName || '—'}</td><td className="px-4 py-3"><Badge tone={STATUS_TONE[r.status]}>{r.status}</Badge></td><td className="px-4 py-3 text-sub">{fmtDate(r.createdAt)}</td>
        </tr>)}</tbody></table></div>
      )}
      <Modal open={!!editing} onClose={() => setEditing(null)} title={isNew ? 'New Warranty Claim' : editing?.claimNo || 'Claim'}>
        {editing && <div className="space-y-3">
          <Field label="Product name"><input className="input" value={editing.productName} onChange={e => setEditing({ ...editing, productName: e.target.value })} /></Field>
          <Field label="IMEI / Serial"><input className="input" value={editing.imeiOrSerial || ''} onChange={e => setEditing({ ...editing, imeiOrSerial: e.target.value })} /></Field>
          <Field label="Customer name"><input className="input" value={editing.customerName || ''} onChange={e => setEditing({ ...editing, customerName: e.target.value })} /></Field>
          <Field label="Issue description"><textarea className="input min-h-[80px]" value={editing.issueDescription} onChange={e => setEditing({ ...editing, issueDescription: e.target.value })} /></Field>
          {!isNew && <Field label="Status"><select className="input" value={editing.status} onChange={e => setEditing({ ...editing, status: e.target.value as ClaimStatus })}>{(Object.keys(STATUS_TONE) as ClaimStatus[]).map(s => <option key={s} value={s}>{s}</option>)}</select></Field>}
          <Field label="Resolution notes"><textarea className="input min-h-[60px]" value={editing.resolutionNotes || ''} onChange={e => setEditing({ ...editing, resolutionNotes: e.target.value })} /></Field>
          <div className="flex justify-end gap-2 pt-2"><button type="button" className="btn btn-soft" onClick={() => setEditing(null)}>Cancel</button><button type="button" className="btn btn-primary" onClick={save}>Save</button></div>
        </div>}
      </Modal>
    </div>
  );
}
''')

          # Make Repairs UI select actual inventory parts and avoid editing status through two competing controls.
          repairs = Path('src/pages/Repairs.tsx')
          r = repairs.read_text()
          r = r.replace("  const [partCost, setPartCost] = useState(0);", "  const [partCost, setPartCost] = useState(0);\n  const [partProductId, setPartProductId] = useState('');")
          r = r.replace("    setPartCost(0);\n  };\n\n  const addPart", "    setPartCost(0);\n    setPartProductId('');\n  };\n\n  const addPart")
          r = r.replace("    const part: RepairPart = { name: partName.trim(), qty: 1, cost: partCost };", "    const product = partProductId ? state.products.find(p => p.id === partProductId) : undefined;\n    const part: RepairPart = { productId: product?.id, name: (product?.name || partName).trim(), qty: 1, cost: partCost };" )
          old = '<div className="flex gap-2 mt-2"><input className="input flex-1" placeholder="Part name" value={partName} onChange={e => setPartName(e.target.value)} /><input className="input w-24 num" type="number" min="0" step="0.01" placeholder="Cost" value={partCost || \'\'} onChange={e => setPartCost(Number(e.target.value) || 0)} /><button type="button" className="btn btn-soft" onClick={addPart}>Add</button></div>'
          new = '<div className="grid grid-cols-[1fr_1fr_90px_auto] gap-2 mt-2"><select className="input" value={partProductId} onChange={e => { const id = e.target.value; setPartProductId(id); const p = state.products.find(x => x.id === id); if (p) { setPartName(p.name); setPartCost(p.cost); } }}><option value="">Non-stock part</option>{state.products.filter(p => p.active).map(p => <option key={p.id} value={p.id}>{p.name} · stock {p.stock}</option>)}</select><input className="input" placeholder="Part name" value={partName} onChange={e => e.target.value && setPartName(e.target.value)} /><input className="input num" type="number" min="0" step="0.01" placeholder="Cost" value={partCost || \'\'} onChange={e => setPartCost(Number(e.target.value) || 0)} /><button type="button" className="btn btn-soft" onClick={addPart}>Add</button></div>'
          r = r.replace(old, new)
          repairs.write_text(r)

      - name: Verify source changes
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit hardening and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store.tsx src/pages/WarrantyClaims.tsx src/pages/Repairs.tsx
          git rm .github/workflows/one-time-repair-warranty-hardening.yml
          git commit -m "security: harden repair and warranty workflows"
          git push origin main
