name: Users Permissions Hardening (one-time)

on:
  push:
    branches:
      - users-permissions-hardening-clean

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch store guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/lib/store.tsx')
          s = p.read_text()
          patches = [
            (r"  const saveUser = useCallback\(\(u: AppUser\) => \{\n", "    if (!user || user.role !== 'admin') {\n      pushAudit('DENIED', 'User', f'Blocked user save for {u.email or u.name or u.id}')\n      return\n    }\n"),
            (r"  const toggleUserActive = useCallback\(\(id: string\) => \{\n", "    if (!user || user.role != 'admin') {\n      pushAudit('DENIED', 'User', f'Blocked user status change for {id}')\n      return\n    }\n"),
            (r"  const deleteUser = useCallback\(\(id: string\) => \{\n", "    if (!user || user.role != 'admin') {\n      pushAudit('DENIED', 'User', f'Blocked user delete for {id}')\n      return\n    }\n"),
            (r"  const setPermission = useCallback\(\(role: Role, key: string, value: boolean\) => \{\n", "    if (!user || user.role != 'admin') {\n      pushAudit('DENIED', 'Permissions', f'Blocked permission change for {role}:{key}')\n      return\n    }\n"),
            (r"  const updateSettings = useCallback\(\(patch: Partial<Settings>\) => \{\n", "    if (!user || user.role != 'admin') {\n      pushAudit('DENIED', 'Settings', f'Blocked settings update: {",".join([])}')\n      return\n    }\n"),
          ]
          for pattern, body in patches:
              s2, n = re.subn(pattern, lambda m: m.group(0) + body, s, count=1)
              if n != 1:
                  raise SystemExit(f'target not found: {pattern}')
              s = s2
          p.write_text(s)
          PY
      - name: Typecheck
        run: npm install --no-audit --no-fund && npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/users-permissions-hardening-clean.yml
          git add src/lib/store.tsx
          git diff --cached --check
          git commit -m "security: harden users permissions and settings actions"
          git push origin HEAD:users-permissions-hardening-clean
