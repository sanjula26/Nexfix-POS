name: one-time repairs warranty hardening
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-repairs-warranty-hardening.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch store
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/store.tsx')
          s = p.read_text()
          s = s.replace('  InventoryUnit, RepairJob, RepairStatus, PurchaseReturn, PurchaseReturnItem,', '  InventoryUnit, RepairJob, RepairStatus, PurchaseReturn, PurchaseReturnItem, WarrantyClaim,')
          s = s.replace('  deleteRepair: (id: string) => void;\n', '  deleteRepair: (id: string) => void;\n  saveWarrantyClaim: (c: WarrantyClaim) => void;\n')
          old = '''  const saveRepair = useCallback((r: RepairJob) => {
    const exists = (state.repairs || []).some(x => x.id === r.id);
    setState(s => {
      let job = r;
      let counters = s.counters;
      if (!exists && (!r.jobNo || r.jobNo.startsWith('JOB-TEMP'))) {
        const seq = (s.counters.job || 0) + 1;
        job = { ...r, jobNo: `JOB-${String(seq).padStart(4, '0')}` };
        counters = { ...s.counters, job: seq };
      }
      // Deduct parts from stock when first saved with parts (simple model)
      let products = s.products;
      if (!exists && job.parts?.length) {
        products = s.products.map(p => {
          const part = job.parts.find(pt => pt.productId === p.id);
          return part ? { ...p, stock: Math.max(0, p.stock - part.qty) } : p;
        });
      }
      return {
        ...s,
        products,
        counters,
        repairs: exists
          ? (s.repairs || []).map(x => (x.id === r.id ? job : x))
          : [job, ...(s.repairs || [])],
      };
    });
    pushAudit(exists ? 'UPDATE' : 'CREATE', 'Repair', `${exists ? 'Updated' : 'Opened'} ${r.jobNo || 'job'} · ${r.deviceBrand} ${r.deviceModel}`);
  }, [state.repairs, pushAudit]);

  const updateRepairStatus = useCallback((id: string, status: RepairStatus, patch?: Partial<RepairJob>) => {
    setState(s => ({
      ...s,
      repairs: (s.repairs || []).map(j => {
        if (j.id !== id) return j;
        const next = { ...j, ...patch, status };
        if (status === 'ready' || status === 'delivered') {
          if (!next.completedAt) next.completedAt = new Date().toISOString();
        }
        if (status === 'delivered') next.deliveredAt = new Date().toISOString();
        return next;
      }),
    }));
    pushAudit('STATUS', 'Repair', `Job status → ${status}`);
  }, [pushAudit]);

  const deleteRepair = useCallback((id: string) => {
    const j = (state.repairs || []).find(x => x.id === id);
    setState(s => ({ ...s, repairs: (s.repairs || []).filter(x => x.id !== id) }));
    if (j) pushAudit('DELETE', 'Repair', `Deleted ${j.jobNo}`);
  }, [state.repairs, pushAudit]);
'''
          new = '''  const saveRepair = useCallback((r: RepairJob) => {
    if (!user) { pushAudit('DENIED', 'Repair', `Blocked repair save for ${r.jobNo || r.id}`); return; }
    const exists = (state.repairs || []).some(x => x.id === r.id);
    const cleanParts = (r.parts || []).map(p => ({ ...p, productId: p.productId || undefined, name: String(p.name || '').trim(), qty: Number(p.qty), cost: Number(p.cost) }));
    const validStatuses: RepairStatus[] = ['received', 'diagnosed', 'waiting_parts', 'in_repair', 'ready', 'delivered', 'cancelled'];
    if (!String(r.customerName || '').trim() || !String(r.deviceModel || '').trim() || !String(r.fault || '').trim() || !validStatuses.includes(r.status) ||
        !Number.isFinite(r.laborCost) || r.laborCost < 0 || !Number.isFinite(r.advancePaid ?? 0) || (r.advancePaid ?? 0) < 0 ||
        (r.warrantyDays !== undefined && (!Number.isFinite(r.warrantyDays) || r.warrantyDays < 0)) ||
        cleanParts.some(p => !p.name || !Number.isFinite(p.qty) || p.qty <= 0 || !Number.isInteger(p.qty) || !Number.isFinite(p.cost) || p.cost < 0)) {
      pushAudit('DENIED', 'Repair', `Blocked invalid repair input for ${r.id}`); return;
    }
    setState(s => {
      const old = (s.repairs || []).find(x => x.id === r.id);
      let job: RepairJob = { ...r, customerName: String(r.customerName).trim(), deviceBrand: String(r.deviceBrand || '').trim(), deviceModel: String(r.deviceModel).trim(), fault: String(r.fault).trim(), parts: cleanParts, laborCost: Math.round(r.laborCost * 100) / 100, advancePaid: Math.round((r.advancePaid ?? 0) * 100) / 100 };
      let counters = s.counters;
      if (!old && (!job.jobNo || job.jobNo.startsWith('JOB-TEMP'))) {
        const seq = (s.counters.job || 0) + 1;
        job = { ...job, jobNo: `JOB-${String(seq).padStart(4, '0')}` };
        counters = { ...s.counters, job: seq };
      }
      const qtyByProduct = (parts: RepairJob['parts']) => {
        const m = new Map<string, number>();
        for (const part of parts) if (part.productId) m.set(part.productId, (m.get(part.productId) || 0) + part.qty);
        return m;
      };
      const before = qtyByProduct(old?.parts || []);
      const after = qtyByProduct(job.parts);
      for (const [productId, qty] of after) {
        const delta = qty - (before.get(productId) || 0);
        const product = s.products.find(p => p.id === productId);
        if (delta > 0 && (!product || product.stock < delta)) {
          pushAudit('DENIED', 'Repair', `Insufficient stock for repair part ${productId}`);
          return s;
        }
      }
      const products = s.products.map(p => {
        const delta = (after.get(p.id) || 0) - (before.get(p.id) || 0);
        return delta ? { ...p, stock: p.stock - delta } : p;
      });
      const repairs = old ? (s.repairs || []).map(x => x.id === job.id ? job : x) : [job, ...(s.repairs || [])];
      syncToGoogleDrive('Products', products);
      syncToGoogleDrive('Repairs', repairs);
      return { ...s, products, counters, repairs };
    });
    pushAudit(exists ? 'UPDATE' : 'CREATE', 'Repair', `${exists ? 'Updated' : 'Opened'} ${r.jobNo || 'job'} · ${r.deviceBrand} ${r.deviceModel}`);
  }, [state.repairs, pushAudit, user]);

  const updateRepairStatus = useCallback((id: string, status: RepairStatus, patch?: Partial<RepairJob>) => {
    if (!user) { pushAudit('DENIED', 'Repair', `Blocked repair status update for ${id}`); return; }
    const validStatuses: RepairStatus[] = ['received', 'diagnosed', 'waiting_parts', 'in_repair', 'ready', 'delivered', 'cancelled'];
    if (!validStatuses.includes(status)) { pushAudit('DENIED', 'Repair', `Blocked invalid repair status for ${id}`); return; }
    setState(s => ({
      ...s,
      repairs: (s.repairs || []).map(j => {
        if (j.id !== id) return j;
        const next = { ...j, ...patch, status };
        if (status === 'ready' || status === 'delivered') next.completedAt = next.completedAt || new Date().toISOString();
        if (status === 'delivered') next.deliveredAt = new Date().toISOString();
        return next;
      }),
    }));
    pushAudit('STATUS', 'Repair', `Job ${id} status → ${status}`);
  }, [pushAudit, user]);

  const deleteRepair = useCallback((id: string) => {
    if (!user || !can('act:deleteRecords')) { pushAudit('DENIED', 'Repair', `Blocked repair delete for ${id}`); return; }
    const j = (state.repairs || []).find(x => x.id === id);
    if (!j) return;
    if (j.status !== 'cancelled' && j.status !== 'delivered') { pushAudit('DENIED', 'Repair', `Blocked deletion of active repair ${j.jobNo}`); return; }
    setState(s => ({ ...s, repairs: (s.repairs || []).filter(x => x.id !== id) }));
    if (j) pushAudit('DELETE', 'Repair', `Deleted ${j.jobNo}`);
  }, [state.repairs, pushAudit, user, can]);

  const saveWarrantyClaim = useCallback((c: WarrantyClaim) => {
    if (!user) { pushAudit('DENIED', 'WarrantyClaim', `Blocked claim save for ${c.claimNo || c.id}`); return; }
    const validStatuses: WarrantyClaim['status'][] = ['open', 'approved', 'rejected', 'replaced', 'repaired', 'closed'];
    const claimNo = String(c.claimNo || '').trim();
    const productName = String(c.productName || '').trim();
    const issueDescription = String(c.issueDescription || '').trim();
    if (!productName || !issueDescription || !validStatuses.includes(c.status)) { pushAudit('DENIED', 'WarrantyClaim', `Blocked invalid claim input for ${c.id}`); return; }
    const exists = (state.warrantyClaims || []).some(x => x.id === c.id);
    setState(s => {
      const duplicate = (s.warrantyClaims || []).some(x => x.id !== c.id && claimNo && x.claimNo.trim().toLowerCase() === claimNo.toLowerCase());
      if (duplicate) { pushAudit('DENIED', 'WarrantyClaim', `Blocked duplicate claim number ${claimNo}`); return s; }
      let counters = s.counters;
      let saved: WarrantyClaim = { ...c, claimNo: claimNo || c.id, productName, issueDescription, customerName: c.customerName?.trim() || undefined, imeiOrSerial: c.imeiOrSerial?.trim() || undefined, resolutionNotes: c.resolutionNotes?.trim() || undefined, closedAt: c.status === 'closed' ? (c.closedAt || new Date().toISOString()) : undefined };
      if (!exists && (!claimNo || claimNo === 'CL-TEMP')) {
        const seq = (s.counters.claim || 0) + 1;
        saved = { ...saved, claimNo: `CL-${String(seq).padStart(4, '0')}` };
        counters = { ...s.counters, claim: seq };
      }
      const claims = exists ? (s.warrantyClaims || []).map(x => x.id === c.id ? saved : x) : [saved, ...(s.warrantyClaims || [])];
      syncToGoogleDrive('WarrantyClaims', claims);
      return { ...s, counters, warrantyClaims: claims };
    });
    pushAudit(exists ? 'UPDATE' : 'CREATE', 'WarrantyClaim', `${exists ? 'Updated' : 'Created'} ${claimNo || c.id}`);
  }, [state.warrantyClaims, pushAudit, user]);
'''
          if old not in s: raise SystemExit('repair block not found')
          s = s.replace(old, new)
          s = s.replace('    saveRepair, updateRepairStatus, deleteRepair,\n', '    saveRepair, updateRepairStatus, deleteRepair, saveWarrantyClaim,\n')
          p.write_text(s)
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/one-time-repairs-warranty-hardening.yml
          git add src/lib/store.tsx .github/workflows/one-time-repairs-warranty-hardening.yml
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "security: harden repair and warranty store operations"
          git push
