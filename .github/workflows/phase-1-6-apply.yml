name: Apply Phase 1.6 partial return patch

on:
  push:
    paths:
      - '.github/workflows/phase-1-6-apply.yml'
      - '.github/phase16_patch.py'

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply source patch
        run: python .github/phase16_patch.py
      - name: Validate patch
        run: |
          git diff --check
          npm install --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/store.tsx src/pages/Exchanges.tsx
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
          else
            git commit -m 'fix: support partial quantity returns'
            git push origin HEAD:main
          fi
