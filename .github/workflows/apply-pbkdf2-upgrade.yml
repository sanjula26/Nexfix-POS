name: Apply PBKDF2 login patch

on:
  push:
    branches: [security/pbkdf2-legacy-upgrade]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply exact source patch
        run: python scripts/apply-pbkdf2-login-upgrade.py
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git add src/lib/store.tsx src/pages/Login.tsx
          git commit -m "feat: upgrade legacy passwords to PBKDF2 on login"
          git push
