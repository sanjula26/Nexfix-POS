name: Run cloud sale patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/run-cloud-sale-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python scripts/cloud-sale-reconcile-patch.py
      - name: Commit patch and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store.tsx scripts/cloud-sale-reconcile-patch.py .github/workflows/run-cloud-sale-patch.yml
          git diff --cached --check
          git rm scripts/cloud-sale-reconcile-patch.py .github/workflows/run-cloud-sale-patch.yml
          git rm .github/workflows/one-time-cloud-sale-fix.yml 2>/dev/null || true
          git commit -m "fix: reconcile cloud sale from authoritative commit"
          git push
