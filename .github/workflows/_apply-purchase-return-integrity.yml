name: Apply Purchase Return Integrity Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_apply-purchase-return-integrity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Patch tracked purchase returns safely
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('src/lib/store.tsx')
          s = p.read_text(encoding='utf-8')
          pattern = r"  const createPurchaseReturn = useCallback\(\(input: \{ purchaseId: string; lines: Array<\{ itemIdx: number; qty: number \}>; reason: string \}\): PurchaseReturn \| null => \{.*?\n  \}, \[state\.purchases, state\.purchaseReturns, state\.products, state\.counters\.dn, user, pushAudit\]\);"
          new = '''  const createPurchaseReturn = useCallback((input: { purchaseId: string; lines: Array<{ itemIdx: number; qty: number }>; reason: string }): PurchaseReturn | null => {
    const purchase = state.purchases.find(x => x.id === input.purchaseId);
    if (!purchase || purchase.status !== 'received' || !user || !input.reason.trim()) return null;
    const existing = state.purchaseReturns || [];
    const returnedByItem = new Map<number, number>();
    for (const ret of existing.filter(x => x.purchaseId === purchase.id)) for (const item of ret.items) returnedByItem.set(item.itemIdx, (returnedByItem.get(item.itemIdx) || 0) + item.qty);
    const requested = new Map<number, number>();
    for (const line of input.lines) { if (!Number.isInteger(line.itemIdx) || line.itemIdx < 0 || line.itemIdx >= purchase.items.length) continue; if (!Number.isFinite(line.qty) || line.qty <= 0) continue; requested.set(line.itemIdx, (requested.get(line.itemIdx) || 0) + Math.floor(line.qty)); }
    if (requested.size === 0) return null;
    const items: PurchaseReturnItem[] = [];
    const returnedUnitIds = new Set<string>();
    for (const [itemIdx, qtyRequested] of requested) {
      const source = purchase.items[itemIdx];
      const already = returnedByItem.get(itemIdx) || 0;
      const product = state.products.find(p => p.id === source.productId);
      const remaining = Math.max(0, source.qty - already);
      const availableUnits = product?.trackImei || product?.trackSerial
        ? state.units.filter(u => u.productId === source.productId && u.purchaseId === purchase.id && u.status === 'in_stock')
        : [];
      const maxQty = (product?.trackImei || product?.trackSerial) ? availableUnits.length : (product?.stock || 0);
      const qty = Math.min(qtyRequested, remaining, maxQty);
      if (qty <= 0) continue;
      if (product?.trackImei || product?.trackSerial) for (const unit of availableUnits.slice(0, qty)) returnedUnitIds.add(unit.id);
      items.push({ itemIdx, productId: source.productId, name: source.name, qty, cost: source.cost, total: qty * source.cost });
    }
    if (!items.length) return null;
    const seq = (state.counters.dn || 0) + 1;
    const ret: PurchaseReturn = { id: uid(), dnNo: 'DN-' + String(seq).padStart(4, '0'), purchaseId: purchase.id, poNo: purchase.poNo, supplierId: purchase.supplierId, supplierName: purchase.supplierName, date: new Date().toISOString(), items, total: items.reduce((a, x) => a + x.total, 0), reason: input.reason.trim(), by: user.email };
    setStateWithInventoryLedger('PURCHASE_REVERSAL', prev => ({ ...prev, products: prev.products.map(p => { const qty = items.filter(x => x.productId === p.id).reduce((a, x) => a + x.qty, 0); return qty ? { ...p, stock: Math.max(0, p.stock - qty) } : p; }), units: prev.units.map(u => returnedUnitIds.has(u.id) ? { ...u, status: 'returned', saleId: undefined, saleBillNo: undefined, soldAt: undefined, note: 'Returned to supplier via ' + ret.dnNo } : u), purchaseReturns: [ret, ...(prev.purchaseReturns || [])], counters: { ...prev.counters, dn: seq } }));
    pushAudit('PURCHASE_RETURN', 'Purchase', 'Debit Note ' + ret.dnNo + ' · ' + purchase.poNo + ' · ' + purchase.supplierName + ' · Rs.' + ret.total.toLocaleString());
    return ret;
  }, [state.purchases, state.purchaseReturns, state.products, state.units, state.counters.dn, user, pushAudit]);'''
          matches = re.findall(pattern, s, flags=re.S)
          if len(matches) != 1:
              raise SystemExit(f'Expected exactly one purchase-return function, found {len(matches)}')
          p.write_text(re.sub(pattern, new, s, count=1, flags=re.S), encoding='utf-8')
      - name: Verify source patch
        shell: bash
        run: |
          grep -q "status: 'returned'" src/lib/store.tsx
          grep -q "purchaseId === purchase.id && u.status === 'in_stock'" src/lib/store.tsx
          grep -q "state.units" src/lib/store.tsx
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Commit verified patch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store.tsx
          git diff --cached --check
          git commit -m "fix: keep tracked purchase returns out of stock"
          git push origin HEAD:main
