name: Phase 1 Machine Tracking Finalize

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Phase 1 integration
        shell: python
        run: |
          from pathlib import Path
          import re

          store = Path('src/lib/store.tsx')
          text = store.read_text(encoding='utf-8')
          marker = "// PHASE1_MACHINE_TRACKING_V1"

          if marker not in text:
              text = text.replace(
                  "import { syncToGoogleDrive } from './driveSync';",
                  "import { syncToGoogleDrive } from './driveSync';\nimport { getMachineIdentity } from './machine';\n"
              )
              text = text.replace(
                  "    const sale: Sale = {\n      id: uid(), billNo, date: new Date().toISOString(),",
                  "    // PHASE1_MACHINE_TRACKING_V1\n    const machine = getMachineIdentity();\n    const sale: Sale = {\n      id: uid(), billNo, date: new Date().toISOString(),"
              )
              text = text.replace(
                  "      cashierId: byUser.id, cashierName: byUser.name,\n      note:",
                  "      cashierId: byUser.id, cashierName: byUser.name,\n      machineId: machine.id, machineName: machine.name,\n      note:"
              )
              store.write_text(text, encoding='utf-8')

          reports = Path('src/pages/Reports.tsx')
          r = reports.read_text(encoding='utf-8')
          rmarker = "// PHASE1_MACHINE_REPORTS_V1"
          if rmarker not in r:
              anchor = "  const cashierRows = useMemo(() => {"
              idx = r.find(anchor)
              if idx < 0:
                  raise SystemExit('Reports cashierRows anchor not found')
              # Insert machine aggregation immediately before cashierRows.
              block = '''  // PHASE1_MACHINE_REPORTS_V1\n  const machineRows = useMemo(() => {\n    const m = new Map<string, { id: string; name: string; bills: number; revenue: number; profit: number }>();\n    salesA.forEach(s => {\n      const id = s.machineId || 'LEGACY';\n      const name = s.machineName || 'Legacy / Unassigned';\n      const e = m.get(id) || { id, name, bills: 0, revenue: 0, profit: 0 };\n      e.bills += 1; e.revenue += s.total; e.profit += s.profit;\n      m.set(id, e);\n    });\n    return [...m.values()].sort((a, b) => b.revenue - a.revenue);\n  }, [salesA]);\n\n'''
              r = r[:idx] + block + r[idx:]
              ui_anchor = "      {/* ============ date filter + compare panel ============ */}"
              ui_idx = r.find(ui_anchor)
              if ui_idx < 0:
                  raise SystemExit('Reports UI anchor not found')
              ui = '''      {/* ============ machine performance ============ */}\n      <div className="card p-5 mb-6">\n        <div className="flex items-center justify-between gap-3 mb-4">\n          <div>\n            <h2 className="text-base font-extrabold text-ink">Machine Performance</h2>\n            <p className="text-xs text-sub mt-1">Sales, income and gross profit by POS terminal</p>\n          </div>\n          <Badge tone="blue">{machineRows.length} machine{machineRows.length === 1 ? '' : 's'}</Badge>\n        </div>\n        <div className="overflow-x-auto">\n          <table className="w-full min-w-[620px] text-sm">\n            <thead><tr className="text-left text-[10px] uppercase tracking-wider text-faint border-b border-line">\n              <th className="py-2 pr-3">Machine</th><th className="py-2 pr-3">Bills</th><th className="py-2 pr-3">Sales / Income</th><th className="py-2">Gross Profit</th>\n            </tr></thead>\n            <tbody>{machineRows.map(row => (\n              <tr key={row.id} className="border-b border-line last:border-0">\n                <td className="py-3 pr-3"><div className="font-bold text-ink">{row.name}</div><div className="text-[10px] text-faint num">{row.id}</div></td>\n                <td className="py-3 pr-3 num">{fmtNum(row.bills)}</td>\n                <td className="py-3 pr-3 num font-semibold">{fmtRs(row.revenue)}</td>\n                <td className="py-3 num font-semibold text-emerald-600">{fmtRs(row.profit)}</td>\n              </tr>\n            ))}</tbody>\n          </table>\n        </div>\n      </div>\n\n'''
              r = r[:ui_idx] + ui + r[ui_idx:]
              reports.write_text(r, encoding='utf-8')

      - name: Verify Phase 1 integration markers
        run: |
          grep -q 'PHASE1_MACHINE_TRACKING_V1' src/lib/store.tsx
          grep -q 'machineId: machine.id' src/lib/store.tsx
          grep -q 'PHASE1_MACHINE_REPORTS_V1' src/pages/Reports.tsx
          grep -q 'Machine Performance' src/pages/Reports.tsx

      - name: Commit Phase 1 integration and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store.tsx src/pages/Reports.tsx
          git rm .github/workflows/phase1-machine-finalize.yml
          if git diff --cached --quiet; then
            echo "No Phase 1 changes required."
            exit 0
          fi
          git commit -m "Complete Phase 1 machine sales and reporting"
          git push origin HEAD:main
