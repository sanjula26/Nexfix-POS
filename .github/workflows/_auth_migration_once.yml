name: one-time auth migration
on:
  push:
    branches: [refactor/modular-store-foundation-v6]
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install
      - run: python scripts/migrate-pbkdf2.py
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Commit verified migration
        run: |
          rm -f scripts/migrate-pbkdf2.py .github/workflows/_auth_migration_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store.tsx src/pages/Login.tsx src/pages/Settings.tsx src/components/AppLayout.tsx src/pages/Users.tsx src/lib/passwordAuth.ts scripts/migrate-pbkdf2.py .github/workflows/_auth_migration_once.yml
          git commit -m "feat: integrate PBKDF2 credential migration"
          git push origin HEAD:refactor/modular-store-foundation-v6
