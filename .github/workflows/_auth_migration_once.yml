name: one-time auth migration

on:
  push:
    branches:
      - refactor/modular-store-foundation-v6

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply PBKDF2 auth migration
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace('src/lib/store.tsx',
            "import { dkey, uid, POINT_VALUE, pointsForRs, hashPin, hashPassword, verifyPassword, isHashed } from './utils';",
            "import { dkey, uid, POINT_VALUE, pointsForRs, hashPin, hashPassword, isHashed } from './utils';\nimport { hashCredential, isPbkdf2Hash, verifyCredential } from './passwordAuth';")

          replace('src/lib/store.tsx',
            "signIn: (email: string, password: string, remember: boolean) => { ok: boolean; error?: string };",
            "signIn: (email: string, password: string, remember: boolean) => Promise<{ ok: boolean; error?: string }>;")
          replace('src/lib/store.tsx',
            "switchRole: (role: Role, pin?: string) => { ok: boolean; error?: string };",
            "switchRole: (role: Role, pin?: string) => Promise<{ ok: boolean; error?: string }>;")
          replace('src/lib/store.tsx',
            "changeAdminPin: (current: string, next: string) => { ok: boolean; error?: string };",
            "changeAdminPin: (current: string, next: string) => Promise<{ ok: boolean; error?: string }>;")
          replace('src/lib/store.tsx',
            "verifyAdminPin: (pin: string, reason?: string) => boolean;",
            "verifyAdminPin: (pin: string, reason?: string) => Promise<boolean>;")
          replace('src/lib/store.tsx',
            "  const users = (s.users || []).map(u => ({\n    ...u,\n    password: isHashed(u.password) ? u.password : hashPassword(u.password || ''),\n  }));",
            "  // Credentials are migrated lazily after successful verification. This avoids\n  // hashing passwords during boot and preserves legacy credentials until used.\n  const users = (s.users || []).map(u => ({ ...u, password: u.password || '' }));")

          replace('src/lib/store.tsx',
            "  const verifyAdminPin = useCallback((pin: string, reason?: string): boolean => {\n    const ok = verifyPassword(pin || '', state.settings.adminPinHash);",
            "  const verifyAdminPin = useCallback(async (pin: string, reason?: string): Promise<boolean> => {\n    const verification = await verifyCredential(pin || '', state.settings.adminPinHash);\n    const ok = verification.ok;\n    if (ok && verification.needsRehash) {\n      const upgraded = await hashCredential(pin || '');\n      setState(s => ({ ...s, settings: { ...s.settings, adminPinHash: upgraded } }));\n    }")

          old = """  const signIn = useCallback((email: string, password: string, remember: boolean) => {\n    const u = state.users.find(x => x.email.toLowerCase() === email.trim().toLowerCase());\n    if (!u) return { ok: false, error: 'No account found for this email' };\n    // Support both hashed (new) and legacy plaintext during transition\n    const passwordOk = isHashed(u.password)\n      ? verifyPassword(password, u.password)\n      : u.password === password;\n    if (!passwordOk) return { ok: false, error: 'Incorrect password' };"""
          new = """  const signIn = useCallback(async (email: string, password: string, remember: boolean) => {\n    const u = state.users.find(x => x.email.toLowerCase() === email.trim().toLowerCase());\n    if (!u) return { ok: false, error: 'No account found for this email' };\n    const verification = await verifyCredential(password, u.password);\n    if (!verification.ok) return { ok: false, error: 'Incorrect password' };"""
          replace('src/lib/store.tsx', old, new)

          old = """    // Auto-upgrade plaintext password to hash on successful login\n    if (!isHashed(u.password)) {\n      setState(s => ({\n        ...s,\n        users: s.users.map(x => x.id === u.id ? { ...x, password: hashPassword(password) } : x),\n        audit: [{ id: uid(), time: new Date().toISOString(), user: u.email, action: 'LOGIN', entity: 'Auth', details: `${u.name} signed in` }, ...s.audit].slice(0, 500),\n      }));\n    } else {\n      setState(s => ({\n        ...s,\n        audit: [{ id: uid(), time: new Date().toISOString(), user: u.email, action: 'LOGIN', entity: 'Auth', details: `${u.name} signed in` }, ...s.audit].slice(0, 500),\n      }));\n    }\n    return { ok: true };\n  }, [state.users]);"""
          new = """    // Upgrade legacy credentials only after successful verification.\n    const upgradedPassword = verification.needsRehash ? await hashCredential(password) : u.password;\n    setState(s => ({\n      ...s,\n      users: s.users.map(x => x.id === u.id ? { ...x, password: upgradedPassword } : x),\n      audit: [{ id: uid(), time: new Date().toISOString(), user: u.email, action: 'LOGIN', entity: 'Auth', details: `${u.name} signed in` }, ...s.audit].slice(0, 500),\n    }));\n    return { ok: true };\n  }, [state.users]);"""
          replace('src/lib/store.tsx', old, new)

          old = """  const switchRole = useCallback((role: Role, pin?: string): { ok: boolean; error?: string } => {"""
          new = """  const switchRole = useCallback(async (role: Role, pin?: string): Promise<{ ok: boolean; error?: string }> => {"""
          replace('src/lib/store.tsx', old, new)

          old = """    if (role === 'admin' && user?.role === 'cashier') {\n      if (!verifyPassword(pin || '', state.settings.adminPinHash)) {"""
          new = """    if (role === 'admin' && user?.role === 'cashier') {\n      const verification = await verifyCredential(pin || '', state.settings.adminPinHash);\n      if (!verification.ok) {"""
          replace('src/lib/store.tsx', old, new)

          old = """        return { ok: false, error: 'Incorrect admin password' };\n      }\n      // Remember current cashier"""
          new = """        return { ok: false, error: 'Incorrect admin password' };\n      }\n      if (verification.needsRehash) {\n        const upgraded = await hashCredential(pin || '');\n        setState(s => ({ ...s, settings: { ...s.settings, adminPinHash: upgraded } }));\n      }\n      // Remember current cashier"""
          replace('src/lib/store.tsx', old, new)

          old = """  const changeAdminPin = useCallback((current: string, next: string): { ok: boolean; error?: string } => {\n    if (user?.role !== 'admin') return { ok: false, error: 'Only admins can change this password' };\n    if (!verifyPassword(current, state.settings.adminPinHash)) return { ok: false, error: 'Current password is incorrect' };\n    if (next.trim().length < 4) return { ok: false, error: 'New password must be at least 4 characters' };\n    setState(s => ({ ...s, settings: { ...s.settings, adminPinHash: hashPin(next.trim()) } }));\n    pushAudit('SETTINGS', 'Security', 'Admin switch password changed');\n    return { ok: true };\n  }, [user, state.settings.adminPinHash, pushAudit]);"""
          new = """  const changeAdminPin = useCallback(async (current: string, next: string): Promise<{ ok: boolean; error?: string }> => {\n    if (user?.role !== 'admin') return { ok: false, error: 'Only admins can change this password' };\n    const verification = await verifyCredential(current, state.settings.adminPinHash);\n    if (!verification.ok) return { ok: false, error: 'Current password is incorrect' };\n    if (next.trim().length < 4) return { ok: false, error: 'New password must be at least 4 characters' };\n    const upgraded = await hashCredential(next.trim());\n    setState(s => ({ ...s, settings: { ...s.settings, adminPinHash: upgraded } }));\n    pushAudit('SETTINGS', 'Security', 'Admin switch password changed');\n    return { ok: true };\n  }, [user, state.settings.adminPinHash, pushAudit]);"""
          replace('src/lib/store.tsx', old, new)

          old = """  const saveUser = useCallback((u: AppUser) => {\n    const exists = state.users.some(x => x.id === u.id);\n    // Always store password as hash (skip re-hash if already hashed and unchanged)\n    const existing = state.users.find(x => x.id === u.id);\n    const password = isHashed(u.password)\n      ? u.password\n      : (existing && u.password === existing.password ? existing.password : hashPassword(u.password));\n    const toSave = { ...u, password };"""
          new = """  const saveUser = useCallback(async (u: AppUser) => {\n    const exists = state.users.some(x => x.id === u.id);\n    const existing = state.users.find(x => x.id === u.id);\n    const password = existing && u.password === existing.password\n      ? existing.password\n      : (isPbkdf2Hash(u.password) ? u.password : await hashCredential(u.password));\n    const toSave = { ...u, password };"""
          replace('src/lib/store.tsx', old, new)

          replace('src/pages/Login.tsx',
            "    const res = signIn(email, password, remember);",
            "    const res = await signIn(email, password, remember);")

          replace('src/pages/Settings.tsx',
            "  const submitPin = () => {",
            "  const submitPin = async () => {")
          replace('src/pages/Settings.tsx',
            "  const res = changeAdminPin(pinCur, pinNew);",
            "  const res = await changeAdminPin(pinCur, pinNew);")

          replace('src/components/AppLayout.tsx',
            "  const tryUnlock = () => {",
            "  const tryUnlock = async () => {")
          replace('src/components/AppLayout.tsx',
            "      const res = switchRole('admin', pin);",
            "      const res = await switchRole('admin', pin);")

          replace('src/pages/Users.tsx',
            "  const save = () => {",
            "  const save = async () => {")
          replace('src/pages/Users.tsx',
            "    saveUser(toSave);",
            "    await saveUser(toSave);")
          replace('src/pages/Users.tsx',
            "hint={isNew ? 'Stored as SHA-256 hash' : 'Leave blank to keep current password'}",
            "hint={isNew ? 'Stored as PBKDF2-SHA256 hash' : 'Leave blank to keep current password'}")

          # The legacy imports are no longer needed in store.tsx after auth migration.
          text = Path('src/lib/store.tsx').read_text(encoding='utf-8')
          text = text.replace("hashPin, hashPassword, isHashed } from './utils';", "hashPin, hashPassword, isHashed } from './utils';")
          Path('src/lib/store.tsx').write_text(text, encoding='utf-8')

          # Remove the one-time workflow before committing source changes.
          Path('.github/workflows/_auth_migration_once.yml').unlink()
      - name: Verify typecheck
        run: npm run typecheck
      - name: Verify lint
        run: npm run lint
      - name: Verify production build
        run: npm run build
      - name: Commit verified migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store.tsx src/pages/Login.tsx src/pages/Settings.tsx src/components/AppLayout.tsx src/pages/Users.tsx src/lib/passwordAuth.ts .github/workflows/_auth_migration_once.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate PBKDF2 credential migration"
          git push origin HEAD:refactor/modular-store-foundation-v6
