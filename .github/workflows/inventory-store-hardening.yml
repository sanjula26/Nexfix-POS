name: inventory-store-hardening
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch store
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/lib/store.tsx')
          s = p.read_text(encoding='utf-8')
          save = r'''  const saveProduct = useCallback((p: Product) => {
    if (!user || !can('act:manageStock')) {
      pushAudit('DENIED', 'Product', `Blocked product save for ${p.name || p.id}`);
      return;
    }
    const name = String(p.name || '').trim();
    const sku = String(p.sku || '').trim();
    const barcode = String(p.barcode || '').trim();
    const numeric = [p.cost, p.price, p.stock, p.reorderLevel, p.warrantyMonths ?? 0];
    if (!name || !sku || !barcode || numeric.some(v => !Number.isFinite(v) || v < 0) || !Number.isInteger(p.stock) || !Number.isInteger(p.reorderLevel)) {
      pushAudit('DENIED', 'Product', `Blocked invalid product input for ${p.id}`);
      return;
    }
    const normalized: Product = { ...p, name, sku, barcode, cost: Math.round(p.cost * 100) / 100, price: Math.round(p.price * 100) / 100, stock: Math.round(p.stock), reorderLevel: Math.round(p.reorderLevel), warrantyMonths: Math.round(p.warrantyMonths ?? 0) };
    let saved = false;
    let duplicate = false;
    setState(st => {
      const exists = st.products.some(x => x.id === normalized.id);
      const duplicateSku = st.products.some(x => x.id !== normalized.id && x.sku.trim().toLowerCase() === sku.toLowerCase());
      const duplicateBarcode = st.products.some(x => x.id !== normalized.id && x.barcode.trim() === barcode);
      if (duplicateSku || duplicateBarcode) { duplicate = true; return st; }
      saved = true;
      const updatedProducts = exists ? st.products.map(x => x.id === normalized.id ? normalized : x) : [normalized, ...st.products];
      syncToGoogleDrive('Products', updatedProducts);
      return { ...st, products: updatedProducts };
    });
    if (duplicate) pushAudit('DENIED', 'Product', `Blocked duplicate SKU/barcode for ${normalized.name}`);
    else if (saved) pushAudit(state.products.some(x => x.id === normalized.id) ? 'UPDATE' : 'CREATE', 'Product', `${state.products.some(x => x.id === normalized.id) ? 'Updated' : 'Added'} product ${normalized.name}`);
  }, [can, pushAudit, state.products, user]);'''
          adjust = r'''  const adjustStock = useCallback((id: string, delta: number, reason: string) => {
    if (!user || !can('act:manageStock')) { pushAudit('DENIED', 'Product', `Blocked stock adjustment for ${id}`); return; }
    const amount = Number(delta);
    const note = String(reason || '').trim();
    if (!Number.isFinite(amount) || amount === 0 || !Number.isInteger(amount) || !note) { pushAudit('DENIED', 'Product', `Blocked invalid stock adjustment for ${id}`); return; }
    const p = state.products.find(x => x.id === id);
    if (!p || !Number.isFinite(p.stock) || p.stock + amount < 0) { pushAudit('DENIED', 'Product', `Blocked stock adjustment below zero for ${id}`); return; }
    setStateWithInventoryLedger('STOCK_ADJUSTMENT', st => {
      const current = st.products.find(x => x.id === id);
      if (!current || !Number.isFinite(current.stock) || current.stock + amount < 0) return st;
      const updatedProducts = st.products.map(x => x.id === id ? { ...x, stock: x.stock + amount } : x);
      syncToGoogleDrive('Products', updatedProducts);
      return { ...st, products: updatedProducts };
    });
    pushAudit('STOCK', 'Product', `Stock ${amount >= 0 ? '+' : ''}${amount} for ${p.name} — ${note}`);
  }, [can, pushAudit, state.products, user]);'''
          s, n1 = re.subn(r"  const saveProduct = useCallback\(\(p: Product\) => \{.*?\n  \}, \[pushAudit, state\.products\]\);", save, s, count=1, flags=re.S)
          if n1 != 1: raise SystemExit('saveProduct target not found')
          s, n2 = re.subn(r"  const adjustStock = useCallback\(\(id: string, delta: number, reason: string\) => \{.*?\n  \}, \[pushAudit, state\.products\]\);", adjust, s, count=1, flags=re.S)
          if n2 != 1: raise SystemExit('adjustStock target not found')
          s, n3 = re.subn(r"      return \{ \.\.\.p, stock: p\.stock \+ delta, \(\.\.\.cost !== undefined \? \{ cost \} : \{\}\) \};", "      const purchaseItem = currentPo.items.find(item => item.productId === p.id);\n      const sellingPrice = purchaseItem?.updateSellingPrice ? purchaseItem.sellingPrice : undefined;\n      if (sellingPrice !== undefined && (!Number.isFinite(sellingPrice) || sellingPrice < 0)) return p;\n      return { ...p, stock: p.stock + delta, ...(cost !== undefined ? { cost } : {}), ...(sellingPrice !== undefined ? { price: Math.round(sellingPrice * 100) / 100 } : {}) };", s, count=1)
          if n3 != 1: raise SystemExit('receivePurchase target not found')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store.tsx
          git diff --cached --quiet || git commit -m "fix: harden inventory store operations"
          git push
