name: One-time cloud sale reconciliation patch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-cloud-sale-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch cloud sale reconciliation
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('src/lib/store.tsx')
          text = p.read_text(encoding='utf-8')
          start = text.index("  const completeSaleCloud = useCallback(async (input: NewSaleInput): Promise<Sale | null> => {")
          end = text.index("\n\n  const refundSale = useCallback", start)
          new_block = r'''  const completeSaleCloud = useCallback(async (input: NewSaleInput): Promise<Sale | null> => {
    if (!user || input.lines.length === 0) return null;
    if (typeof navigator !== 'undefined' && !navigator.onLine) return completeSale(input);
    const shop = await ensureCloudShop('Nexfix Shop');
    if (!shop.ok || !shop.shopId) {
      if (shop.error === 'Cloud authentication is not configured' || shop.error === 'Cloud session is not available' || shop.error === 'offline') {
        return completeSale(input);
      }
      return null;
    }
    if (user.role === 'admin' || user.role === 'manager') {
      const catalog = await syncNormalizedCatalog(state, shop.shopId);
      if (!catalog.ok) return null;
    }

    // Keep one stable id for a sale until the cloud transaction is known to be
    // reconciled locally. This prevents a retry from creating a second cloud sale
    // after a successful RPC followed by a local reconciliation failure.
    const pendingKey = 'nexfix_pending_cloud_sale_v2';
    const fingerprint = JSON.stringify({
      lines: input.lines.map(l => ({ productId: l.productId, qty: l.qty, discount: l.discount || 0, price: l.price, unitIds: l.unitIds || [] })),
      customerId: input.customerId || null, discount: input.discount || 0, taxPct: input.taxPct || 0,
      shipping: input.shipping || 0, pointsRedeemed: input.pointsRedeemed || 0,
      payment: input.payment, amountPaid: input.amountPaid,
      payments: (input.payments || []).map(p => ({ method: p.method, amount: p.amount })),
      note: input.note || '', salesmanId: input.salesmanId || user.id,
    });
    let saleId = input._saleId || '';
    try {
      const raw = localStorage.getItem(pendingKey);
      if (!saleId && raw) {
        const pending = JSON.parse(raw) as { saleId?: string; fingerprint?: string };
        if (pending.saleId && pending.fingerprint === fingerprint) saleId = pending.saleId;
      }
    } catch { /* ignore malformed pending state */ }
    if (!saleId) saleId = uid();
    try { localStorage.setItem(pendingKey, JSON.stringify({ saleId, fingerprint })); } catch { /* ignore */ }

    const payments = (input.payments && input.payments.length)
      ? input.payments.filter(p => p.amount > 0).map(p => ({ method: p.method, amount: p.amount }))
      : [{ method: input.payment, amount: input.amountPaid }];
    const cloud = await completeSaleAtomic({
      shopId: shop.shopId, saleId, customerId: input.customerId, shipping: input.shipping,
      discount: input.discount, taxPct: input.taxPct, pointsRedeemed: input.pointsRedeemed,
      note: input.note, salesmanId: input.salesmanId || user.id,
      lines: input.lines.map(l => ({ product_id: l.productId, qty: l.qty, discount: l.discount, price: l.price, unit_ids: l.unitIds })),
      payments,
    });
    if (!cloud.ok || !cloud.saleId || !cloud.billNo || cloud.saleId !== saleId || !cloud.committed?.sale) return null;

    const row = cloud.committed.sale;
    const n = (v: unknown, fallback = 0) => {
      const x = Number(v);
      return Number.isFinite(x) ? x : fallback;
    };
    const productRows = new Map(cloud.committed.products.map(p => [String(p.id), p]));
    const unitRows = new Map(cloud.committed.units.map(u => [String(u.id), u]));
    const committedItems: SaleItem[] = cloud.committed.items.map(item => {
      const product = productRows.get(String(item.product_id));
      const ids = Array.isArray(item.unit_ids) ? item.unit_ids.map(String) : [];
      return {
        productId: String(item.product_id),
        name: String(item.name ?? product?.name ?? 'Item'),
        qty: n(item.qty),
        price: n(item.price),
        cost: n(item.cost ?? product?.cost),
        discount: n(item.discount),
        priceOverridden: item.price_overridden === true || undefined,
        unitIds: ids.length ? ids : undefined,
        imeis: ids.map(id => unitRows.get(id)?.imei).filter(Boolean) as string[],
        serials: ids.map(id => unitRows.get(id)?.serial).filter(Boolean) as string[],
        warrantyMonths: product ? n(product.warranty_months) || undefined : undefined,
      };
    });
    const paymentRows: PaymentLeg[] = cloud.committed.payments.map(p => ({
      method: String(p.method) as PaymentMethod,
      amount: n(p.amount),
    }));
    const sale: Sale = {
      id: String(row.id),
      billNo: String(row.bill_no ?? cloud.billNo),
      date: String(row.created_at ?? new Date().toISOString()),
      cashierId: String(row.cashier_id ?? user.id),
      cashierName: String(row.cashier_name ?? user.name),
      machineId: getMachineIdentity().id,
      machineName: getMachineIdentity().name,
      customerId: row.customer_id ? String(row.customer_id) : undefined,
      customerName: String(row.customer_name ?? cloud.committed.customer?.name ?? 'Walk-in customer'),
      items: committedItems,
      subtotal: n(row.subtotal),
      discount: n(row.discount),
      tax: n(row.tax),
      shipping: n(row.shipping) || undefined,
      total: n(row.total),
      payment: paymentRows.length > 1 ? paymentRows[0].method : (paymentRows[0]?.method || input.payment),
      payments: paymentRows.length > 1 ? paymentRows : undefined,
      pointsRedeemed: n(row.points_redeemed) || undefined,
      pointsEarned: n(row.points_earned) || undefined,
      note: row.note ? String(row.note) : undefined,
      amountPaid: n(row.amount_paid),
      change: n(row.change_amount),
      profit: n(row.profit),
      status: 'completed',
    };

    // Reconcile from the authoritative committed cloud rows. Do not call
    // completeSale() here: its local stock/unit validation can reject a sale
    // that has already committed remotely, causing duplicate retries.
    setStateWithInventoryLedger('SALE', prev => {
      if (prev.sales.some(x => x.id === sale.id)) return prev;
      const maxSaleSeq = prev.sales.reduce((m, x) => {
        const seq = parseInt(x.billNo.split('-').pop() || '0', 10);
        return Number.isFinite(seq) ? Math.max(m, seq) : m;
      }, 0);
      const billSeq = parseInt(sale.billNo.split('-').pop() || '0', 10);
      const productUpdates = new Map<string, Product>();
      for (const [id, product] of productRows) {
        const local = prev.products.find(p => p.id === id);
        if (!local) continue;
        productUpdates.set(id, {
          ...local,
          name: String(product.name ?? local.name),
          sku: String(product.sku ?? local.sku ?? ''),
          barcode: String(product.barcode ?? local.barcode ?? ''),
          cost: n(product.cost, local.cost),
          price: n(product.price, local.price),
          stock: n(product.stock, local.stock),
          reorderLevel: n(product.reorder_level, local.reorderLevel),
          trackImei: product.track_imei === true,
          trackSerial: product.track_serial === true,
          trackExpiry: product.track_expiry === true,
          warrantyMonths: n(product.warranty_months, local.warrantyMonths || 0) || undefined,
          isKit: product.is_kit === true,
          isService: product.is_service === true,
          active: product.active !== false,
          attributes: (product.attributes && typeof product.attributes === 'object') ? product.attributes as Product['attributes'] : local.attributes,
        });
      }
      const updatedProducts = prev.products.map(p => productUpdates.get(p.id) || p);
      const customer = cloud.committed.customer;
      const updatedCustomers = customer?.id
        ? prev.customers.map(c => c.id === String(customer.id) ? {
            ...c,
            name: String(customer.name ?? c.name),
            phone: String(customer.phone ?? c.phone ?? ''),
            email: customer.email ? String(customer.email) : c.email,
            nic: customer.nic ? String(customer.nic) : c.nic,
            address: customer.address ? String(customer.address) : c.address,
            creditBalance: n(customer.credit_balance, c.creditBalance),
            loyaltyPoints: n(customer.loyalty_points, c.loyaltyPoints),
          } : c)
        : prev.customers;
      const updatedUnits = (prev.units || []).map(u => {
        const remote = unitRows.get(u.id);
        if (!remote) return u;
        return {
          ...u,
          productId: String(remote.product_id ?? u.productId),
          imei: remote.imei ? String(remote.imei) : u.imei,
          serial: remote.serial ? String(remote.serial) : u.serial,
          expiryDate: remote.expiry_date ? String(remote.expiry_date) : u.expiryDate,
          status: String(remote.status ?? u.status) as InventoryUnit['status'],
          saleId: remote.sale_id ? String(remote.sale_id) : undefined,
          saleBillNo: remote.sale_bill_no ? String(remote.sale_bill_no) : undefined,
          soldAt: remote.sold_at ? String(remote.sold_at) : undefined,
          cost: remote.cost == null ? u.cost : n(remote.cost),
          warrantyExpiresAt: remote.warranty_expires_at ? String(remote.warranty_expires_at) : u.warrantyExpiresAt,
          note: remote.note ? String(remote.note) : u.note,
        };
      });
      return {
        ...prev,
        products: updatedProducts,
        customers: updatedCustomers,
        units: updatedUnits,
        sales: [sale, ...prev.sales],
        counters: { ...prev.counters, bill: Math.max(prev.counters.bill, maxSaleSeq, Number.isFinite(billSeq) ? billSeq : 0) + 1 },
      };
    });
    try { localStorage.removeItem(pendingKey); } catch { /* ignore */ }
    syncToGoogleDrive('SalesHistory', [sale]);
    syncToGoogleDrive('Products', cloud.committed.products);
    pushAudit('SALE', 'Sale', `Cloud bill ${sale.billNo} · authoritative reconciliation · ${committedItems.length} item(s)`);
    return sale;
  }, [user, state, pushAudit, completeSale]);'''
          if text.count("  const completeSaleCloud = useCallback(async (input: NewSaleInput): Promise<Sale | null> => {") != 1:
              raise SystemExit('unexpected completeSaleCloud count')
          p.write_text(text[:start] + new_block + text[end:], encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store.tsx .github/workflows/one-time-cloud-sale-fix.yml
          git diff --cached --check
          git diff --cached -- src/lib/store.tsx
          git rm .github/workflows/one-time-cloud-sale-fix.yml
          git commit -m "fix: reconcile cloud sale from authoritative commit"
          git push
