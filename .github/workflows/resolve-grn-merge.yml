name: Prepare GRN merge
on:
  push:
    branches: [feature/grn-workflow]
permissions:
  contents: write
jobs:
  merge-main:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge current main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge origin/main --no-edit || {
            git checkout --ours -- src/App.tsx src/components/AppLayout.tsx src/lib/store.tsx
            git add src/App.tsx src/components/AppLayout.tsx src/lib/store.tsx
            git commit -m 'chore: resolve GRN merge with main [skip ci]'
          }
          git push
