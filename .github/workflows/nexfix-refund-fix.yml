name: Apply Nexfix POS Refund Fix

on:
  push:
    branches:
      - fix/refund-sale-reconciliation

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Patch refund reconciliation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/store.tsx')
          text = p.read_text()
          old = '''    const returnedUnitIds = sale.items.flatMap(it => it.unitIds || []);\n    setState(s => ({\n      ...s,\n      sales: s.sales.map(x => (x.id === saleId ? { ...x, status: 'refunded' } : x)),\n      products: s.products.map(p => {\n        const it = sale.items.find(i => i.productId === p.id);\n        return it ? { ...p, stock: p.stock + it.qty } : p;\n      }),\n      units: (s.units || []).map(u =>\n        returnedUnitIds.includes(u.id)\n          ? { ...u, status: 'returned' as const, saleId: undefined, saleBillNo: undefined, soldAt: undefined }\n          : u,\n      ),\n    }));'''
          new = '''    const returnedUnitIds = sale.items.flatMap(it => it.unitIds || []);\n    const refundQtyByProduct = new Map<string, number>();\n    sale.items.forEach(it => {\n      refundQtyByProduct.set(it.productId, (refundQtyByProduct.get(it.productId) || 0) + it.qty);\n    });\n    setState(s => ({\n      ...s,\n      sales: s.sales.map(x => (x.id === saleId ? { ...x, status: 'refunded' } : x)),\n      products: s.products.map(p => {\n        const qty = refundQtyByProduct.get(p.id);\n        return qty !== undefined ? { ...p, stock: p.stock + qty } : p;\n      }),\n      customers: s.customers.map(c => c.id === sale.customerId\n        ? {\n            ...c,\n            creditBalance: Math.max(0, c.creditBalance - Math.max(0, sale.total - sale.amountPaid)),\n            loyaltyPoints: Math.max(0, c.loyaltyPoints - (sale.pointsEarned || 0) + (sale.pointsRedeemed || 0)),\n          }\n        : c,\n      ),\n      units: (s.units || []).map(u =>\n        returnedUnitIds.includes(u.id)\n          ? { ...u, status: 'returned' as const, saleId: undefined, saleBillNo: undefined, soldAt: undefined }\n          : u,\n      ),\n    }));'''
          if old not in text:
              raise SystemExit('refund block not found; refusing to patch')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Verify source patch
        shell: bash
        run: |
          grep -F "const refundQtyByProduct = new Map<string, number>();" src/lib/store.tsx
          grep -F "creditBalance: Math.max(0, c.creditBalance - Math.max(0, sale.total - sale.amountPaid))" src/lib/store.tsx
          grep -F "loyaltyPoints: Math.max(0, c.loyaltyPoints - (sale.pointsEarned || 0) + (sale.pointsRedeemed || 0))" src/lib/store.tsx
          grep -F "const qty = refundQtyByProduct.get(p.id);" src/lib/store.tsx
          test ! -f .github/workflows/nexfix-step1-fix.yml
          npm install --package-lock=false --ignore-scripts
          npm run typecheck
          npm run build

      - name: Commit fix and remove temporary workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store.tsx
          git rm .github/workflows/nexfix-refund-fix.yml
          git commit -m "fix: reconcile stock and customer balances on refunds"
          git push
