name: NexFix Owner Web CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/owner-web/**'
      - 'supabase/migrations/**'
      - 'docs/OWNER_WEB_ROADMAP.md'
      - '.github/workflows/owner-web-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/owner-web/**'
      - 'supabase/migrations/**'
      - 'docs/OWNER_WEB_ROADMAP.md'
      - '.github/workflows/owner-web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/owner-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Owner Web dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
