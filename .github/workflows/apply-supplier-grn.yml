name: Apply supplier payment patch

on:
  push:
    branches: [feature/supplier-payments-and-grn]

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python scripts/apply-supplier-grn.py
      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/store.tsx src/lib/supplierPayments.ts src/pages/Customers.tsx src/pages/SupplierPayments.tsx src/App.tsx src/components/AppLayout.tsx
          git diff --cached --quiet || git commit -m 'feat: add supplier payments and credit limits [skip ci]'
          git push
