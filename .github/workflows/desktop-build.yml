name: Windows Desktop Build
# Release workflow verifies Windows installer/portable outputs and publishes checksums.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'public/**'
      - 'google-apps-script/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'eslint.config.js'
      - 'assets/**'
      - 'build/**'
      - '.github/workflows/desktop-build.yml'

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Nexfix Windows icon assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) { throw "ImageMagick (magick) is required on windows-latest." }
          $source = "assets/nexfix-logo-source.jpeg"
          if (-not (Test-Path $source)) { throw "Missing logo source: $source" }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          magick $source -auto-orient -resize "900x900" -gravity center -background white -extent 1024x1024 "build/icon.png"
          magick "build/icon.png" -define icon:auto-resize=16,32,48,64,128,256 "build/icon.ico"
          $identify = magick identify -format "%m %wx%h" "build/icon.png"
          if ($identify -notmatch "PNG 1024x1024") { throw "Unexpected icon.png output: $identify" }
          if (-not (Test-Path "build/icon.ico")) { throw "build/icon.ico was not generated." }
          Write-Host "Generated: $identify"

      - name: Commit generated Windows icon assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/icon.png build/icon.ico
          if (git diff --cached --quiet) {
            Write-Host "Windows icon assets already committed."
          } else {
            git commit -m "chore(desktop): commit generated Nexfix Windows icon assets"
            git push origin HEAD:main
          }
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build web app
        env:
          VITE_GOOGLE_BACKUP_API_KEY: ${{ secrets.VITE_GOOGLE_BACKUP_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_GOOGLE_BACKUP_API_KEY)) { throw "VITE_GOOGLE_BACKUP_API_KEY secret is empty." }
          npm run build

      - name: Build Windows installer and portable app
        env:
          VITE_GOOGLE_BACKUP_API_KEY: ${{ secrets.VITE_GOOGLE_BACKUP_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_GOOGLE_BACKUP_API_KEY)) { throw "VITE_GOOGLE_BACKUP_API_KEY secret is empty." }
          npm run desktop:build

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -File
          $exeFiles = $files | Where-Object { $_.Extension -eq '.exe' }
          if ($files.Count -lt 2) { throw "Expected installer and portable artifacts." }
          if ($exeFiles.Count -lt 2) { throw "Expected at least two Windows .exe artifacts (installer and portable)." }

      - name: Generate release checksums
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem -Path release -Filter *.exe -File | Sort-Object Name
          if ($exeFiles.Count -lt 2) { throw "Expected at least two Windows .exe artifacts before checksum generation." }
          $lines = foreach ($file in $exeFiles) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v3.0.0-build.${{ github.run_number }}"
          $title = "Nexfix POS $tag"
          gh release create $tag release/*.exe release/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --title $title --generate-notes

# CI validation marker for the authoritative cloud-sale reconciliation fix.
