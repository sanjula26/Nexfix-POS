name: Windows Desktop Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Build Windows installer and portable app
        run: npm run desktop:build

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -File
          $exeFiles = $files | Where-Object { $_.Extension -eq '.exe' }
          if ($files.Count -lt 2) { throw "Expected installer and portable artifacts." }
          if ($exeFiles.Count -lt 2) { throw "Expected at least two Windows .exe artifacts (installer and portable)." }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexfix-pos-windows
          path: release/*
          if-no-files-found: error
          retention-days: 14
