name: Windows Desktop Build
# Release workflow verifies Windows installer/portable outputs and publishes checksums.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'electron/**'
      - 'public/**'
      - 'google-apps-script/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - 'eslint.config.js'
      - 'assets/**'
      - 'build/**'
      - '.github/workflows/desktop-build.yml'

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Nexfix Windows icon assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) { throw "ImageMagick (magick) is required on windows-latest." }
          $source = "assets/nexfix-pos-icon.svg"
          if (-not (Test-Path $source)) { throw "Missing logo source: $source" }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          # The logo source is an SVG wrapper around the supplied artwork. ImageMagick's
          # SVG delegate can ignore embedded data-URI images, so extract the actual
          # embedded JPEG bytes first, then build every Windows icon size from those
          # original artwork pixels. Never trim the white field or crop the border.
          $svgText = Get-Content $source -Raw
          $match = [regex]::Match($svgText, 'data:image/(?<type>jpeg|jpg|png);base64,(?<data>[^"]+)')
          if (-not $match.Success) { throw "Logo SVG does not contain an embedded PNG/JPEG artwork image." }
          $extension = if ($match.Groups['type'].Value -eq 'png') { 'png' } else { 'jpg' }
          $embedded = "build/icon-source.$extension"
          [IO.File]::WriteAllBytes($embedded, [Convert]::FromBase64String($match.Groups['data'].Value))
          magick $embedded -auto-orient -background white -alpha remove -alpha off -resize "1024x1024" -gravity center -extent 1024x1024 "build/icon.png"
          magick "build/icon.png" -define icon:auto-resize=16,24,32,48,64,128,256 "build/icon.ico"
          $identify = magick identify -format "%m %wx%h %[fx:standard_deviation]" "build/icon.png"
          if ($identify -notmatch "PNG 1024x1024") { throw "Unexpected icon.png output: $identify" }
          if (-not (Test-Path "build/icon.ico")) { throw "build/icon.ico was not generated." }
          $variance = [double](magick identify -format "%[fx:standard_deviation]" "build/icon.png")
          if ($variance -lt 0.01) { throw "Generated Windows icon appears blank/flat: standard deviation $variance" }
          Write-Host "Generated Nexfix Windows icon from original artwork: $identify"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build web app
        env:
          VITE_GOOGLE_BACKUP_API_KEY: ${{ secrets.VITE_GOOGLE_BACKUP_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_GOOGLE_BACKUP_API_KEY)) { throw "VITE_GOOGLE_BACKUP_API_KEY secret is empty." }
          $base = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $parts = $base.Split('.')
          if ($parts.Count -lt 3) { throw "package.json version must be MAJOR.MINOR.PATCH" }
          $env:VITE_APP_VERSION = "$($parts[0]).$($parts[1]).${{ github.run_number }}"
          $env:VITE_PUBLIC_APP_URL = "https://sanjula26.github.io/Nexfix-POS/"
          npm run build

      - name: Verify Electron asset paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $html = Get-Content dist/index.html -Raw
          if ($html -match '(?:src|href)="/assets/') {
            throw 'Electron build contains absolute /assets/ URLs. Packaged file:// renderer would load from the disk root.'
          }
          $assetRefs = [regex]::Matches($html, '(?:src|href)="([^"]*assets/[^"]*)"') | ForEach-Object { $_.Groups[1].Value }
          if ($assetRefs.Count -eq 0) { throw 'No Vite asset references found in dist/index.html.' }
          if ($assetRefs | Where-Object { $_ -notmatch '^(?:\./)?assets/' }) {
            throw "Electron asset references must be relative (./assets/... or assets/...). Found: $($assetRefs -join ', ')"
          }
          Write-Host "Electron-safe asset paths verified:"
          $assetRefs | Select-Object -Unique | ForEach-Object { Write-Host "  $_" }

      - name: Calculate automatic release version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $parts = $base.Split('.')
          if ($parts.Count -lt 3) { throw "package.json version must be MAJOR.MINOR.PATCH" }
          $buildVersion = "$($parts[0]).$($parts[1]).${{ github.run_number }}"
          "BUILD_VERSION=$buildVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          Write-Host "Automatic release version: $buildVersion"
          $tag = "v$buildVersion"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $tag
          git push origin $tag
          Write-Host "Created release tag $tag"
      - name: Build Windows installer and portable app
        env:
          VITE_GOOGLE_BACKUP_API_KEY: ${{ secrets.VITE_GOOGLE_BACKUP_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EP_GH_IGNORE_TIME: "true"
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_GOOGLE_BACKUP_API_KEY)) { throw "VITE_GOOGLE_BACKUP_API_KEY secret is empty." }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_SERVICE_ROLE_KEY)) { throw "SUPABASE_SERVICE_ROLE_KEY secret is empty." }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $package.version = $env:BUILD_VERSION
          $package | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding utf8
          Write-Host "Packaging Windows EXE as version $env:BUILD_VERSION"
          npx electron-builder --win --publish never

      - name: Verify Windows artifacts and updater metadata
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -File
          $exeFiles = $files | Where-Object { $_.Extension -eq '.exe' }
          $installer = $files | Where-Object { $_.Name -match '-installer\.exe$' }
          $blockmaps = $files | Where-Object { $_.Name -like '*.blockmap' }
          if ($files.Count -lt 2) { throw 'Expected installer and portable artifacts.' }
          if ($exeFiles.Count -lt 2) { throw 'Expected at least two Windows .exe artifacts.' }
          if ($installer.Count -lt 1) { throw 'Expected an NSIS installer artifact.' }
          if ($blockmaps.Count -lt 1) { throw 'Expected an NSIS blockmap.' }
          Write-Host 'Windows artifacts verified: installer + portable + blockmap(s)'
      - name: Generate release checksums
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem -Path release -Filter *.exe -File | Sort-Object Name
          if ($exeFiles.Count -lt 2) { throw "Expected at least two Windows .exe artifacts before checksum generation." }
          $lines = foreach ($file in $exeFiles) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - name: Publish Windows release to private Supabase Storage
        shell: pwsh
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_SERVICE_ROLE_KEY)) { throw 'SUPABASE_SERVICE_ROLE_KEY secret is empty.' }
          $projectRef = 'ocmzgamnehwbkuwkjdrr'
          $projectUrl = "https://$projectRef.supabase.co"
          $storageUrl = "https://$projectRef.storage.supabase.co"
          $bucket = 'nexfix-desktop-updates'
          $version = $env:BUILD_VERSION
          $installer = Get-ChildItem -Path release -Filter '*-installer.exe' -File | Select-Object -First 1
          $portable = Get-ChildItem -Path release -Filter '*-portable.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Installer artifact not found.' }
          if (-not $portable) { throw 'Portable artifact not found.' }

          function Get-Sha512Base64([string]$path) {
            $hex = (Get-FileHash -Algorithm SHA512 -Path $path).Hash
            $bytes = [byte[]]::new($hex.Length / 2)
            for ($i = 0; $i -lt $bytes.Length; $i++) { $bytes[$i] = [Convert]::ToByte($hex.Substring($i * 2, 2), 16) }
            return [Convert]::ToBase64String($bytes)
          }

          # Supabase recommends TUS resumable uploads for files larger than 6 MB.
          # The direct storage hostname is used for better large-file performance.
          npm install --no-save --no-package-lock tus-js-client@4

          @'
          const fs = require('fs');
          const tus = require('tus-js-client');

          const [, , filePath, objectPath] = process.argv;
          const endpoint = process.env.SUPABASE_TUS_ENDPOINT;
          const token = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const bucketName = process.env.SUPABASE_BUCKET;

          if (!filePath || !objectPath || !endpoint || !token || !bucketName) {
            throw new Error('Missing TUS upload arguments/environment.');
          }

          const file = fs.createReadStream(filePath);
          const upload = new tus.Upload(file, {
            endpoint,
            headers: {
              Authorization: `Bearer ${token}`,
              'x-upsert': 'true',
            },
            metadata: {
              bucketName,
              objectName: objectPath,
              contentType: 'application/octet-stream',
              cacheControl: '31536000',
            },
            chunkSize: 6 * 1024 * 1024,
            retryDelays: [0, 3000, 5000, 10000, 20000],
            onProgress(bytesUploaded, bytesTotal) {
              const percent = ((bytesUploaded / bytesTotal) * 100).toFixed(1);
              process.stdout.write(`\\rUploading ${objectPath}: ${percent}%`);
            },
            onError(error) {
              console.error(`\\nTUS upload failed for ${objectPath}:`, error);
              process.exitCode = 1;
            },
            onSuccess() {
              console.log(`\\nUploaded private object: ${objectPath}`);
            },
          });

          upload.start();
          '@ | Set-Content -Path "$env:RUNNER_TEMP\supabase-tus-upload.cjs" -Encoding utf8

          $env:SUPABASE_TUS_ENDPOINT = "$storageUrl/storage/v1/upload/resumable"
          $env:SUPABASE_BUCKET = $bucket

          node "$env:RUNNER_TEMP\supabase-tus-upload.cjs" $installer.FullName "win32/latest/$($installer.Name)"
          if ($LASTEXITCODE -ne 0) { throw "TUS upload failed for $($installer.Name)." }

          node "$env:RUNNER_TEMP\supabase-tus-upload.cjs" $portable.FullName "win32/latest/$($portable.Name)"
          if ($LASTEXITCODE -ne 0) { throw "TUS upload failed for $($portable.Name)." }

          $headers = @{ Authorization = "Bearer $env:SUPABASE_SERVICE_ROLE_KEY"; apikey = $env:SUPABASE_SERVICE_ROLE_KEY; 'Content-Type' = 'application/json'; Prefer = 'return=minimal' }
          Invoke-RestMethod -Uri "$projectUrl/rest/v1/desktop_releases?platform=eq.win32&channel=eq.latest&is_active=eq.true" -Method Patch -Headers $headers -Body '{"is_active":false}' | Out-Null
          $release = @{ version=$version; channel='latest'; platform='win32'; installer_path="win32/latest/$($installer.Name)"; installer_name=$installer.Name; installer_sha512=(Get-Sha512Base64 $installer.FullName); installer_size=[int64]$installer.Length; portable_path="win32/latest/$($portable.Name)"; portable_name=$portable.Name; release_notes="Nexfix POS Windows release $version"; is_active=$true } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "$projectUrl/rest/v1/desktop_releases" -Method Post -Headers $headers -Body $release | Out-Null
          Write-Host "Private release metadata published: $version"

      - name: Verify private Windows release
        shell: pwsh
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $projectUrl = 'https://ocmzgamnehwbkuwkjdrr.supabase.co'
          $headers = @{ Authorization = "Bearer $env:SUPABASE_SERVICE_ROLE_KEY"; apikey = $env:SUPABASE_SERVICE_ROLE_KEY }
          $rows = Invoke-RestMethod -Uri "$projectUrl/rest/v1/desktop_releases?platform=eq.win32&channel=eq.latest&is_active=eq.true&select=version,installer_name,installer_size" -Headers $headers
          if ($rows.Count -ne 1) { throw 'Expected exactly one active private Windows release.' }
          if ($rows[0].version -ne $env:BUILD_VERSION) { throw "Private release version mismatch: $($rows[0].version) != $env:BUILD_VERSION" }
          if ([int64]$rows[0].installer_size -le 0) { throw 'Private installer size is invalid.' }
          Write-Host "Private Supabase release verified: $($rows[0].version) / $($rows[0].installer_name)"
