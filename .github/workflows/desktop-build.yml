name: Windows Desktop Build
# Release workflow verifies Windows installer/portable outputs and publishes checksums.

# Production publishing is manual-only. Merging application code must not
# automatically publish an installer, change the active updater release, or
# trigger retention cleanup in private R2/Supabase storage.
on:
  workflow_dispatch:
    inputs:
      confirm_production_release:
        description: 'Confirm publishing a production Windows EXE to private R2/Supabase (does not run retention cleanup)'
        required: true
        type: boolean
        default: false
      confirm_private_retention_cleanup:
        description: 'Separately confirm deletion of superseded private Supabase chunks and old private R2 installers'
        required: true
        type: boolean
        default: false
      confirm_public_github_release_cleanup:
        description: 'Separately confirm deletion of all public GitHub Releases in this repository'
        required: true
        type: boolean
        default: false

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # This guard must remain before all build and production publication steps.
      - name: Validate production release confirmation
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_CONFIRMED: ${{ inputs.confirm_production_release }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_REF -ne 'refs/heads/main') {
            throw "Production Windows releases may only run from main. Selected ref: $env:RELEASE_REF"
          }
          if ($env:RELEASE_CONFIRMED -ne 'true') {
            throw 'Production release was not explicitly confirmed. Re-run manually and check confirm_production_release only when ready to publish.'
          }
          Write-Host 'Production release confirmation and main branch guard passed.'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Nexfix Windows icon assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) { throw "ImageMagick (magick) is required on windows-latest." }
          $source = "assets/nexfix-pos-icon.svg"
          if (-not (Test-Path $source)) { throw "Missing logo source: $source" }
          New-Item -ItemType Directory -Force -Path build | Out-Null
          # The logo source is an SVG wrapper around the supplied artwork. ImageMagick's
          # SVG delegate can ignore embedded data-URI images, so extract the actual
          # embedded JPEG bytes first, then build every Windows icon size from those
          # original artwork pixels. Never trim the white field or crop the border.
          $svgText = Get-Content $source -Raw
          $match = [regex]::Match($svgText, 'data:image/(?<type>jpeg|jpg|png);base64,(?<data>[^"]+)')
          if (-not $match.Success) { throw "Logo SVG does not contain an embedded PNG/JPEG artwork image." }
          $extension = if ($match.Groups['type'].Value -eq 'png') { 'png' } else { 'jpg' }
          $embedded = "build/icon-source.$extension"
          [IO.File]::WriteAllBytes($embedded, [Convert]::FromBase64String($match.Groups['data'].Value))
          magick $embedded -auto-orient -background white -alpha remove -alpha off -resize "1024x1024" -gravity center -extent 1024x1024 "build/icon.png"
          magick "build/icon.png" -define icon:auto-resize=16,24,32,48,64,128,256 "build/icon.ico"
          $identify = magick identify -format "%m %wx%h %[fx:standard_deviation]" "build/icon.png"
          if ($identify -notmatch "PNG 1024x1024") { throw "Unexpected icon.png output: $identify" }
          if (-not (Test-Path "build/icon.ico")) { throw "build/icon.ico was not generated." }
          $variance = [double](magick identify -format "%[fx:standard_deviation]" "build/icon.png")
          if ($variance -lt 0.01) { throw "Generated Windows icon appears blank/flat: standard deviation $variance" }
          Write-Host "Generated Nexfix Windows icon from original artwork: $identify"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build web app
        env:
          VITE_GOOGLE_BACKUP_API_KEY: ${{ secrets.VITE_GOOGLE_BACKUP_API_KEY }}
          # Supabase publishable client configuration is safe to ship in the renderer.
          # The service-role key is never exposed to Vite/browser code.
          VITE_SUPABASE_URL: https://ocmzgamnehwbkuwkjdrr.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_9DYtQ1kfcKClSb47Ghh-cQ_FRDz2tK-
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_GOOGLE_BACKUP_API_KEY)) { throw "VITE_GOOGLE_BACKUP_API_KEY secret is empty." }
          $base = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $parts = $base.Split('.')
          if ($parts.Count -lt 3) { throw "package.json version must be MAJOR.MINOR.PATCH" }
          $env:VITE_APP_VERSION = "$($parts[0]).$($parts[1]).${{ github.run_number }}"
          $env:VITE_PUBLIC_APP_URL = "https://sanjula26.github.io/Nexfix-POS/"
          npm run build
          $bundled = (Get-ChildItem -Path dist/assets -File -ErrorAction Stop | ForEach-Object { Get-Content $_.FullName -Raw }) -join [Environment]::NewLine
          if (-not $bundled.Contains('ocmzgamnehwbkuwkjdrr.supabase.co')) { throw 'Supabase URL was not bundled into the desktop web build.' }
          Write-Host 'Supabase client configuration is present in the generated renderer bundle.'

      - name: Verify Electron asset paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $html = Get-Content dist/index.html -Raw
          if ($html -match '(?:src|href)="/assets/') {
            throw 'Electron build contains absolute /assets/ URLs. Packaged file:// renderer would load from the disk root.'
          }
          $assetRefs = [regex]::Matches($html, '(?:src|href)="([^"]*assets/[^"]*)"') | ForEach-Object { $_.Groups[1].Value }
          if ($assetRefs.Count -eq 0) { throw 'No Vite asset references found in dist/index.html.' }
          if ($assetRefs | Where-Object { $_ -notmatch '^(?:\./)?assets/' }) {
            throw "Electron asset references must be relative (./assets/... or assets/...). Found: $($assetRefs -join ', ')"
          }
          Write-Host "Electron-safe asset paths verified:"
          $assetRefs | Select-Object -Unique | ForEach-Object { Write-Host "  $_" }

      - name: Calculate automatic release version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $parts = $base.Split('.')
          if ($parts.Count -lt 3) { throw "package.json version must be MAJOR.MINOR.PATCH" }
          $buildVersion = "$($parts[0]).$($parts[1]).${{ github.run_number }}"
          "BUILD_VERSION=$buildVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          Write-Host "Automatic release version: $buildVersion"
      - name: Build Windows installer and portable app
        env:
          VITE_GOOGLE_BACKUP_API_KEY: ${{ secrets.VITE_GOOGLE_BACKUP_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EP_GH_IGNORE_TIME: "true"
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_GOOGLE_BACKUP_API_KEY)) { throw "VITE_GOOGLE_BACKUP_API_KEY secret is empty." }
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_SERVICE_ROLE_KEY)) { throw "SUPABASE_SERVICE_ROLE_KEY secret is empty." }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $package.version = $env:BUILD_VERSION
          $package | ConvertTo-Json -Depth 100 | Set-Content package.json -Encoding utf8
          Write-Host "Packaging Windows EXE as version $env:BUILD_VERSION"
          npx electron-builder --win --publish never

      - name: Verify Windows artifacts and updater metadata
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -File
          $exeFiles = $files | Where-Object { $_.Extension -eq '.exe' }
          $installer = $files | Where-Object { $_.Name -match '-installer\.exe$' }
          $blockmaps = $files | Where-Object { $_.Name -like '*.blockmap' }
          if ($files.Count -lt 2) { throw 'Expected installer and portable artifacts.' }
          if ($exeFiles.Count -lt 2) { throw 'Expected at least two Windows .exe artifacts.' }
          if ($installer.Count -lt 1) { throw 'Expected an NSIS installer artifact.' }
          if ($blockmaps.Count -lt 1) { throw 'Expected an NSIS blockmap.' }
          Write-Host 'Windows artifacts verified: installer + portable + blockmap(s)'
      - name: Generate release checksums
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem -Path release -Filter *.exe -File | Sort-Object Name
          if ($exeFiles.Count -lt 2) { throw "Expected at least two Windows .exe artifacts before checksum generation." }
          $lines = foreach ($file in $exeFiles) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $file.FullName).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $lines | Set-Content -Path release/SHA256SUMS.txt -Encoding ascii
          Get-Content release/SHA256SUMS.txt

      - name: Publish Windows release to private Cloudflare R2
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: nexfix-desktop-updates
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('R2_ACCOUNT_ID','R2_ACCESS_KEY_ID','R2_SECRET_ACCESS_KEY','R2_BUCKET')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) { throw "$name secret is empty." }
          }
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) { choco install awscli -y --no-progress }
          aws --version

          $r2Endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          $version = $env:BUILD_VERSION
          $installer = Get-ChildItem -Path release -Filter '*-installer.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Installer artifact not found.' }
          $objectKey = "win32/latest/$($installer.Name)"

          function Get-Sha512Base64([string]$path) {
            $hex = (Get-FileHash -Algorithm SHA512 -Path $path).Hash
            $bytes = [byte[]]::new($hex.Length / 2)
            for ($i = 0; $i -lt $bytes.Length; $i++) { $bytes[$i] = [Convert]::ToByte($hex.Substring($i * 2, 2), 16) }
            return [Convert]::ToBase64String($bytes)
          }

          $env:AWS_ACCESS_KEY_ID = $env:R2_ACCESS_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:R2_SECRET_ACCESS_KEY
          $env:AWS_DEFAULT_REGION = 'auto'

          Write-Host "Uploading $($installer.Name) to private R2 object with a single S3 PutObject request: $objectKey"
          # The installer is well below R2's 5 GiB single-PUT limit. Use PutObject here
          # instead of the AWS CLI's multipart CreateMultipartUpload path so the release
          # publisher has one deterministic SigV4 request against the R2 S3 API.
          aws s3api put-object --bucket $env:R2_BUCKET --key $objectKey --body $installer.FullName --endpoint-url $r2Endpoint --region auto --content-type 'application/octet-stream' --cache-control 'no-store' --content-disposition "attachment; filename=$($installer.Name)" --no-cli-pager
          if ($LASTEXITCODE -ne 0) { throw 'Cloudflare R2 installer upload failed.' }

          $headJson = aws s3api head-object --bucket $env:R2_BUCKET --key $objectKey --endpoint-url $r2Endpoint --region auto --output json
          if ($LASTEXITCODE -ne 0) { throw 'Cloudflare R2 object verification failed: head-object failed.' }
          $head = $headJson | ConvertFrom-Json
          if ([int64]$head.ContentLength -ne [int64]$installer.Length) { throw "R2 object size mismatch: $($head.ContentLength) != $($installer.Length)" }

          $verifyPath = Join-Path $env:RUNNER_TEMP 'nexfix-r2-installer-verify.exe'
          Remove-Item $verifyPath -Force -ErrorAction SilentlyContinue
          aws s3 cp "s3://$env:R2_BUCKET/$objectKey" $verifyPath --endpoint-url $r2Endpoint --region auto --only-show-errors
          if ($LASTEXITCODE -ne 0) { throw 'Cloudflare R2 installer download verification failed.' }
          $sourceHash = Get-Sha512Base64 $installer.FullName
          $servedHash = Get-Sha512Base64 $verifyPath
          if ($sourceHash -ne $servedHash) { throw 'R2 installer SHA-512 verification failed.' }
          Remove-Item $verifyPath -Force -ErrorAction SilentlyContinue

          Write-Host "R2 installer uploaded and byte-verified for $version; active release metadata will be published after legacy compatibility chunks are verified."

      - name: Publish legacy compatibility chunks to private Supabase Storage
        shell: pwsh
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_SERVICE_ROLE_KEY)) { throw 'SUPABASE_SERVICE_ROLE_KEY secret is empty.' }
          $projectRef = 'ocmzgamnehwbkuwkjdrr'
          $projectUrl = "https://$projectRef.supabase.co"
          $storageUrl = "https://$projectRef.storage.supabase.co"
          $bucket = 'nexfix-desktop-updates'
          $version = $env:BUILD_VERSION
          $installer = Get-ChildItem -Path release -Filter '*-installer.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Installer artifact not found.' }

          function Get-Sha512Base64([string]$path) {
            $hex = (Get-FileHash -Algorithm SHA512 -Path $path).Hash
            $bytes = [byte[]]::new($hex.Length / 2)
            for ($i = 0; $i -lt $bytes.Length; $i++) { $bytes[$i] = [Convert]::ToByte($hex.Substring($i * 2, 2), 16) }
            return [Convert]::ToBase64String($bytes)
          }

          # Free Supabase projects enforce a 50 MB global object limit.
          # Keep each private release chunk safely below that limit and reconstruct
          # the original installer only inside the authorized update gateway.
          $chunkBytes = 40 * 1024 * 1024
          npm install --no-save --no-package-lock tus-js-client@4

          @'
          const fs = require('fs');
          const tus = require('tus-js-client');

          const [, , filePath, objectPrefix, chunkBytesText] = process.argv;
          const endpoint = process.env.SUPABASE_TUS_ENDPOINT;
          const token = process.env.SUPABASE_SERVICE_ROLE_KEY;
          const bucketName = process.env.SUPABASE_BUCKET;
          const chunkBytes = Number(chunkBytesText);

          if (!filePath || !objectPrefix || !endpoint || !token || !bucketName || !Number.isFinite(chunkBytes) || chunkBytes <= 0) {
            throw new Error('Missing TUS upload arguments/environment.');
          }

          function uploadBuffer(buffer, objectPath) {
            return new Promise((resolve, reject) => {
              const upload = new tus.Upload(buffer, {
                endpoint,
                headers: {
                  apikey: token,
                  'x-upsert': 'true',
                },
                metadata: {
                  bucketName,
                  objectName: objectPath,
                  contentType: 'application/octet-stream',
                  cacheControl: '31536000',
                },
                chunkSize: 6 * 1024 * 1024,
                uploadDataDuringCreation: true,
                removeFingerprintOnSuccess: true,
                retryDelays: [0, 3000, 5000, 10000, 20000],
                onProgress(bytesUploaded, bytesTotal) {
                  const percent = ((bytesUploaded / bytesTotal) * 100).toFixed(1);
                  process.stdout.write(`\rUploading ${objectPath}: ${percent}%`);
                },
                onError(error) {
                  reject(error);
                },
                onSuccess() {
                  process.stdout.write('\n');
                  resolve();
                },
              });
              upload.start();
            });
          }

          async function main() {
            const stat = fs.statSync(filePath);
            const fd = fs.openSync(filePath, 'r');
            let index = 1;
            try {
              for (let offset = 0; offset < stat.size; offset += chunkBytes) {
                const length = Math.min(chunkBytes, stat.size - offset);
                const buffer = Buffer.allocUnsafe(length);
                let read = 0;
                while (read < length) {
                  const n = fs.readSync(fd, buffer, read, length - read, offset + read);
                  if (!n) throw new Error(`Unexpected EOF while reading ${filePath}`);
                  read += n;
                }
                const objectPath = `${objectPrefix}.part${String(index).padStart(4, '0')}`;
                await uploadBuffer(buffer, objectPath);
                index++;
              }
              console.log(`Uploaded ${index - 1} private chunks for ${filePath}`);
            } finally {
              fs.closeSync(fd);
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          '@ | Set-Content -Path "$env:RUNNER_TEMP\supabase-tus-chunk-upload.cjs" -Encoding utf8

          $env:SUPABASE_TUS_ENDPOINT = "$storageUrl/storage/v1/upload/resumable"
          $env:SUPABASE_BUCKET = $bucket
          $env:NODE_PATH = "$PWD\node_modules"

          node "$env:RUNNER_TEMP\supabase-tus-chunk-upload.cjs" $installer.FullName "win32/latest/$($installer.Name)" $chunkBytes
          if ($LASTEXITCODE -ne 0) { throw "TUS chunk upload failed for $($installer.Name)." }

          $headers = @{ apikey = $env:SUPABASE_SERVICE_ROLE_KEY; 'Content-Type' = 'application/json'; Prefer = 'return=minimal'; 'User-Agent' = 'Nexfix-GitHub-Action/1.0' }

          # Verify uploaded objects through the Supabase Storage API before changing the
          # active release pointer. The Storage Data API does not expose the internal
          # storage.objects table through /rest/v1, so use the supported object-list endpoint.
          $installerParts = [math]::Ceiling([double]$installer.Length / $chunkBytes)
          $storageHeaders = @{
            apikey = $env:SUPABASE_SERVICE_ROLE_KEY
            Authorization = "Bearer $env:SUPABASE_SERVICE_ROLE_KEY"
            'Content-Type' = 'application/json'
            'User-Agent' = 'Nexfix-GitHub-Action/1.0'
          }

          function Get-StorageObjectSize([string]$path) {
            $lastSlash = $path.LastIndexOf('/')
            if ($lastSlash -lt 0) {
              $prefix = ''
              $filename = $path
            } else {
              $prefix = $path.Substring(0, $lastSlash + 1)
              $filename = $path.Substring($lastSlash + 1)
            }

            $listUrl = "$storageUrl/storage/v1/object/list/$bucket"

            # Storage's list API supports server-side search within a prefix. This is
            # important because this bucket contains many historical release chunks and
            # the target version is not guaranteed to be on the first paginated page.
            $body = @{
              prefix = $prefix
              search = $filename
              limit = 10
              offset = 0
            } | ConvertTo-Json -Compress
            $rows = @(Invoke-RestMethod -Uri $listUrl -Method Post -Headers $storageHeaders -Body $body)

            # Results may use names relative to the prefix or full object keys.
            $matches = @($rows | Where-Object {
              $_.name -eq $filename -or
              $_.name -eq $path -or
              $_.name -eq "$prefix$filename"
            })

            if ($matches.Count -ne 1) {
              Write-Host "Storage search verification returned $($rows.Count) row(s) for prefix '$prefix', search '$filename'."
              Write-Host "Raw Storage search response:"
              ($rows | ConvertTo-Json -Depth 20) | Write-Host
              throw "Expected exactly one uploaded storage object: $path (found $($matches.Count))"
            }

            $metadata = $matches[0].metadata
            if ($null -eq $metadata) { throw "Storage object metadata is missing: $path" }
            if ($metadata -is [string]) { $metadata = $metadata | ConvertFrom-Json }
            if ($null -eq $metadata.size) { throw "Storage object metadata size is missing: $path" }
            return [int64]$metadata.size
          }

          $installerUploadedBytes = [int64]0
          foreach ($i in 1..$installerParts) {
            $path = "win32/latest/$($installer.Name).part$('{0:D4}' -f $i)"
            $size = Get-StorageObjectSize $path
            $expected = [int64][math]::Min($chunkBytes, $installer.Length - (($i - 1) * $chunkBytes))
            if ($size -ne $expected) { throw "Installer chunk size mismatch: $path => $size != $expected" }
            $installerUploadedBytes += $size
          }
          if ($installerUploadedBytes -ne [int64]$installer.Length) {
            throw "Installer chunk byte total mismatch: $installerUploadedBytes != $($installer.Length)"
          }

          # The private updater distributes only the signed NSIS installer. Keep the
          # portable build as a CI artifact, but do not store a second ~120 MB copy in
          # Supabase Storage because electron-updater never requests it.
          #
          # Publish metadata through one database transaction. The database
          # deactivates the previous release and inserts the new active release
          # atomically, protected by a one-active-release unique index.
          $rpc = @{
            p_version = $version
            p_channel = 'latest'
            p_platform = 'win32'
            p_installer_path = "win32/latest/$($installer.Name)"
            p_installer_name = $installer.Name
            p_installer_sha512 = Get-Sha512Base64 $installer.FullName
            p_installer_size = [int64]$installer.Length
            p_release_notes = "Nexfix POS Windows release $version"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Uri "$projectUrl/rest/v1/rpc/publish_desktop_release" -Method Post -Headers $headers -Body $rpc | Out-Null

          Write-Host "Private Windows release chunks published and verified atomically: $version (installer $installerParts parts; byte total exact)"

      - name: Verify private Windows release
        shell: pwsh
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: nexfix-desktop-updates
        run: |
          $ErrorActionPreference = 'Stop'
          $projectUrl = 'https://ocmzgamnehwbkuwkjdrr.supabase.co'
          $r2Endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          $headers = @{ apikey = $env:SUPABASE_SERVICE_ROLE_KEY; 'User-Agent' = 'Nexfix-GitHub-Action/2.0' }
          $rows = Invoke-RestMethod -Uri "$projectUrl/rest/v1/desktop_releases?platform=eq.win32&channel=eq.latest&is_active=eq.true&select=version,installer_name,installer_path,installer_size" -Headers $headers
          if ($rows.Count -ne 1) { throw 'Expected exactly one active private Windows release.' }
          if ($rows[0].version -ne $env:BUILD_VERSION) { throw "Private release version mismatch: $($rows[0].version) != $env:BUILD_VERSION" }
          if ([int64]$rows[0].installer_size -le 0) { throw 'Private installer size is invalid.' }
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) { choco install awscli -y --no-progress }
          $env:AWS_ACCESS_KEY_ID = $env:R2_ACCESS_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:R2_SECRET_ACCESS_KEY
          $env:AWS_DEFAULT_REGION = 'auto'
          $head = aws s3api head-object --bucket $env:R2_BUCKET --key ([string]$rows[0].installer_path) --endpoint-url $r2Endpoint --region auto --output json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'R2 active installer object could not be verified.' }
          if ([int64]$head.ContentLength -ne [int64]$rows[0].installer_size) { throw "R2 active installer size mismatch: $($head.ContentLength) != $($rows[0].installer_size)" }
          Write-Host "Private R2 release verified: $($rows[0].version) / $($rows[0].installer_name) / $($rows[0].installer_path)"

      - name: Create release tag after private release verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "v$env:BUILD_VERSION"
          $currentCommit = (git rev-parse HEAD).Trim()
          $remoteTagLines = @(git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}")
          if ($LASTEXITCODE -ne 0) { throw "Could not check whether release tag $tag already exists." }
          $remoteTagRefs = @(
            $remoteTagLines | ForEach-Object {
              $parts = "$_" -split '\s+'
              if ($parts.Count -ge 2) { [pscustomobject]@{ Sha = $parts[0]; Ref = $parts[1] } }
            }
          )
          # Handle both lightweight tags and annotated tags. A rerun is safe only
          # when the existing tag resolves to this exact source commit.
          $tagCommit = ($remoteTagRefs | Where-Object { $_.Ref -eq "refs/tags/$tag^{}" } | Select-Object -First 1).Sha
          if (-not $tagCommit) {
            $tagCommit = ($remoteTagRefs | Where-Object { $_.Ref -eq "refs/tags/$tag" } | Select-Object -First 1).Sha
          }
          if ($tagCommit) {
            if ($tagCommit -ne $currentCommit) {
              throw "Release tag $tag already points to a different commit ($tagCommit != $currentCommit)."
            }
            Write-Host "Release tag $tag already points to this exact commit; safe rerun will reuse it."
          } else {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $tag
            if ($LASTEXITCODE -ne 0) { throw "Could not create release tag $tag." }
            git push origin $tag
            if ($LASTEXITCODE -ne 0) { throw "Could not push release tag $tag." }
            Write-Host "Created release tag $tag after private R2/Supabase release verification."
          }

      - name: Remove superseded private release chunks
        if: ${{ inputs.confirm_private_retention_cleanup }}
        shell: pwsh
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $projectUrl = 'https://ocmzgamnehwbkuwkjdrr.supabase.co'
          $bucket = 'nexfix-desktop-updates'
          $version = $env:BUILD_VERSION
          $installer = Get-ChildItem -Path release -Filter '*-installer.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Current installer artifact is missing during storage cleanup.' }

          $storageUrl = "$projectUrl/storage/v1"
          $headers = @{
            apikey = $env:SUPABASE_SERVICE_ROLE_KEY
            Authorization = "Bearer $env:SUPABASE_SERVICE_ROLE_KEY"
            'Content-Type' = 'application/json'
            'User-Agent' = 'Nexfix-GitHub-Action/1.0'
          }

          $active = @(Invoke-RestMethod -Uri "$projectUrl/rest/v1/desktop_releases?platform=eq.win32&channel=eq.latest&is_active=eq.true&select=version,installer_name,is_active&order=published_at.desc" -Headers $headers)
          if ($active.Count -ne 1) { throw "Expected exactly one active private Windows release after publish; found $($active.Count)." }
          if ([string]$active[0].version -ne $version) { throw "Active private release mismatch: $($active[0].version) != $version" }

          $currentNames = @($installer.Name)

          # list-v2 uses cursor pagination. Never assume the first 1,000 rows
          # represent every historical installer chunk in a busy release prefix.
          function Get-ReleaseChunkPaths {
            $pageSize = 1000
            $cursor = $null
            $paths = [System.Collections.Generic.List[string]]::new()
            do {
              $listOptions = @{ prefix='win32/latest/'; limit=$pageSize; with_delimiter=$false }
              if (-not [string]::IsNullOrWhiteSpace($cursor)) { $listOptions.cursor = $cursor }
              $pageBody = $listOptions | ConvertTo-Json -Compress
              $page = Invoke-RestMethod -Uri "$storageUrl/object/list-v2/$bucket" -Method Post -Headers $headers -Body $pageBody
              $objects = @($page.objects)
              foreach ($object in $objects) {
                if ($null -eq $object.id) { continue }
                $name = [string]$object.name
                if (-not $name.StartsWith('win32/latest/', [StringComparison]::Ordinal)) { $name = "win32/latest/$name" }
                if ($name -like 'win32/latest/Nexfix-POS-*.part*') { $paths.Add($name) }
              }

              if ([bool]$page.hasNext) {
                $nextCursor = [string]$page.nextCursor
                if ([string]::IsNullOrWhiteSpace($nextCursor) -or $nextCursor -eq $cursor) {
                  throw 'Supabase Storage list-v2 indicated another page but returned a missing or repeated cursor.'
                }
                $cursor = $nextCursor
              } else {
                $cursor = $null
              }
            } while ([bool]$page.hasNext)

            return @($paths | Sort-Object -Unique)
          }

          $releasePaths = @(Get-ReleaseChunkPaths)
          $removePaths = @(
            $releasePaths |
              Where-Object {
                $leaf = $_.Substring($_.LastIndexOf('/') + 1)
                -not ($currentNames | Where-Object { $leaf.StartsWith($_ + '.part', [StringComparison]::Ordinal) })
              }
          )

          Write-Host "Current release: $version"
          Write-Host "Storage list-v2 file rows across all cursor pages: $($releasePaths.Count)"
          Write-Host "Superseded chunks to remove: $($removePaths.Count)"
          if ($removePaths.Count -gt 0) {
            # Delete superseded chunks in one Storage API request instead of one
            # request per object. This reduces unnecessary Storage API traffic while
            # keeping the same post-delete verification below.
            $deleteBody = @{ prefixes = @($removePaths | ForEach-Object { [string]$_ }) } | ConvertTo-Json -Compress
            Invoke-RestMethod -Uri "$storageUrl/object/$bucket" -Method Delete -Headers $headers -Body $deleteBody | Out-Null
            Write-Host "Requested deletion of $($removePaths.Count) superseded storage chunk(s) in one batch."
          }

          $remaining = @(Get-ReleaseChunkPaths)
          $bad = @(
            $remaining |
              Where-Object {
                $leaf = $_.Substring($_.LastIndexOf('/') + 1)
                -not ($currentNames | Where-Object { $leaf.StartsWith($_ + '.part', [StringComparison]::Ordinal) })
              }
          )
          if ($bad.Count -gt 0) { throw "Storage cleanup verification failed; unexpected release objects remain: $($bad -join ', ')" }

          $expectedInstallerParts = [math]::Ceiling([double]$installer.Length / (40 * 1024 * 1024))
          $expectedTotal = $expectedInstallerParts
          if ($remaining.Count -ne $expectedTotal) {
            throw "Storage cleanup verification failed; expected $expectedTotal current chunks but found $($remaining.Count). Remaining: $($remaining -join ', ')"
          }
          Write-Host "Storage cleanup verified: $($remaining.Count) current release chunks remain for $version."
          

      - name: Retain the three newest private R2 installers
        if: ${{ inputs.confirm_private_retention_cleanup }}
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: nexfix-desktop-updates
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $r2Endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          $installer = Get-ChildItem -Path release -Filter '*-installer.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Current installer artifact is missing during R2 retention cleanup.' }
          $currentKey = "win32/latest/$($installer.Name)"
          $maxRetainedReleases = 3
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_SERVICE_ROLE_KEY)) { throw 'SUPABASE_SERVICE_ROLE_KEY is required to protect the active installer during R2 retention.' }
          $projectUrl = 'https://ocmzgamnehwbkuwkjdrr.supabase.co'
          $headers = @{ apikey = $env:SUPABASE_SERVICE_ROLE_KEY; Authorization = "Bearer $($env:SUPABASE_SERVICE_ROLE_KEY)" }
          $activeRows = @(Invoke-RestMethod -Uri "$projectUrl/rest/v1/desktop_releases?platform=eq.win32&channel=eq.latest&is_active=eq.true&select=version,installer_path,installer_size" -Headers $headers)
          if ($activeRows.Count -ne 1) { throw "Expected exactly one active private Windows release before R2 retention; found $($activeRows.Count)." }
          $activeKey = [string]$activeRows[0].installer_path
          if ($activeKey -ne $currentKey) { throw "Published installer does not match the active release pointer. Active: $activeKey; current build: $currentKey. No R2 objects were deleted." }

          $env:AWS_ACCESS_KEY_ID = $env:R2_ACCESS_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:R2_SECRET_ACCESS_KEY
          $env:AWS_DEFAULT_REGION = 'auto'
          $rows = aws s3api list-objects-v2 --bucket $env:R2_BUCKET --prefix 'win32/latest/Nexfix-POS-' --endpoint-url $r2Endpoint --region auto --query 'Contents[].Key' --output json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list R2 installer objects.' }
          $keys = @(ConvertFrom-Json -InputObject ($rows -join "`n"))
          $versionedInstallers = @(
            $keys | ForEach-Object {
              $key = [string]$_
              if ($key -match '^win32/latest/Nexfix-POS-(?<version>\d+\.\d+\.\d+)-x64-installer\.exe$') {
                [pscustomobject]@{ Key = $key; Version = [version]$Matches['version'] }
              } else {
                throw "Unexpected object key under the private installer prefix: $key"
              }
            } | Sort-Object Version -Descending
          )
          if ($versionedInstallers.Count -lt 1) { throw 'No versioned private R2 installers were found.' }
          $activeEntry = @($versionedInstallers | Where-Object { $_.Key -eq $activeKey })
          if ($activeEntry.Count -ne 1) { throw "The active private installer is missing from R2: $activeKey. No R2 objects were deleted." }
          $activeHeadJson = aws s3api head-object --bucket $env:R2_BUCKET --key $activeKey --endpoint-url $r2Endpoint --region auto --output json
          if ($LASTEXITCODE -ne 0) { throw "The active private installer could not be verified in R2: $activeKey. No R2 objects were deleted." }
          $activeHead = ConvertFrom-Json -InputObject ($activeHeadJson -join "`n")
          if ([int64]$activeHead.ContentLength -ne [int64]$activeRows[0].installer_size) { throw 'Active R2 installer size does not match the Supabase release record. No R2 objects were deleted.' }

          # Always retain the active database-published installer, even if a
          # stale/older release is being re-run. Fill the other slots with the
          # newest versions so retention cannot delete the current download.
          $newestOtherInstallers = @($versionedInstallers | Where-Object { $_.Key -ne $activeKey } | Select-Object -First ($maxRetainedReleases - 1))
          $retained = @($activeEntry) + @($newestOtherInstallers)
          $retainedKeys = @($retained | ForEach-Object { [string]$_.Key } | Sort-Object)
          $removeKeys = @($versionedInstallers | Where-Object { $retainedKeys -notcontains $_.Key } | ForEach-Object { [string]$_.Key })

          if ($retainedKeys -notcontains $activeKey) { throw 'Active private installer is not in the retention set. No R2 objects were deleted.' }
          Write-Host "Active release protected: $activeKey"
          Write-Host "Keeping the $($retainedKeys.Count) installer(s), including the active release (maximum $maxRetainedReleases)."
          Write-Host "Superseded R2 installers to remove: $($removeKeys.Count)"
          foreach ($key in $removeKeys) {
            Write-Host "Removing superseded R2 installer: $key"
            aws s3api delete-object --bucket $env:R2_BUCKET --key $key --endpoint-url $r2Endpoint --region auto --output text | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to remove superseded R2 object: $key" }
          }

          $remainingJson = aws s3api list-objects-v2 --bucket $env:R2_BUCKET --prefix 'win32/latest/Nexfix-POS-' --endpoint-url $r2Endpoint --region auto --query 'Contents[].Key' --output json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify R2 retention cleanup.' }
          $remainingKeys = @(ConvertFrom-Json -InputObject ($remainingJson -join "`n") | ForEach-Object { [string]$_ } | Sort-Object)
          $differences = @(Compare-Object -ReferenceObject $retainedKeys -DifferenceObject $remainingKeys -CaseSensitive)
          if ($differences.Count -gt 0) { throw "R2 retention verification failed. Expected: $($retainedKeys -join ', '); found: $($remainingKeys -join ', ')" }
          $finalHeadJson = aws s3api head-object --bucket $env:R2_BUCKET --key $activeKey --endpoint-url $r2Endpoint --region auto --output json
          if ($LASTEXITCODE -ne 0) { throw 'Active installer disappeared during R2 retention cleanup.' }
          $finalHead = ConvertFrom-Json -InputObject ($finalHeadJson -join "`n")
          if ([int64]$finalHead.ContentLength -ne [int64]$activeRows[0].installer_size) { throw 'Active installer size changed during R2 retention cleanup.' }
          Write-Host "R2 retention verified: active release $($activeRows[0].version) remains and $($remainingKeys.Count) installer(s) are retained."
      - name: Remove public GitHub installer releases (separate explicit confirmation)
        if: ${{ inputs.confirm_public_github_release_cleanup }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The source repository is public, so GitHub Release assets are public too.
          # Delete releases by database ID, including old untagged releases whose
          # tag no longer exists. Cloudflare R2 is the primary installer distribution channel; temporary Supabase chunks remain only for legacy installed clients.
          $ids = gh api --paginate "repos/sanjula26/Nexfix-POS/releases?per_page=100" --jq '.[].id' |
            Where-Object { $_ -and $_.Trim() } |
            Sort-Object -Unique
          if ($LASTEXITCODE -ne 0) { throw 'Could not list GitHub releases for public-installer cleanup.' }
          foreach ($id in $ids) {
            Write-Host "Removing public GitHub release id: $id"
            gh api --method DELETE "repos/sanjula26/Nexfix-POS/releases/$id"
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "GitHub release id $id was already absent or could not be removed; continuing cleanup."
            }
          }
          Write-Host 'Public GitHub installer release cleanup complete. Cloudflare R2 is the primary Windows installer distribution channel.'
