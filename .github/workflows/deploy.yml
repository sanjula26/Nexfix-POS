# Optional: deploy to GitHub Pages (Netlify is recommended — see README).
# Enable only if you prefer Pages over Netlify.
name: Deploy GitHub Pages (optional)

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Uncomment to auto-deploy on every push:
    # paths-ignore: []

jobs:
  deploy:
    if: false  # set to true (or remove this line) to enable GitHub Pages deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_dir: ./dist
          github_token: ${{ secrets.GITHUB_TOKEN }}
