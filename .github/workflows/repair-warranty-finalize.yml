    setState(st=>{const tracked=new Map<string,number>();for(const pt of repair.parts||[])if(pt.productId)tracked.set(pt.productId,(tracked.get(pt.productId)||0)+pt.qty);const products=st.products.map(p=>{const qty=tracked.get(p.id)||0;return qty?{...p,stock:p.stock+qty}:p;});return {...st,products,repairs:(st.repairs||[]).filter(x=>x.id!==id)};});
