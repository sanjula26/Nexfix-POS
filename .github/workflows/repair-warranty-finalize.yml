          assert 'saveWarrantyClaim' in store.read_text() and 'saveWarrantyClaim(saved);' in page.read_text()
          PY
      - name: Verify
        run: npm ci && npm run typecheck && npm run lint && npm run build
      - name: Commit source and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/store.tsx src/pages/WarrantyClaims.tsx
          git rm .github/workflows/repair-warranty-finalize.yml
          git commit -m 'fix: harden repairs and warranty claims'
          git push origin HEAD:${{ github.head_ref }}
