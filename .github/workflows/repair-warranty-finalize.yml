name: Repair Warranty Finalize
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/checkout@v4
        with:
          path: _base
      - name: Patch
        run: python3 scripts/repair-warranty-hardening.py
      - name: Verify
        run: npm ci && npm run typecheck && npm run lint && npm run build
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/store.tsx src/pages/WarrantyClaims.tsx
          git commit -m 'fix: harden repairs and warranty claims' || exit 0
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
