name: Repair Warranty Finalize
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  finalize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Patch and verify
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          store=Path('src/lib/store.tsx'); s=store.read_text()
          s=s.replace('InventoryUnit, RepairJob, RepairStatus, PurchaseReturn, PurchaseReturnItem,','InventoryUnit, RepairJob, RepairStatus, PurchaseReturn, PurchaseReturnItem, WarrantyClaim, ClaimStatus,')
          s=s.replace('  deleteRepair: (id: string) => void;\n','  deleteRepair: (id: string) => void;\n  saveWarrantyClaim: (c: WarrantyClaim) => void;\n')
          a=s.index('  const saveRepair = useCallback((r: RepairJob) => {'); b=s.index('  const updateRepairStatus = useCallback',a)
          fn='''  const saveRepair = useCallback((r: RepairJob) => {
    if (!user) return;
    const repairs = state.repairs || [];
    const exists = repairs.some(x => x.id === r.id);
    const jobNo = (r.jobNo || '').trim();
    if (!r.customerName.trim() || !r.deviceType.trim() || !r.deviceModel.trim() || !r.fault.trim()) return;
    if (!Number.isFinite(r.laborCost) || r.laborCost < 0) return;
    if (r.advancePaid != null && (!Number.isFinite(r.advancePaid) || r.advancePaid < 0)) return;
    if (r.warrantyDays != null && (!Number.isFinite(r.warrantyDays) || r.warrantyDays < 0)) return;
    const cleanParts=(r.parts||[]).map(pt=>({...pt,name:pt.name.trim(),qty:Number(pt.qty),cost:Number(pt.cost),productId:pt.productId?.trim()||undefined}));
    if(cleanParts.some(pt=>!pt.name||!Number.isInteger(pt.qty)||pt.qty<=0||!Number.isFinite(pt.cost)||pt.cost<0)) return;
    if(jobNo&&repairs.some(x=>x.id!==r.id&&x.jobNo.trim().toLowerCase()===jobNo.toLowerCase())){pushAudit('DENIED','Repair',`Duplicate job number blocked: ${jobNo}`);return;}
    const old=repairs.find(x=>x.id===r.id), oldBy=new Map<string,number>(), nextBy=new Map<string,number>();
    for(const pt of old?.parts||[]) if(pt.productId) oldBy.set(pt.productId,(oldBy.get(pt.productId)||0)+pt.qty);
    for(const pt of cleanParts) if(pt.productId) nextBy.set(pt.productId,(nextBy.get(pt.productId)||0)+pt.qty);
    for(const id of new Set([...oldBy.keys(),...nextBy.keys()])){const delta=(nextBy.get(id)||0)-(oldBy.get(id)||0);const product=state.products.find(p=>p.id===id);if(!product||product.stock-delta<0){pushAudit('DENIED','Repair',`Insufficient stock for repair part: ${id}`);return;}}
    setState(st=>{let job:RepairJob={...r,jobNo:jobNo||r.jobNo,parts:cleanParts,by:r.by||user.name};let counters=st.counters;if(!exists&&(!job.jobNo||job.jobNo.startsWith('JOB-TEMP'))){const seq=(st.counters.job||0)+1;job={...job,jobNo:`JOB-${String(seq).padStart(4,'0')}`};counters={...st.counters,job:seq};}const products=st.products.map(p=>{const delta=(nextBy.get(p.id)||0)-(oldBy.get(p.id)||0);return delta?{...p,stock:p.stock-delta}:p;});return {...st,products,counters,repairs:exists?(st.repairs||[]).map(x=>x.id===r.id?job:x):[job,...(st.repairs||[])]};});
    pushAudit(exists?'UPDATE':'CREATE','Repair',`${exists?'Updated':'Opened'} ${jobNo||'job'} · ${r.deviceBrand} ${r.deviceModel}`);
  }, [state.repairs,state.products,pushAudit,user]);

'''
          s=s[:a]+fn+s[b:]
