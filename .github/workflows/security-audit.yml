name: POS Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-security:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for private credentials in source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.lock' \
            'SUPABASE_SERVICE_ROLE_KEY|SUPABASE_SERVICE_ROLE|service_role["'"'"' ]*[:=]|BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY|PRIVATE_KEY' \
            src electron public supabase package.json 2>/dev/null; then
            echo 'Potential private credential detected in tracked source.'
            exit 1
          fi

      - name: Check for common secret files
        shell: bash
        run: |
          set -euo pipefail
          forbidden=(.env .env.local .env.production service-account.json)
          for file in "${forbidden[@]}"; do
            if [ -f "$file" ]; then
              echo "Forbidden secret file is tracked: $file"
              exit 1
            fi
          done

      - name: Check production/demo credential boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const SEED_DEMO = import.meta.env.VITE_SEED_DEMO === 'true';" src/lib/seed.ts
          grep -q "if (!SEED_DEMO) return emptyState();" src/lib/seed.ts
          if grep -RInE --exclude-dir=.git --exclude='seed.ts' --exclude='store.tsx' 'admin@nexfixsolution\.com|cashier@nexfixsolution\.com|admin123|cashier123' src/pages src/components src/App.tsx electron 2>/dev/null; then
            echo 'Known demo credentials leaked outside the explicitly guarded seed/migration code.'
            exit 1
          fi
          if grep -RIn --exclude="security-audit.yml" "VITE_SEED_DEMO=true" .github/workflows package.json 2>/dev/null; then
            echo 'Production/release documentation or workflow must not enable VITE_SEED_DEMO.'
            exit 1
          fi
          if grep -n "isRoleSwitchSession\|nexfix_role_switch_v1" src/App.tsx; then
            echo 'Legacy role-switch bypass remains in App.tsx.'
            exit 1
          fi

      - name: Check cloud privilege boundaries
        shell: bash
        run: |
          set -euo pipefail
          snap='supabase/migrations/20260923180000_harden_cloud_snapshot_admin_only.sql'
          ret='supabase/migrations/20260923193000_harden_atomic_return_request_duplicates.sql'
          test -f "$snap"
          test -f "$ret"
          grep -q "shop_memberships" "$snap"
          grep -q "sm.role = 'admin'" "$snap"
          grep -q "pos_devices" "$snap"
          grep -q "d.user_id = uid" "$snap"
          grep -q "revoke all on function private.upsert_pos_snapshot_impl" "$snap"
          grep -q "A sale item can appear only once" "$ret"
          grep -RInE "revoke all on function private\.(complete_sale_atomic|process_sale_return_atomic|register_trade_in_atomic).*authenticated" supabase/migrations >/dev/null

      - name: Syntax-check Google Apps Script source
        shell: bash
        run: |
          set -euo pipefail
          node --check google-apps-script/Code.gs
          cmp -s google-apps-script/Code.gs docs/GoogleAppsScript_Code.gs

      - name: Check client backup proof boundary
        shell: bash
        run: |
          set -euo pipefail
          file='src/lib/driveSync.ts'
          grep -q 'const shopProof = await sha256Hex' "$file"
          grep -q "url.searchParams.set('shopProof', shopProof)" "$file"
          grep -q "url.searchParams.set('requestId', makeRequestId())" "$file"
          grep -q "format: 'encrypted-single'" "$file"
          grep -q "format: 'encrypted-part'" "$file"
          grep -q "format: 'encrypted-manifest'" "$file"

      - name: Check Supabase migrations exist
        shell: bash
        run: |
          set -euo pipefail
          test -d supabase/migrations
          test -n "$(find supabase/migrations -type f -name '*.sql' -print -quit)"

      - name: Check Google backup authentication and shop isolation
        shell: bash
        run: |
          set -euo pipefail
          file='google-apps-script/Code.gs'
          test -f "$file"
          grep -q "BACKUP_API_KEY_PROPERTY = 'NEXFIX_BACKUP_API_KEY'" "$file"
          grep -q 'function requireBackupApiKey' "$file"
          grep -q 'function validateShopProof' "$file"
          grep -q 'function authorizeShopAccess' "$file"
          grep -q 'SHOP_AUTH_FILENAME' "$file"
          grep -q 'function normalizeShopId' "$file"
          grep -q 'function shopPartitionKey' "$file"
          grep -q 'function getShopBackupFolder' "$file"
          grep -q 'function latestDriveBackup' "$file"
          grep -q 'backupStateToDrive(contents, shopId)' "$file"
          grep -q 'function latestBackup' "$file"
          grep -q "validateShopProof(contents.shopProof)" "$file"
          grep -q "validateRequestId(contents.requestId)" "$file"
          grep -q "validateRequestId(p.requestId)" "$file"
          grep -q "validateShopProof(p.shopProof)" "$file"
          grep -q "Encrypted backup uploads are required" "$file"
          grep -q "return json(unauthorized('Unauthorized'))" "$file"
          if grep -q 'SUPABASE_URL_PROPERTY\|SUPABASE_ANON_KEY_PROPERTY\|authenticateUser' "$file"; then
            echo 'Direct Google backup must not depend on Supabase authentication.'
            exit 1
          fi
          if grep -q "getSheetByName(BACKUP_SHEET)" "$file"; then
            echo 'Unscoped FullBackup sheet access is forbidden.'
            exit 1
          fi

      - name: Dependency security audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high --omit=dev

      - name: Check security workflow configuration
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/ci.yml
          test -f .github/workflows/security-audit.yml
          if grep -v 'grep -qE' .github/workflows/security-audit.yml | grep -qE 'npm (ci|install)|npm run (typecheck|lint|build)'; then
            echo 'Security audit must not duplicate the production build; CI is the single build gate.'
            exit 1
          fi
