name: Store expense validation patch

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch addExpense validation
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/store.tsx')
          text = p.read_text(encoding='utf-8')
          old = '''  const addExpense = useCallback((e: Omit<Expense, 'id' | 'date' | 'by'>) => {\n    setState(s => ({\n      ...s,\n      expenses: [{ ...e, id: uid(), date: new Date().toISOString(), by: user?.name || 'Unknown' }, ...s.expenses],\n    }));\n    pushAudit('EXPENSE', 'Expense', `${e.category}: ${e.note} · Rs. ${e.amount.toLocaleString()}`);\n  }, [pushAudit, user?.name]);'''
          new = '''  const addExpense = useCallback((e: Omit<Expense, 'id' | 'date' | 'by'>) => {\n    const amount = Number(e.amount);\n    const category = String(e.category || '').trim();\n    const note = String(e.note || '').trim();\n    if (!Number.isFinite(amount) || amount <= 0 || !category || !note) {\n      pushAudit('DENIED', 'Expense', 'Blocked invalid expense input');\n      return;\n    }\n    const normalizedAmount = Math.round(amount * 100) / 100;\n    setState(s => ({\n      ...s,\n      expenses: [{ ...e, amount: normalizedAmount, category, note, id: uid(), date: new Date().toISOString(), by: user?.name || 'Unknown' }, ...s.expenses],\n    }));\n    pushAudit('EXPENSE', 'Expense', `${category}: ${note} · Rs. ${normalizedAmount.toLocaleString()}`);\n  }, [pushAudit, user?.name]);'''
          if old not in text:
              raise SystemExit('Expected addExpense source block was not found; refusing to modify the file.')
          if 'Blocked invalid expense input' in text:
              print('Validation already present; no change needed.')
              raise SystemExit(0)
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

      - name: Commit and push patch
        shell: bash
        run: |
          if git diff --quiet -- src/lib/store.tsx; then
            echo 'No source change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/store.tsx
          git commit -m 'fix: validate expenses at store level'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
