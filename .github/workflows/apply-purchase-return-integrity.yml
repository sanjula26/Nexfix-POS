name: Apply tracked purchase return integrity fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: preserve tracked units on purchase returns') }}
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch purchase return logic
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/store.tsx')
          text = path.read_text(encoding='utf-8')
          start = "  const createPurchaseReturn = useCallback((input: { purchaseId: string; lines: Array<{ itemIdx: number; qty: number }>; reason: string }): PurchaseReturn | null => {"
          end = "\n\n  const deletePurchase = useCallback"
          a = text.find(start)
          b = text.find(end, a)
          if a < 0 or b < 0:
              raise SystemExit('Target createPurchaseReturn block not found; refusing to modify source')
          old = text[a:b]
          if "const trackedProduct" in old or "status: 'returned'" in old:
              raise SystemExit('Purchase return integrity fix appears to be already present; refusing duplicate patch')
          new = r'''  const createPurchaseReturn = useCallback((input: { purchaseId: string; lines: Array<{ itemIdx: number; qty: number }>; reason: string }): PurchaseReturn | null => {
    const purchase = state.purchases.find(x => x.id === input.purchaseId);
    if (!purchase || purchase.status !== 'received' || !user || !input.reason.trim()) return null;
    const existing = state.purchaseReturns || [];
    const returnedByItem = new Map<number, number>();
    for (const ret of existing.filter(x => x.purchaseId === purchase.id)) for (const item of ret.items) returnedByItem.set(item.itemIdx, (returnedByItem.get(item.itemIdx) || 0) + item.qty);
    const requested = new Map<number, number>();
    for (const line of input.lines) {
      if (!Number.isInteger(line.itemIdx) || line.itemIdx < 0 || line.itemIdx >= purchase.items.length) continue;
      if (!Number.isFinite(line.qty) || line.qty <= 0) continue;
      requested.set(line.itemIdx, (requested.get(line.itemIdx) || 0) + Math.floor(line.qty));
    }
    if (requested.size === 0) return null;

    const items: PurchaseReturnItem[] = [];
    const returnedUnitIds: string[] = [];
    for (const [itemIdx, qtyRequested] of requested) {
      const source = purchase.items[itemIdx];
      const already = returnedByItem.get(itemIdx) || 0;
      const remaining = Math.max(0, source.qty - already);
      const product = state.products.find(p => p.id === source.productId);
      const stock = product?.stock || 0;
      const trackedProduct = !!product && (product.trackImei || product.trackSerial);
      const availableTrackedUnits = trackedProduct
        ? (state.units || []).filter(u => u.productId === source.productId && u.purchaseId === purchase.id && u.status === 'in_stock')
        : [];
      const availableTrackedQty = trackedProduct ? availableTrackedUnits.length : Number.POSITIVE_INFINITY;
      const qty = Math.min(qtyRequested, remaining, stock, availableTrackedQty);
      if (qty <= 0) continue;
      if (trackedProduct) returnedUnitIds.push(...availableTrackedUnits.slice(0, qty).map(u => u.id));
      items.push({ itemIdx, productId: source.productId, name: source.name, qty, cost: source.cost, total: qty * source.cost });
    }
    if (!items.length) return null;

    const seq = (state.counters.dn || 0) + 1;
    const ret: PurchaseReturn = { id: uid(), dnNo: 'DN-' + String(seq).padStart(4, '0'), purchaseId: purchase.id, poNo: purchase.poNo, supplierId: purchase.supplierId, supplierName: purchase.supplierName, date: new Date().toISOString(), items, total: items.reduce((a, x) => a + x.total, 0), reason: input.reason.trim(), by: user.email };
    setStateWithInventoryLedger('PURCHASE_REVERSAL', prev => ({
      ...prev,
      products: prev.products.map(p => {
        const qty = items.filter(x => x.productId === p.id).reduce((a, x) => a + x.qty, 0);
        return qty ? { ...p, stock: Math.max(0, p.stock - qty) } : p;
      }),
      units: (prev.units || []).map(u => returnedUnitIds.includes(u.id)
        ? { ...u, status: 'returned' as const, saleId: undefined, saleBillNo: undefined, soldAt: undefined, warrantyExpiresAt: undefined, note: `Returned to supplier via ${ret.dnNo}` }
        : u),
      purchaseReturns: [ret, ...(prev.purchaseReturns || [])],
      counters: { ...prev.counters, dn: seq },
    }));
    pushAudit('PURCHASE_RETURN', 'Purchase', 'Debit Note ' + ret.dnNo + ' · ' + purchase.poNo + ' · ' + purchase.supplierName + ' · Rs.' + ret.total.toLocaleString());
    return ret;
  }, [state.purchases, state.purchaseReturns, state.products, state.units, state.counters.dn, user, pushAudit]);'''
          path.write_text(text[:a] + new + text[b:], encoding='utf-8')
          PY

      - name: Validate patch
        run: |
          git diff --check
          grep -q "const trackedProduct" src/lib/store.tsx
          grep -q "status: 'returned'" src/lib/store.tsx
          grep -q "purchaseId === purchase.id" src/lib/store.tsx
          npm install --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store.tsx
          git diff --cached --check
          git commit -m "fix: preserve tracked units on purchase returns"
          git push

# Trigger after workflow registration without changing application source.
