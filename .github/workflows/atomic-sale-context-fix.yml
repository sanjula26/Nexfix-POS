name: Atomic Sale Context Fix
on:
  push:
    paths:
      - '__atomic_sale_context_fix.trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add atomic sale provider context value
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/store.tsx'); t=p.read_text()
          old="""    saveCustomer, deleteCustomer, saveSupplier, deleteSupplier, saveSupplierPayment, deleteSupplierPayment,\n    completeSale, refundSale, holdSale, resumeHold, deleteHold,\n"""
          new="""    saveCustomer, deleteCustomer, saveSupplier, deleteSupplier, saveSupplierPayment, deleteSupplierPayment,\n    completeSale, completeSaleCloud, refundSale, holdSale, resumeHold, deleteHold,\n"""
          if old not in t: raise SystemExit('provider value anchor missing')
          p.write_text(t.replace(old,new,1))
          PY
          rm -f __atomic_sale_context_fix.trigger .github/workflows/atomic-sale-context-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/store.tsx __atomic_sale_context_fix.trigger .github/workflows/atomic-sale-context-fix.yml
          git commit -m 'fix: expose atomic sale action through POS context'
          git push
