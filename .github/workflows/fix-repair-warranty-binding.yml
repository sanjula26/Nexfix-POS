name: Repair Warranty Binding Fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-repair-warranty-binding.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix binding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/lib/store.tsx')
          s=p.read_text()
          marker='    saveRepair, updateRepairStatus, deleteRepair,'
          replacement='    saveRepair, updateRepairStatus, deleteRepair, saveWarrantyClaim,'
          if marker not in s:
              raise SystemExit('binding marker not found')
          if 'deleteRepair, saveWarrantyClaim,' not in s:
              s=s.replace(marker,replacement,1)
              p.write_text(s)
          PY
      - name: Verify
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run lint
          npm run build
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/fix-repair-warranty-binding.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/store.tsx .github/workflows/fix-repair-warranty-binding.yml
          git commit -m 'fix: bind warranty claim store action' 
          git push origin HEAD:main
