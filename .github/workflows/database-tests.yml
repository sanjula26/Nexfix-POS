name: Supabase Local Database Tests

on:
  push:
    branches: [main, 'test/**']
    paths:
      - 'supabase/**'
      - '.github/workflows/database-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/database-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-database:
    name: Rebuild local Supabase schema and run pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Prepare an isolated migration workspace
        run: |
          mkdir -p /tmp/nexfix-supabase-test
          cp -a supabase /tmp/nexfix-supabase-test/
          # The original production security migration (001) was applied after
          # an untracked schema.sql. The checked-in baseline captures that
          # schema at a later version, so reorder only this temporary copy.
          cp /tmp/nexfix-supabase-test/supabase/migrations/20260908180000_baseline_production_schema.sql /tmp/nexfix-supabase-test/supabase/migrations/00000000000001_baseline_production_schema.sql
          echo 'select 1;' > /tmp/nexfix-supabase-test/supabase/migrations/20260908180000_baseline_production_schema.sql
          cat > /tmp/nexfix-supabase-test/supabase/migrations/00000000000002_private_schema_bootstrap.sql <<'SQL'
          create schema if not exists private;
          SQL

          # Production history contains 20260912055657_enforce_cloud_sale_credit_limit,
          # but its SQL source is absent from the current repository. Reconstruct
          # the exact catalog-verified trigger function and trigger in this local
          # fixture so the later applied grant-restriction migration has its
          # expected prerequisite. This file exists only under /tmp.
          cat > /tmp/nexfix-supabase-test/supabase/migrations/20260912055657_enforce_cloud_sale_credit_limit.sql <<'SQL'
          create or replace function private.enforce_customer_credit_limit()
          returns trigger
          language plpgsql
          security definer
          set search_path to ''
          as $function$
          declare
            v_credit_limit numeric(12,2);
            v_credit_balance numeric(12,2);
            v_new_balance numeric(12,2);
          begin
            if new.customer_id is null then
              return new;
            end if;

            select c.credit_limit, c.credit_balance
              into v_credit_limit, v_credit_balance
            from public.customers c
            where c.id = new.customer_id
              and c.shop_id = new.shop_id
            for update;

            if not found then
              raise exception 'Customer not found for this shop';
            end if;

            v_new_balance := coalesce(v_credit_balance, 0)
              + greatest(0, coalesce(new.total, 0) - coalesce(new.amount_paid, 0));

            if coalesce(v_credit_limit, 0) > 0 and v_new_balance > v_credit_limit then
              raise exception 'Credit limit exceeded for customer';
            end if;

            return new;
          end;
          $function$;

          drop trigger if exists trg_enforce_customer_credit_limit on public.sales;
          create trigger trg_enforce_customer_credit_limit
          before insert on public.sales
          for each row execute function private.enforce_customer_credit_limit();
          SQL

          # Production has this event-trigger helper even though it is absent
          # from the checked-in baseline and staging migration history. Recreate
          # its verified definition in the temporary fixture so the following
          # permission migration can be replayed and new public tables receive
          # the same RLS-by-default protection as production.
          cat > /tmp/nexfix-supabase-test/supabase/migrations/00000000000000_rls_auto_enable_event_trigger.sql <<'SQL'
          create or replace function public.rls_auto_enable()
          returns event_trigger
          language plpgsql
          security definer
          set search_path to 'pg_catalog'
          as $function$
          declare
            cmd record;
          begin
            for cmd in
              select *
              from pg_event_trigger_ddl_commands()
              where command_tag in ('CREATE TABLE', 'CREATE TABLE AS', 'SELECT INTO')
                and object_type in ('table', 'partitioned table')
            loop
              if cmd.schema_name is not null
                and cmd.schema_name in ('public')
                and cmd.schema_name not in ('pg_catalog', 'information_schema')
                and cmd.schema_name not like 'pg_toast%'
                and cmd.schema_name not like 'pg_temp%' then
                begin
                  execute format('alter table if exists %s enable row level security', cmd.object_identity);
                  raise log 'rls_auto_enable: enabled RLS on %', cmd.object_identity;
                exception when others then
                  raise log 'rls_auto_enable: failed to enable RLS on %', cmd.object_identity;
                end;
              else
                raise log 'rls_auto_enable: skip % (either system schema or not in enforced list: %.)', cmd.object_identity, cmd.schema_name;
              end if;
            end loop;
          end;
          $function$;

          revoke all on function public.rls_auto_enable() from public, anon, authenticated;
          grant execute on function public.rls_auto_enable() to service_role;
          create event trigger ensure_rls on ddl_command_end execute function public.rls_auto_enable();
          SQL
          # The baseline is the starting schema for this isolated replay. Exclude
          # only files verified as absent from production's applied migration
          # history, including the retired UUID/owner_id chain and superseded
          # 20260913 alternate hardening variants. Repository SQL is untouched.
          python3 - <<'PY'
          from pathlib import Path

          root = Path('/tmp/nexfix-supabase-test/supabase/migrations')
          retired = [
              '002_offline_sync.sql',
              '20260816000100_pos_snapshot_security.sql',
              '202608160001_cloud_snapshot_sync.sql',
              '20260816000200_device_registry.sql',
              '20260816000300_enforce_registered_device.sql',
              '20260816000301_enforce_registered_device_sync.sql',
              '20260816000400_device_revocation.sql',
              '20260816000500_enforce_active_device.sql',
              '20260908100000_finalize_pos_cloud_sync_security.sql',
              # These alternate hardening migrations are present in Git but
              # their versions are absent from the production applied history.
              # Production uses 20260913143800 and 20260913143851 for the
              # purchase/customer and pending-RLS hardening steps instead.
              '20260913000100_harden_inventory_master_writes.sql',
              '20260913000200_harden_sales_child_writes.sql',
              '20260913000300_harden_profile_role_updates.sql',
              '20260913000400_harden_supplier_and_expense_writes.sql',
          ]
          for name in retired:
              path = root / name
              if not path.is_file():
                  raise SystemExit(f'Expected retired migration is missing: {name}')
              path.unlink()
              print(f'Excluded retired migration from temporary fixture: {name}')

          # The private implementation functions are defined by the canonical
          # RPC migration. Apply their authenticated grants only after that file.
          source = root / '20260816000000_fix_cloud_sync_private_rpc_permissions.sql'
          target = root / '20260816215101_fix_cloud_sync_private_rpc_permissions.sql'
          if not source.is_file() or target.exists():
              raise SystemExit('Unexpected private RPC grant migration fixture state')
          for required in (
              '20260816161816_create_pos_cloud_sync_schema.sql',
              '20260816161848_harden_cloud_sync_function_permissions.sql',
              '20260816215100_harden_cloud_sync_rpcs.sql',
          ):
              if not (root / required).is_file():
                  raise SystemExit(f'Canonical cloud-sync migration is missing: {required}')
          source.rename(target)
          print('Verified: private RPC grants follow canonical private function definitions.')

          # Several checked-in RLS migrations still contain legacy unqualified
          # calls to membership helpers after those helpers moved into private.
          # Production policies use private.*. Normalize every later migration
          # in this temporary test workspace only, leaving repository SQL and
          # hosted databases untouched.
          import re

          helper_migrations = sorted(
              p for p in root.glob('*.sql')
              if p.name > '20260911045059_move_shop_membership_helpers_to_private_schema.sql'
          )
          if not helper_migrations:
              raise SystemExit('No post-private-helper migrations found')
          replacements = {'is_shop_member': 0, 'is_shop_admin': 0}
          for migration in helper_migrations:
              sql = migration.read_text()
              for helper in replacements:
                  sql, count = re.subn(
                      rf'(?<![A-Za-z0-9_.]){helper}[(]',
                      f'private.{helper}(',
                      sql,
                  )
                  replacements[helper] += count
              migration.write_text(sql)
          if not all(count > 0 for count in replacements.values()):
              raise SystemExit(f'Expected both helper types to be normalized: {replacements}')
          for migration in helper_migrations:
              sql = migration.read_text()
              for helper in replacements:
                  if re.search(rf'(?<![A-Za-z0-9_.]){helper}[(]', sql):
                      raise SystemExit(f'Unqualified {helper} reference remains in {migration.name}')
          print(f'Verified private-schema helper normalization in temporary fixture: {replacements}')

          # The current repository baseline's private sale function uses spaces
          # around :=, while the historical credit-limit migration's string
          # replacement expects a minified declaration. Production's applied
          # function contains the credit-limit variable. Adapt only the temp
          # migration's declaration anchor to the checked-in baseline formatting.
          credit_migration = root / '20260920211000_enforce_customer_credit_limit.sql'
          if not credit_migration.is_file():
              raise SystemExit('Expected credit-limit migration is missing')
          credit_sql = credit_migration.read_text()
          compact_anchor = "'v_balance_due numeric(12,2):=0; v_points_earned integer:=0;'"
          spaced_anchor = "'v_balance_due numeric(12,2) := 0; v_points_earned integer := 0;'"
          compact_replacement = "'v_balance_due numeric(12,2):=0; v_credit_limit numeric(12,2):=0; v_points_earned integer:=0;'"
          spaced_replacement = "'v_balance_due numeric(12,2) := 0; v_credit_limit numeric(12,2) := 0; v_points_earned integer := 0;'"
          if credit_sql.count(compact_anchor) != 1 or credit_sql.count(compact_replacement) != 1:
              raise SystemExit('Unexpected credit-limit migration declaration anchors')
          credit_sql = credit_sql.replace(compact_anchor, spaced_anchor).replace(compact_replacement, spaced_replacement)
          credit_migration.write_text(credit_sql)
          print('Verified: temporary credit-limit migration matches baseline declaration formatting.')
          PY

      - name: Start isolated local Supabase database
        working-directory: /tmp/nexfix-supabase-test
        run: |
          supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Reapply all migrations to a clean local database
        working-directory: /tmp/nexfix-supabase-test
        run: supabase db reset --local --no-seed

      - name: Run pgTAP database tests against local database
        working-directory: /tmp/nexfix-supabase-test
        run: supabase test db --local

      - name: Stop local Supabase containers
        if: always()
        working-directory: /tmp/nexfix-supabase-test
        run: supabase stop --no-backup || true
