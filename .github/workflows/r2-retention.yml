name: Private R2 Installer Retention

on:
  workflow_dispatch:
    inputs:
      confirm_retention_cleanup:
        description: 'Confirm deleting private R2 installer versions older than the three newest'
        required: true
        type: boolean
        default: false

concurrency:
  group: private-r2-retention-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retain:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Validate explicit retention cleanup approval
        shell: pwsh
        env:
          RETENTION_REF: ${{ github.ref }}
          RETENTION_CONFIRMED: ${{ inputs.confirm_retention_cleanup }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RETENTION_REF -ne 'refs/heads/main') {
            throw "Private R2 retention may only run from main. Selected ref: $env:RETENTION_REF"
          }
          if ($env:RETENTION_CONFIRMED -ne 'true') {
            throw 'R2 retention cleanup was not explicitly confirmed. No private objects were changed.'
          }
          Write-Host 'Main branch and explicit private R2 retention approval verified.'

      - name: Retain active release and two newest private installers
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: nexfix-desktop-updates
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE/scripts/retain-private-r2-installers.ps1"
