name: Private Release Storage Retention

on:
  workflow_dispatch:
    inputs:
      confirm_retention_cleanup:
        description: 'Confirm retaining only the active and newest complete previous private release in both Supabase Storage and Cloudflare R2'
        required: true
        type: boolean
        default: false

concurrency:
  group: nexfix-private-release-storage-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retain:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Validate explicit retention cleanup approval
        shell: pwsh
        env:
          RETENTION_REF: ${{ github.ref }}
          RETENTION_CONFIRMED: ${{ inputs.confirm_retention_cleanup }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RETENTION_REF -ne 'refs/heads/main') {
            throw "Private release storage retention may only run from main. Selected ref: $env:RETENTION_REF"
          }
          if ($env:RETENTION_CONFIRMED -ne 'true') {
            throw 'Private release storage retention was not explicitly confirmed. No private objects were changed.'
          }
          Write-Host 'Main branch and explicit private release storage retention approval verified.'

      - name: Checkout repository scripts
        uses: actions/checkout@v7

      # Install the R2 CLI before any private storage credentials are added to
      # a step environment. This mirrors the production release tool boundary.
      - name: Prepare AWS CLI before exposing R2 credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Get-Command aws -ErrorAction SilentlyContinue)) {
            if (-not (Get-Command choco -ErrorAction SilentlyContinue)) {
              throw 'AWS CLI is missing and Chocolatey is unavailable on this runner.'
            }
            choco install awscli -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'AWS CLI installation failed before retention credentials were exposed.' }
            $awsExe = 'C:\Program Files\Amazon\AWSCLIV2\aws.exe'
            if (Test-Path $awsExe) {
              $awsDirectory = Split-Path $awsExe -Parent
              $env:PATH = "$awsDirectory;$env:PATH"
              Add-Content -Path $env:GITHUB_PATH -Value $awsDirectory
            }
          }
          aws --version
          if ($LASTEXITCODE -ne 0) { throw 'AWS CLI is not available for private R2 retention.' }

      - name: Retain active and previous private release in both storage providers
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: nexfix-desktop-updates
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:GITHUB_WORKSPACE/scripts/retain-private-supabase-chunks.ps1" -Apply
          & "$env:GITHUB_WORKSPACE/scripts/retain-private-r2-installers.ps1" -Apply
