name: Private R2 Installer Retention

on:
  workflow_dispatch:
    inputs:
      confirm_retention_cleanup:
        description: 'Confirm deleting private R2 installer versions older than the three newest'
        required: true
        type: boolean
        default: false

concurrency:
  group: private-r2-retention-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retain:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Validate explicit retention cleanup approval
        shell: pwsh
        env:
          RETENTION_REF: ${{ github.ref }}
          RETENTION_CONFIRMED: ${{ inputs.confirm_retention_cleanup }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RETENTION_REF -ne 'refs/heads/main') {
            throw "Private R2 retention may only run from main. Selected ref: $env:RETENTION_REF"
          }
          if ($env:RETENTION_CONFIRMED -ne 'true') {
            throw 'R2 retention cleanup was not explicitly confirmed. No private objects were changed.'
          }
          Write-Host 'Main branch and explicit private R2 retention approval verified.'

      - name: Retain the three newest private installers
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: nexfix-desktop-updates
        run: |
          $ErrorActionPreference = 'Stop'
          $r2Endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          $env:AWS_ACCESS_KEY_ID = $env:R2_ACCESS_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:R2_SECRET_ACCESS_KEY
          $env:AWS_DEFAULT_REGION = 'auto'

          $json = aws s3api list-objects-v2 --bucket $env:R2_BUCKET --prefix 'win32/latest/Nexfix-POS-' --endpoint-url $r2Endpoint --region auto --query 'Contents[].Key' --output json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list private R2 installer objects.' }
          $keys = @(ConvertFrom-Json -InputObject ($json -join "`n"))
          if ($keys.Count -lt 1) { throw 'No private R2 installer objects were found; nothing was deleted.' }

          $versioned = @(
            $keys | ForEach-Object {
              $key = [string]$_
              if ($key -match '^win32/latest/Nexfix-POS-(?<version>\d+\.\d+\.\d+)-x64-installer\.exe$') {
                [pscustomobject]@{ Key = $key; Version = [version]$Matches['version'] }
              } else {
                throw "Unexpected object key under the private installer prefix: $key"
              }
            } | Sort-Object Version -Descending
          )
          $retained = @($versioned | Select-Object -First 3)
          $retainedKeys = @($retained | ForEach-Object { [string]$_.Key } | Sort-Object)
          $removeKeys = @($versioned | Select-Object -Skip 3 | ForEach-Object { [string]$_.Key })

          Write-Host "Installer objects found: $($versioned.Count)"
          Write-Host "Keeping newest installers: $($retainedKeys -join ', ')"
          Write-Host "Superseded installers to remove: $($removeKeys.Count)"

          foreach ($key in $removeKeys) {
            aws s3api delete-object --bucket $env:R2_BUCKET --key $key --endpoint-url $r2Endpoint --region auto --output text | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to remove superseded R2 installer: $key" }
          }

          $verifyJson = aws s3api list-objects-v2 --bucket $env:R2_BUCKET --prefix 'win32/latest/Nexfix-POS-' --endpoint-url $r2Endpoint --region auto --query 'Contents[].Key' --output json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify private R2 installer retention.' }
          $remaining = @(ConvertFrom-Json -InputObject ($verifyJson -join "`n") | ForEach-Object { [string]$_ } | Sort-Object)
          $differences = @(Compare-Object -ReferenceObject $retainedKeys -DifferenceObject $remaining -CaseSensitive)
          if ($differences.Count -gt 0) {
            throw "R2 retention verification failed. Expected: $($retainedKeys -join ', '); found: $($remaining -join ', ')"
          }
          Write-Host "R2 retention verified: $($remaining.Count) newest installer(s) remain."
