name: Private R2 Installer Retention

on:
  workflow_dispatch:
    inputs:
      confirm_retention_cleanup:
        description: 'Confirm deleting private R2 installer versions older than the three newest'
        required: true
        type: boolean
        default: false

concurrency:
  group: private-r2-retention-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  retain:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Validate explicit retention cleanup approval
        shell: pwsh
        env:
          RETENTION_REF: ${{ github.ref }}
          RETENTION_CONFIRMED: ${{ inputs.confirm_retention_cleanup }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RETENTION_REF -ne 'refs/heads/main') {
            throw "Private R2 retention may only run from main. Selected ref: $env:RETENTION_REF"
          }
          if ($env:RETENTION_CONFIRMED -ne 'true') {
            throw 'R2 retention cleanup was not explicitly confirmed. No private objects were changed.'
          }
          Write-Host 'Main branch and explicit private R2 retention approval verified.'

      - name: Retain the active installer and two newest private installers
        shell: pwsh
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: nexfix-desktop-updates
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $r2Endpoint = "https://$env:R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          if ([string]::IsNullOrWhiteSpace($env:SUPABASE_SERVICE_ROLE_KEY)) { throw 'SUPABASE_SERVICE_ROLE_KEY is required to protect the active installer during R2 retention.' }
          $projectUrl = 'https://ocmzgamnehwbkuwkjdrr.supabase.co'
          $headers = @{ apikey = $env:SUPABASE_SERVICE_ROLE_KEY; Authorization = "Bearer $($env:SUPABASE_SERVICE_ROLE_KEY)" }
          $activeRows = @(Invoke-RestMethod -Uri "$projectUrl/rest/v1/desktop_releases?platform=eq.win32&channel=eq.latest&is_active=eq.true&select=version,installer_path,installer_size" -Headers $headers)
          if ($activeRows.Count -ne 1) { throw "Expected exactly one active private Windows release; found $($activeRows.Count). No R2 objects were deleted." }
          $activeKey = [string]$activeRows[0].installer_path
          if ($activeKey -notmatch '^win32/latest/Nexfix-POS-\d+\.\d+\.\d+-x64-installer\.exe$') { throw "Active release path is invalid: $activeKey. No R2 objects were deleted." }

          $env:AWS_ACCESS_KEY_ID = $env:R2_ACCESS_KEY_ID
          $env:AWS_SECRET_ACCESS_KEY = $env:R2_SECRET_ACCESS_KEY
          $env:AWS_DEFAULT_REGION = 'auto'
          $json = aws s3api list-objects-v2 --bucket $env:R2_BUCKET --prefix 'win32/latest/Nexfix-POS-' --endpoint-url $r2Endpoint --region auto --query 'Contents[].Key' --output json
          if ($LASTEXITCODE -ne 0) { throw 'Could not list private R2 installer objects.' }
          $keys = @(ConvertFrom-Json -InputObject ($json -join "`n"))
          $versioned = @(
            $keys | ForEach-Object {
              $key = [string]$_
              if ($key -match '^win32/latest/Nexfix-POS-(?<version>\d+\.\d+\.\d+)-x64-installer\.exe$') {
                [pscustomobject]@{ Key = $key; Version = [version]$Matches['version'] }
              } else {
                throw "Unexpected object key under the private installer prefix: $key"
              }
            } | Sort-Object Version -Descending
          )
          if ($versioned.Count -lt 1) { throw 'No private R2 installer objects were found. No objects were deleted.' }
          $activeEntry = @($versioned | Where-Object { $_.Key -eq $activeKey })
          if ($activeEntry.Count -ne 1) { throw "Active installer is missing from R2: $activeKey. No objects were deleted." }
          $activeHeadJson = aws s3api head-object --bucket $env:R2_BUCKET --key $activeKey --endpoint-url $r2Endpoint --region auto --output json
          if ($LASTEXITCODE -ne 0) { throw "Active installer could not be verified in R2: $activeKey. No objects were deleted." }
          $activeHead = ConvertFrom-Json -InputObject ($activeHeadJson -join "`n")
          if ([int64]$activeHead.ContentLength -ne [int64]$activeRows[0].installer_size) { throw 'Active R2 installer size does not match the Supabase release record. No objects were deleted.' }

          # Preserve the active release first; fill the other two slots with
          # the newest versions regardless of the active version's age.
          $newestOther = @($versioned | Where-Object { $_.Key -ne $activeKey } | Select-Object -First 2)
          $retained = @($activeEntry) + @($newestOther)
          $retainedKeys = @($retained | ForEach-Object { [string]$_.Key } | Sort-Object)
          $removeKeys = @($versioned | Where-Object { $retainedKeys -notcontains $_.Key } | ForEach-Object { [string]$_.Key })
          if ($retainedKeys -notcontains $activeKey) { throw 'Active installer is not protected by retention. No objects were deleted.' }

          Write-Host "Active release protected: $($activeRows[0].version) / $activeKey"
          Write-Host "Installer objects found: $($versioned.Count)"
          Write-Host "Retained active + newest installers: $($retainedKeys -join ', ')"
          Write-Host "Superseded installers to remove: $($removeKeys.Count)"
          foreach ($key in $removeKeys) {
            aws s3api delete-object --bucket $env:R2_BUCKET --key $key --endpoint-url $r2Endpoint --region auto --output text | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "Failed to remove superseded R2 installer: $key" }
          }

          $verifyJson = aws s3api list-objects-v2 --bucket $env:R2_BUCKET --prefix 'win32/latest/Nexfix-POS-' --endpoint-url $r2Endpoint --region auto --query 'Contents[].Key' --output json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify private R2 installer retention.' }
          $remaining = @(ConvertFrom-Json -InputObject ($verifyJson -join "`n") | ForEach-Object { [string]$_ } | Sort-Object)
          $differences = @(Compare-Object -ReferenceObject $retainedKeys -DifferenceObject $remaining -CaseSensitive)
          if ($differences.Count -gt 0) { throw "R2 retention verification failed. Expected: $($retainedKeys -join ', '); found: $($remaining -join ', ')" }
          $finalHeadJson = aws s3api head-object --bucket $env:R2_BUCKET --key $activeKey --endpoint-url $r2Endpoint --region auto --output json
          if ($LASTEXITCODE -ne 0) { throw 'Active installer disappeared during retention cleanup.' }
          $finalHead = ConvertFrom-Json -InputObject ($finalHeadJson -join "`n")
          if ([int64]$finalHead.ContentLength -ne [int64]$activeRows[0].installer_size) { throw 'Active installer size changed during retention cleanup.' }
          Write-Host "R2 retention verified: active release $($activeRows[0].version) remains."
