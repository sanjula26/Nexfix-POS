name: Atomic Sale Integration Patch

on:
  push:
    paths:
      - '__atomic_sale_patch.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply atomic sale integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          store = Path('src/lib/store.tsx')
          text = store.read_text()

          old = "import { appendInventoryTransaction, type InventoryTransaction } from './inventoryLedger';\n"
          new = old + "import { completeSaleAtomic, ensureCloudShop, syncNormalizedCatalog } from './cloudSync';\n"
          if old not in text:
              raise SystemExit('store import anchor not found')
          text = text.replace(old, new, 1)

          old = "  /** staff member credited with the sale (defaults to current user) */\n  salesmanId?: string;\n}"
          new = "  /** staff member credited with the sale (defaults to current user) */\n  salesmanId?: string;\n  /** internal cloud-authoritative mirror values; not supplied by the UI */\n  _saleId?: string;\n  _billNo?: string;\n}"
          if old not in text:
              raise SystemExit('NewSaleInput anchor not found')
          text = text.replace(old, new, 1)

          old = "  // sales\n  completeSale: (input: NewSaleInput) => Sale | null;\n  refundSale: (saleId: string) => void;"
          new = "  // sales\n  completeSale: (input: NewSaleInput) => Sale | null;\n  completeSaleCloud: (input: NewSaleInput) => Promise<Sale | null>;\n  refundSale: (saleId: string) => void;"
          if old not in text:
              raise SystemExit('StoreCtx sales anchor not found')
          text = text.replace(old, new, 1)

          old = "    const billNo = `NFX-${dkey(new Date()).replaceAll('-', '')}-${String(seq).slice(-4)}`;"
          new = "    const billNo = input._billNo || `NFX-${dkey(new Date()).replaceAll('-', '')}-${String(seq).slice(-4)}`;"
          if old not in text:
              raise SystemExit('billNo anchor not found')
          text = text.replace(old, new, 1)

          old = "      id: uid(), billNo, date: new Date().toISOString(),"
          new = "      id: input._saleId || uid(), billNo, date: new Date().toISOString(),"
          if old not in text:
              raise SystemExit('sale id anchor not found')
          text = text.replace(old, new, 1)

          marker = "  const refundSale = useCallback((saleId: string) => {"
          if marker not in text:
              raise SystemExit('refund marker not found')

          method = r'''  const completeSaleCloud = useCallback(async (input: NewSaleInput): Promise<Sale | null> => {
    if (!user || input.lines.length === 0) return null;

    const shop = await ensureCloudShop('Nexfix Shop');
    if (!shop.ok || !shop.shopId) return null;

    // Admin/manager can bootstrap the normalized catalog immediately before the
    // first atomic sale. Cashiers must use a catalog that was already bootstrapped
    // by an authorized operator; they never receive catalog write privileges here.
    if (user.role === 'admin' || user.role === 'manager') {
      const catalog = await syncNormalizedCatalog(state, shop.shopId);
      if (!catalog.ok) return null;
    }

    const saleId = uid();
    const payments = (input.payments && input.payments.length)
      ? input.payments.filter(p => p.amount > 0).map(p => ({ method: p.method, amount: p.amount }))
      : [{ method: input.payment, amount: input.amountPaid }];

    const cloud = await completeSaleAtomic({
      shopId: shop.shopId,
      saleId,
      customerId: input.customerId,
      shipping: input.shipping,
      discount: input.discount,
      taxPct: input.taxPct,
      pointsRedeemed: input.pointsRedeemed,
      note: input.note,
      salesmanId: input.salesmanId || user.id,
      lines: input.lines.map(l => ({
        product_id: l.productId,
        qty: l.qty,
        discount: l.discount,
        price: l.price,
        unit_ids: l.unitIds,
      })),
      payments,
    });
    if (!cloud.ok || !cloud.saleId || !cloud.billNo) return null;
    if (cloud.saleId !== saleId) return null;

    // The cloud transaction is authoritative. The local record is a mirror using
    // the exact same id and server-assigned bill number, preventing duplicate
    // sales across retries/devices.
    const localSale = completeSale({ ...input, _saleId: saleId, _billNo: cloud.billNo });
    if (!localSale) return null;
    if (cloud.total !== undefined && Math.abs(localSale.total - cloud.total) > 0.01) return null;
    return localSale;
  }, [user, state, completeSale]);

'''
          text = text.replace(marker, method + marker, 1)
          store.write_text(text)

          pos = Path('src/pages/POS.tsx')
          p = pos.read_text()
          old = "  const { state, user, can, completeSale, holdSale, resumeHold, deleteHold, saveCustomer, adminPrompt, verifyAdminPin, findUnitByCode } = usePOS();"
          new = "  const { state, user, can, completeSaleCloud, holdSale, resumeHold, deleteHold, saveCustomer, adminPrompt, verifyAdminPin, findUnitByCode } = usePOS();"
          if old not in p:
              raise SystemExit('POS destructure anchor not found')
          p = p.replace(old, new, 1)

          old = "  const [doneSale, setDoneSale] = useState<Sale | null>(null);\n  const [drawerOpen, setDrawerOpen] = useState(false);"
          new = "  const [doneSale, setDoneSale] = useState<Sale | null>(null);\n  const [finishing, setFinishing] = useState(false);\n  const [drawerOpen, setDrawerOpen] = useState(false);"
          if old not in p:
              raise SystemExit('POS state anchor not found')
          p = p.replace(old, new, 1)

          old = "  const finish = () => {\n    setError('');"
          new = "  const finish = async () => {\n    if (finishing) return;\n    setFinishing(true);\n    setError('');"
          if old not in p:
              raise SystemExit('finish signature anchor not found')
          p = p.replace(old, new, 1)

          old = "    if (lines.length === 0) return setError('Add at least one item to the cart');"
          new = "    if (lines.length === 0) { setFinishing(false); return setError('Add at least one item to the cart'); }"
          if old not in p:
              raise SystemExit('finish first validation anchor not found')
          p = p.replace(old, new, 1)

          # All early validation returns in finish need to release the busy guard.
          for msg in [
              "if ((discCart > 0 || lineDisc > 0) && !can('act:discount')) return setError('Your role cannot apply discounts');",
              "if (hasCredit && !customerId) return setError('Credit sales need a registered customer');",
              "if (hasCredit && !can('act:creditSale')) return setError('Your role cannot make credit sales');",
              "if (legs.some(l => l.amount <= 0)) return setError('Enter an amount for every split payment');",
              "if (legSum < total) return setError(`Split payments are short by ${fmtRs(total - legSum)}`);",
              "} else if (!hasCredit && paidNum < total) {\n      return setError(`Still ${fmtRs(total - paidNum)} short of the total`);\n    }",
          ]:
              if msg not in p:
                  raise SystemExit('validation anchor not found: ' + msg[:70])
          p = p.replace("if ((discCart > 0 || lineDisc > 0) && !can('act:discount')) return setError('Your role cannot apply discounts');", "if ((discCart > 0 || lineDisc > 0) && !can('act:discount')) { setFinishing(false); return setError('Your role cannot apply discounts'); }", 1)
          p = p.replace("if (hasCredit && !customerId) return setError('Credit sales need a registered customer');", "if (hasCredit && !customerId) { setFinishing(false); return setError('Credit sales need a registered customer'); }", 1)
          p = p.replace("if (hasCredit && !can('act:creditSale')) return setError('Your role cannot make credit sales');", "if (hasCredit && !can('act:creditSale')) { setFinishing(false); return setError('Your role cannot make credit sales'); }", 1)
          p = p.replace("if (legs.some(l => l.amount <= 0)) return setError('Enter an amount for every split payment');", "if (legs.some(l => l.amount <= 0)) { setFinishing(false); return setError('Enter an amount for every split payment'); }", 1)
          p = p.replace("if (legSum < total) return setError(`Split payments are short by ${fmtRs(total - legSum)}`);", "if (legSum < total) { setFinishing(false); return setError(`Split payments are short by ${fmtRs(total - legSum)}`); }", 1)
          p = p.replace("} else if (!hasCredit && paidNum < total) {\n      return setError(`Still ${fmtRs(total - paidNum)} short of the total`);\n    }", "} else if (!hasCredit && paidNum < total) {\n      setFinishing(false);\n      return setError(`Still ${fmtRs(total - paidNum)} short of the total`);\n    }", 1)

          old = "          return setError(`Select IMEI/Serial for ${p.name} (${l.qty} unit${l.qty > 1 ? 's' : ''})`);"
          new = "          setFinishing(false);\n          return setError(`Select IMEI/Serial for ${p.name} (${l.qty} unit${l.qty > 1 ? 's' : ''})`);"
          if old not in p:
              raise SystemExit('tracked validation anchor not found')
          p = p.replace(old, new, 1)

          old = "    const sale = completeSale({"
          new = "    try {\n      const sale = await completeSaleCloud({"
          if old not in p:
              raise SystemExit('sale call anchor not found')
          p = p.replace(old, new, 1)

          old = "      salesmanId: salesmanId || undefined,\n    });\n    if (sale) {"
          new = "      salesmanId: salesmanId || undefined,\n      });\n      if (sale) {"
          if old not in p:
              raise SystemExit('sale call closing anchor not found')
          p = p.replace(old, new, 1)

          old = "      setTimeout(focusSearch, 150);\n    }\n  };"
          new = "        setTimeout(focusSearch, 150);\n      } else {\n        setError('Cloud sale was not committed. No local sale was created. Check your connection/catalog and try again.');\n      }\n    } catch (e) {\n      setError(e instanceof Error ? e.message : 'Sale failed. No local sale was created.');\n    } finally {\n      setFinishing(false);\n    }\n  };"
          if old not in p:
              raise SystemExit('finish closing anchor not found')
          p = p.replace(old, new, 1)

          # Disable the final-sale button while the cloud transaction is in flight.
          p = p.replace("disabled={lines.length === 0}", "disabled={lines.length === 0 || finishing}", 1)
          p = p.replace("<CheckCircle2", "{finishing ? <Loader2 className=\"animate-spin\" : <CheckCircle2", 1)
          # Balance the JSX icon expression at the first matching closing marker.
          p = p.replace("className=\"w-5 h-5\" />\n            Finish", "className=\"w-5 h-5\" />}\n            Finish", 1)
          pos.write_text(p)
          PY

          rm -f __atomic_sale_patch.trigger .github/workflows/atomic-sale-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/store.tsx src/pages/POS.tsx __atomic_sale_patch.trigger .github/workflows/atomic-sale-patch.yml
          git commit -m 'feat: integrate atomic cloud sales into POS flow'
          git push
