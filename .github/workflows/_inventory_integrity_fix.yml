name: Temporary inventory integrity fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch purchase return unit state
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          path = Path('src/lib/store.tsx')
          text = path.read_text()
          start = text.index('  const createPurchaseReturn = useCallback(')
          end_marker = "  }, [state.purchases, state.purchaseReturns, state.products, state.counters.dn, user, pushAudit]);"
          end = text.index(end_marker, start) + len(end_marker)
          replacement = r'''  const createPurchaseReturn = useCallback((input: { purchaseId: string; lines: Array<{ itemIdx: number; qty: number }>; reason: string }): PurchaseReturn | null => {
    const purchase = state.purchases.find(x => x.id === input.purchaseId);
    if (!purchase || purchase.status !== 'received' || !user || !input.reason.trim()) return null;
    const existing = state.purchaseReturns || [];
    const returnedByItem = new Map<number, number>();
    for (const ret of existing.filter(x => x.purchaseId === purchase.id)) {
      for (const item of ret.items) returnedByItem.set(item.itemIdx, (returnedByItem.get(item.itemIdx) || 0) + item.qty);
    }
    const requested = new Map<number, number>();
    for (const line of input.lines) {
      if (!Number.isInteger(line.itemIdx) || line.itemIdx < 0 || line.itemIdx >= purchase.items.length) continue;
      if (!Number.isFinite(line.qty) || line.qty <= 0) continue;
      requested.set(line.itemIdx, (requested.get(line.itemIdx) || 0) + Math.floor(line.qty));
    }
    if (requested.size === 0) return null;

    const items: PurchaseReturnItem[] = [];
    const returnUnitIds: string[] = [];
    for (const [itemIdx, qtyRequested] of requested) {
      const source = purchase.items[itemIdx];
      const product = state.products.find(p => p.id === source.productId);
      if (!product) continue;
      const already = returnedByItem.get(itemIdx) || 0;
      const remaining = Math.max(0, source.qty - already);
      const stock = Math.max(0, product.stock);
      const tracked = product.trackImei || product.trackSerial;
      const availableUnits = tracked
        ? (state.units || []).filter(u => u.purchaseId === purchase.id && u.productId === source.productId && u.status === 'in_stock')
        : [];
      const qty = Math.min(qtyRequested, remaining, stock, tracked ? availableUnits.length : Number.POSITIVE_INFINITY);
      if (qty <= 0) continue;
      if (tracked) returnUnitIds.push(...availableUnits.slice(0, qty).map(u => u.id));
      items.push({ itemIdx, productId: source.productId, name: source.name, qty, cost: source.cost, total: qty * source.cost });
    }
    if (!items.length) return null;

    const seq = (state.counters.dn || 0) + 1;
    const ret: PurchaseReturn = {
      id: uid(), dnNo: 'DN-' + String(seq).padStart(4, '0'), purchaseId: purchase.id, poNo: purchase.poNo,
      supplierId: purchase.supplierId, supplierName: purchase.supplierName, date: new Date().toISOString(),
      items, total: items.reduce((a, x) => a + x.total, 0), reason: input.reason.trim(), by: user.email,
    };
    setStateWithInventoryLedger('PURCHASE_REVERSAL', prev => ({
      ...prev,
      products: prev.products.map(p => {
        const qty = items.filter(x => x.productId === p.id).reduce((a, x) => a + x.qty, 0);
        return qty ? { ...p, stock: Math.max(0, p.stock - qty) } : p;
      }),
      units: (prev.units || []).map(u => returnUnitIds.includes(u.id)
        ? { ...u, status: 'returned' as const, saleId: undefined, saleBillNo: undefined, soldAt: undefined, note: `Returned to supplier via ${ret.dnNo}` }
        : u),
      purchaseReturns: [ret, ...(prev.purchaseReturns || [])],
      counters: { ...prev.counters, dn: seq },
    }));
    pushAudit('PURCHASE_RETURN', 'Purchase', 'Debit Note ' + ret.dnNo + ' · ' + purchase.poNo + ' · ' + purchase.supplierName + ' · Rs.' + ret.total.toLocaleString());
    return ret;
  }, [state.purchases, state.purchaseReturns, state.products, state.units, state.counters.dn, user, pushAudit]);'''
          path.write_text(text[:start] + replacement + text[end:])
          PY
          npm install --no-audit --no-fund
          npm run typecheck
      - name: Commit verified fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/_inventory_integrity_fix.yml
          git add src/lib/store.tsx .github/workflows/_inventory_integrity_fix.yml
          git diff --cached --check
          git commit -m 'fix: reconcile tracked units on purchase returns'
          git push origin main
