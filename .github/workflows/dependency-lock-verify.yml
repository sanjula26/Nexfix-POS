name: Verify build-tool dependency classification

on:
  push:
    branches:
      - fix/build-tools-dev-deps-20261118

permissions:
  contents: write

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-slim
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Record toolchain
        run: |
          node --version
          npm --version
      - name: Regenerate lockfile with npm
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Apply semver-compatible audit fixes without force
        id: audit-fix
        continue-on-error: true
        run: timeout 240s npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Verify clean install
        run: npm ci --no-audit --no-fund
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Full domain and boundary tests
        run: |
          npm run verify:boundaries
          npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint -- --ignore-pattern 'apps/owner-web/**'
      - name: Production build
        run: npm run build
      - name: Development dependency audit report
        id: development-audit
        continue-on-error: true
        run: timeout 120s npm audit --audit-level=high --json > npm-audit-all.json
      - name: Capture picomatch dependency tree
        if: always()
        continue-on-error: true
        run: npm ls picomatch --all --json > npm-picomatch-tree.json
      - name: Publish audit outcome
        if: always()
        env:
          DEVELOPMENT_AUDIT_OUTCOME: ${{ steps.development-audit.outcome }}
          AUDIT_FIX_OUTCOME: ${{ steps.audit-fix.outcome }}
        run: |
          echo "Semver-only audit fix outcome: $AUDIT_FIX_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Development dependency audit outcome: $DEVELOPMENT_AUDIT_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
      - name: Commit generated lockfile to the isolated feature branch
        if: github.ref == 'refs/heads/fix/build-tools-dev-deps-20261118'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "build: regenerate lockfile after moving Tailwind tooling to dev"
            git fetch origin refs/heads/fix/build-tools-dev-deps-20261118:refs/remotes/origin/fix/build-tools-dev-deps-20261118
            git rebase refs/remotes/origin/fix/build-tools-dev-deps-20261118
            AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c "http.extraheader=AUTHORIZATION: basic $AUTH_HEADER" push origin HEAD:refs/heads/fix/build-tools-dev-deps-20261118
          else
            echo "npm regenerated an identical package-lock.json; no commit needed."
          fi
      - name: Upload generated lockfile and development audit report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: build-tool-dependency-verification
          path: |
            package-lock.json
            npm-audit-all.json
            npm-picomatch-tree.json
          if-no-files-found: warn
