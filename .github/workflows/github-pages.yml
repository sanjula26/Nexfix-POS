name: Deploy Nexfix POS Phone Sales

on:
  push:
    branches: ['main']
    paths:
      - 'apps/phone-sales/**'
      - 'apps/owner-web/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: public-phone-sales
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout private source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build public Phone Sales app
        env:
          VITE_GOOGLE_BACKUP_API_KEY: ${{ secrets.VITE_GOOGLE_BACKUP_API_KEY }}
          VITE_PUBLIC_APP_URL: https://sanjula26.github.io/Nexfix-POS-Public/
        run: |
          if [ -z "${VITE_GOOGLE_BACKUP_API_KEY}" ]; then
            echo "VITE_GOOGLE_BACKUP_API_KEY secret is empty."
            exit 1
          fi
          VITE_APP_VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("package.json","utf8")).version')
          export VITE_APP_VERSION
          npm run build -- --mode public-pages

      - name: Typecheck Owner Web
        working-directory: apps/owner-web
        run: npm run typecheck
      - name: Lint Owner Web
        working-directory: apps/owner-web
        run: npm run lint
      - name: Build read-only Owner Web
        working-directory: apps/owner-web
        env:
          VITE_SUPABASE_URL: https://ocmzgamnehwbkuwkjdrr.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_9DYtQ1kfcKClSb47Ghh-cQ_FRDz2tK-
          VITE_OWNER_WEB_TIME_ZONE: Asia/Colombo
        run: |
          npm run build -- --base=/Nexfix-POS-Public/owner/
          mkdir -p ../../dist/owner
          cp -a dist/. ../../dist/owner/

      - name: Verify public build is static and does not contain source maps
        run: |
          test -f dist/index.html
          if find dist -type f -name '*.map' | grep -q .; then
            echo "Source maps must not be published to the public Phone Sales repository."
            exit 1
          fi
          grep -q '/Nexfix-POS-Public/' dist/index.html
          echo "Public Phone Sales build verified."

      - name: Verify public repository deployment token
        env:
          PUBLIC_REPO_DEPLOY_TOKEN: ${{ secrets.PUBLIC_REPO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${PUBLIC_REPO_DEPLOY_TOKEN}" ]; then
            echo "::error::Missing PUBLIC_REPO_DEPLOY_TOKEN. Add a fine-grained token with Contents: Read and write access to sanjula26/Nexfix-POS-Public."
            exit 1
          fi
          repo_json="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${PUBLIC_REPO_DEPLOY_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/sanjula26/Nexfix-POS-Public)"
          can_push="$(printf '%s' "$repo_json" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(String(j.permissions?.push===true));});")"
          if [ "$can_push" != "true" ]; then
            echo "::error::PUBLIC_REPO_DEPLOY_TOKEN is valid but cannot push to sanjula26/Nexfix-POS-Public. Grant Contents: Read and write on that repository."
            exit 1
          fi
          echo "Public repository deployment token is valid and has push permission."

      - name: Publish Phone Sales build to public repository
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PUBLIC_REPO_DEPLOY_TOKEN }}
          external_repository: sanjula26/Nexfix-POS-Public
          publish_branch: gh-pages
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
          commit_message: "Deploy Phone Sales from Nexfix-POS @ ${{ github.sha }}"
