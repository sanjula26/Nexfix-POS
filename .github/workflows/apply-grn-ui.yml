name: Apply GRN UI patch
on:
  push:
    branches: [feature/grn-workflow]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - run: python scripts/apply-grn-ui.py
      - name: Commit patched source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx src/components/AppLayout.tsx
          git diff --cached --quiet || git commit -m 'feat: add GRN navigation and route [skip ci]'
          git push
