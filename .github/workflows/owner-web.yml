name: Owner Web CI
on:
  push:
    branches: [main]
    paths: ['apps/owner-web/**', '.github/workflows/owner-web.yml']
  pull_request:
    paths: ['apps/owner-web/**', '.github/workflows/owner-web.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/owner-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
