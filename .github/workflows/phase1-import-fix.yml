name: Phase 1 Import Fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix machine import
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/lib/store.tsx')
          s = p.read_text(encoding='utf-8')
          line = "import { getMachineIdentity } from './machine';"
          if line not in s:
              needle = "import { syncToGoogleDrive } from './driveSync';"
              if needle not in s:
                  raise SystemExit('driveSync import not found')
              s = s.replace(needle, needle + "\n" + line, 1)
              p.write_text(s, encoding='utf-8')
      - name: Verify import
        run: grep -q "getMachineIdentity.*from './machine'" src/lib/store.tsx
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/store.tsx
          git rm .github/workflows/phase1-import-fix.yml
          git commit -m "Fix machine identity import"
          git push origin HEAD:main
