name: One-time Repair Stock Hardening
on:
  push:
    branches: [main]
jobs:
  harden:
    if: github.actor == 'sanjula26'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch repair stock logic
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/store.tsx')
          s = p.read_text()
          old = '''  const saveRepair = useCallback((r: RepairJob) => {\n    const exists = (state.repairs || []).some(x => x.id === r.id);\n    setState(s => {\n      let job = r;\n      let counters = s.counters;\n      if (!exists && (!r.jobNo || r.jobNo.startsWith('JOB-TEMP'))) {\n        const seq = (s.counters.job || 0) + 1;\n        job = { ...r, jobNo: `JOB-${String(seq).padStart(4, '0')}` };\n        counters = { ...s.counters, job: seq };\n      }\n      // Deduct parts from stock when first saved with parts (simple model)\n      let products = s.products;\n      if (!exists && job.parts?.length) {\n        products = s.products.map(p => {\n          const part = job.parts.find(pt => pt.productId === p.id);\n          return part ? { ...p, stock: Math.max(0, p.stock - part.qty) } : p;\n        });\n      }\n      return {\n        ...s,\n        products,\n        counters,\n        repairs: exists\n          ? (s.repairs || []).map(x => (x.id === r.id ? job : x))\n          : [job, ...(s.repairs || [])],\n      };\n    });\n    pushAudit(exists ? 'UPDATE' : 'CREATE', 'Repair', `${exists ? 'Updated' : 'Opened'} ${r.jobNo || 'job'} · ${r.deviceBrand} ${r.deviceModel}`);\n  }, [state.repairs, pushAudit]);'''
          new = '''  const saveRepair = useCallback((r: RepairJob) => {\n    if (!user) return;\n    const exists = (state.repairs || []).some(x => x.id === r.id);\n    const duplicateJobNo = (state.repairs || []).some(x =>\n      x.id !== r.id && x.jobNo.trim().toLowerCase() === (r.jobNo || '').trim().toLowerCase() && r.jobNo.trim() !== '',\n    );\n    if (duplicateJobNo) {\n      pushAudit('DENIED', 'Repair', `Duplicate job number blocked: ${r.jobNo}`);\n      return;\n    }\n    const cleanParts = (r.parts || []).map(pt => ({ ...pt, name: pt.name.trim(), qty: Number(pt.qty), cost: Number(pt.cost), productId: pt.productId?.trim() || undefined }));\n    if (!r.customerName.trim() || !r.deviceType.trim() || !r.deviceModel.trim() || !r.fault.trim()) return;\n    if (!Number.isFinite(r.laborCost) || r.laborCost < 0) return;\n    if (r.advancePaid != null && (!Number.isFinite(r.advancePaid) || r.advancePaid < 0)) return;\n    if (r.warrantyDays != null && (!Number.isFinite(r.warrantyDays) || r.warrantyDays < 0)) return;\n    if (cleanParts.some(pt => !pt.name || !Number.isInteger(pt.qty) || pt.qty <= 0 || !Number.isFinite(pt.cost) || pt.cost < 0)) return;\n    setState(s => {\n      const old = (s.repairs || []).find(x => x.id === r.id);\n      const oldByProduct = new Map<string, number>();\n      const newByProduct = new Map<string, number>();\n      for (const pt of old?.parts || []) if (pt.productId) oldByProduct.set(pt.productId, (oldByProduct.get(pt.productId) || 0) + pt.qty);\n      for (const pt of cleanParts) if (pt.productId) newByProduct.set(pt.productId, (newByProduct.get(pt.productId) || 0) + pt.qty);\n      let products = s.products;\n      for (const id of new Set([...oldByProduct.keys(), ...newByProduct.keys()])) {\n        const delta = (newByProduct.get(id) || 0) - (oldByProduct.get(id) || 0);\n        const product = s.products.find(p => p.id === id);\n        if (!product || product.stock - delta < 0) return s;\n      }\n      products = s.products.map(p => {\n        const delta = (newByProduct.get(p.id) || 0) - (oldByProduct.get(p.id) || 0);\n        return delta ? { ...p, stock: p.stock - delta } : p;\n      });\n      let job: RepairJob = { ...r, parts: cleanParts, by: r.by || user.name };\n      let counters = s.counters;\n      if (!exists && (!r.jobNo || r.jobNo.startsWith('JOB-TEMP'))) {\n        const seq = (s.counters.job || 0) + 1;\n        job = { ...job, jobNo: `JOB-${String(seq).padStart(4, '0')}` };\n        counters = { ...s.counters, job: seq };\n      }\n      return { ...s, products, counters, repairs: exists ? (s.repairs || []).map(x => x.id === r.id ? job : x) : [job, ...(s.repairs || [])] };\n    });\n    pushAudit(exists ? 'UPDATE' : 'CREATE', 'Repair', `${exists ? 'Updated' : 'Opened'} ${r.jobNo || 'job'} · ${r.deviceBrand} ${r.deviceModel}`);\n  }, [state.repairs, pushAudit, user]);'''
          if old not in s:
              raise SystemExit('target saveRepair block not found')
          p.write_text(s.replace(old, new))
          PY
      - name: Typecheck and build
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit source and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/store.tsx
          git commit -m 'fix: reconcile repair part stock on edits' || true
          git rm .github/workflows/repair-stock-hardening.yml
          git commit -m 'chore: remove repair stock hardening workflow'
          git push